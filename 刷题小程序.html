`,3:`安全措施(有效/独立/可靠/可审计)`,4:`LOPA 保护层分析`,5:`本质安全 / 风险矩阵 / 控制层级`,6:`泄漏保护措施`,7:`建议措施`,8:`LEC 法 / 暴露率`,9:`JSA 作业安全分析`,10:`风险分析方法体系(FTA/ETA/Bow-tie/双重预防)`,11:`特殊作业(八大作业)`,12:`化工过程安全基础`,13:`团体赛 HAZOP 实操`},Hn=[{id:`样题4`,source:`样题`,part:1,module:`M2`,title:`引导词"异常"(OTHER THAN)的应用`,corePoint:`异常=完全替代`,stem:`下列间歇步骤分析场景中,适合使用引导词"异常"组成偏离进行分析的有( )`,options:[{label:`A`,text:`投错物料,A投成B`},{label:`B`,text:`氮气置换后未做置换合格分析直接进料`},{label:`C`,text:`机泵切换时误开备用泵出口阀,两台泵同时运行,流量过大`},{label:`D`,text:`管线吹扫时用压缩空气代替氮气,形成爆炸性混合物`}],answer:[`A`,`B`,`D`],analysis:`"异常"=发生与设计意图完全不同的事件(完全替代)。A 装错物料 ✓、B 该做的置换分析没做就进料 ✓、D 吹扫介质被替代 ✓。C 是"流量过大(MORE)"不是异常 ✗。`,transfer:[`变式:适合"相逆(REVERSE)"的是止回阀失效逆流、物料倒灌;适合"伴随(AS WELL AS)"的是混入杂质、组分变化两相流。`,`口诀记 7 大基本引导词:"你不过白捡一半"(相逆/部分/过量/伴随/空白/减量/异常);"异常"=完全替代,装错料、介质替代、漏做关键步骤都是它。`],tags:[`引导词`,`异常`,`OTHER THAN`,`偏差`,`完全替代`,`真题`]},{id:`样题2`,source:`样题`,part:1,module:`M1`,title:`间歇流程 HAZOP 特点`,corePoint:`间歇≠只查误操作`,stem:`下列关于间歇流程 HAZOP 分析特点说法不正确的是( )`,options:[{label:`A`,text:`间歇流程人为因素类原因占比更高`},{label:`B`,text:`只需分析操作人员在执行特定步骤时发生误操作的风险`},{label:`C`,text:`后果中出现人员伤亡的概率较连续流程高`},{label:`D`,text:`时间依赖性显著,风险随操作阶段动态变化,应按操作阶段划分节点`}],answer:[`B`],analysis:`B 错——间歇流程 HAZOP 除操作误操作外,还必须分析工艺参数偏差、时间顺序(早/晚/先/后)、步骤遗漏/重复、公用工程失效等,"只需分析误操作"以偏概全。`,transfer:[`间歇流程四大特点:人为原因占比高、后果伤亡概率高、时间依赖性强(时序引导词早/晚/先/后)、按操作阶段划分节点。`,`对比:连续流程按管线/设备划分节点,以参数偏差(流量/压力/温度)为主;间歇流程还要分析步骤遗漏/重复、公用工程失效。`],tags:[`间歇流程`,`HAZOP`,`特点`,`节点`,`时序`,`真题`]},{id:`样题1`,source:`样题`,part:1,module:`M1`,title:`HAZOP 的局限性`,corePoint:`局限四表述;此题需核对讲义`,stem:`下列关于 HAZOP 的局限性,描述错误的是( )`,options:[{label:`A`,text:`单独分析各节点,严重危险涉及节点间相互影响时需用事件树和领结图进一步研究`},{label:`B`,text:`无法保证识别所有危险,复杂系统不宜完全依赖 HAZOP,宜联合使用`},{label:`C`,text:`系统高度关联,偏离原因可能源于其他系统;局部减缓措施不一定消除真正原因`},{label:`D`,text:`分析成功取决于组长能力和经验,以及成员知识、经验和协作`}],answer:[`D`],flag:`⚠️ 需结合培训讲义确认:四个选项按权威资料均为局限性的标准表述,未见明显"错误"项。若必选"非局限性",D(团队能力依赖)在部分讲义中被视为"成功条件"而非"技术局限"。考场遇此不确定题,遵守"少选保0.5",切勿乱选。`,analysis:`按权威资料(AQ/T 3049、GB/T 35320、IChemE),A/B/C 均为局限标准表述;D 若判"错误",依据是"团队能力依赖"属于成功条件而非技术局限(口径差异)。`,transfer:[`HAZOP 局限四表述:①单节点分析难覆盖节点间相互影响;②不保证识别全部危险;③原因可能跨系统,局部措施未必治本;④依赖组长与成员能力。`,`考场应对:遇"描述错误的是"且四项都像局限表述,少选保 0.5,别硬选。`],tags:[`HAZOP`,`局限性`,`局限`,`真题`]},{id:`模拟1-1`,source:`模拟1`,part:1,module:`M2`,title:`偏差概念`,corePoint:`偏差=引导词+工艺参数`,stem:`关于 HAZOP 中"偏差"的概念,正确的是( )`,options:[{label:`A`,text:`偏差 = 引导词 + 工艺参数(如"流量/过高")`},{label:`B`,text:`偏差 = 后果 + 原因`},{label:`C`,text:`偏差 = 对设计意图的偏离`},{label:`D`,text:`需剔除无意义的"引导词+参数"组合`}],answer:[`A`,`C`,`D`],analysis:`偏差=引导词+参数=对设计意图的偏离;非所有组合都有意义需剔除。B 错(偏差不是"后果+原因")。`,transfer:[`做题先拆"参数+引导词":流量/过高=流量过高,压力/减量=压力过低,温度/空白=无温度。`,`无意义组合示例:"压力/逆流""流量/反向"等物理上不成立的组合需剔除。`],tags:[`偏差`,`引导词`,`工艺参数`,`设计意图`,`概念`]},{id:`模拟1-2`,source:`模拟1`,part:1,module:`M2`,title:`引导词"减量"`,corePoint:`LESS`,stem:`某储罐液位持续下降,原因是底部出料管线泄漏。描述该偏差最合适的引导词是( )`,options:[{label:`A`,text:`NO(无)`},{label:`B`,text:`LESS(减量)`},{label:`C`,text:`REVERSE(相逆)`},{label:`D`,text:`PART OF(部分)`}],answer:[`B`],analysis:`液位下降=液位减量 → LESS。A 无液位、C 逆流、D 部分均不贴切。`,transfer:[`引导词对照:液位下降=减量(LESS)、液位消失=空白(NO)、物料倒流=相逆(REVERSE)。`,`记 7 大引导词:NO空白、LESS减量、MORE过量、REVERSE相逆、PART OF部分、AS WELL AS伴随、OTHER THAN异常。`],tags:[`引导词`,`减量`,`LESS`,`液位`,`偏差`]},{id:`模拟1-3`,source:`模拟1`,part:1,module:`M2`,title:`引导词"无/空白"`,corePoint:`NO=应发生的不发生`,stem:`下列场景中,适合用引导词"NO(无/空白)"组成偏离的有( )`,options:[{label:`A`,text:`泵故障导致无流量`},{label:`B`,text:`止回阀失效导致逆流`},{label:`C`,text:`搅拌器故障导致无搅拌`},{label:`D`,text:`冷却水中断导致无冷却`}],answer:[`A`,`C`,`D`],analysis:`NO=完全否定:无流量/无搅拌/无冷却 ✓。B 逆流是方向相反 → REVERSE。`,transfer:[`NO=应发生的不发生:无流量、无搅拌、无冷却、无反应、无加热都是。`,`对比:逆流是 REVERSE,不是 NO——方向做反≠没发生。`],tags:[`引导词`,`NO`,`空白`,`无流量`,`偏差`]},{id:`模拟1-6`,source:`模拟1`,part:1,module:`M2`,title:`时序引导词`,corePoint:`间歇流程 +4`,stem:`间歇流程 HAZOP 新增的时序引导词包括( )`,options:[{label:`A`,text:`EARLY(早)`},{label:`B`,text:`LATE(晚)`},{label:`C`,text:`BEFORE(先)`},{label:`D`,text:`AFTER(后)`}],answer:[`A`,`B`,`C`,`D`],analysis:`间歇流程新增时序引导词:EARLY 早、LATE 晚、BEFORE 先、AFTER 后。`,transfer:[`间歇流程 4 个时序引导词:"早晚先后"(EARLY/LATE/BEFORE/AFTER)。`,`必考辨析:7 个基本引导词(你不过白捡一半)+ 4 个时序引导词 = 共 11 个引导词。`],tags:[`引导词`,`时序`,`EARLY`,`LATE`,`间歇流程`,`BEFORE`,`AFTER`]},{id:`模拟1-7`,source:`模拟1`,part:1,module:`M2`,title:`引导词"伴随"`,corePoint:`AS WELL AS=伴随多余东西`,stem:`适合用"AS WELL AS(伴随)"组成偏离的场景有( )`,options:[{label:`A`,text:`反应原料中混入杂质水分`},{label:`B`,text:`物料流向与设计相反`},{label:`C`,text:`进料流量为零`},{label:`D`,text:`反应产物组分变化、出现两相流`}],answer:[`A`,`D`],analysis:`伴随=实现意图同时伴随多余东西:杂质混入、组分变化/两相流 ✓。B 逆流=REVERSE;C 无流量=NO。`,transfer:[`AS WELL AS=实现意图的同时伴随多余的东西:杂质混入、副产物、两相流、第二股进料。`,`对比:方向反=REVERSE、完全没有=NO、比设计多=MORE。`],tags:[`引导词`,`伴随`,`AS WELL AS`,`杂质`,`两相流`]},{id:`模拟1-8`,source:`模拟1`,part:1,module:`M1`,title:`间歇流程节点划分`,corePoint:`按操作阶段划节点`,stem:`关于间歇流程 HAZOP 的节点划分,正确的是( )`,options:[{label:`A`,text:`按操作阶段/步骤划分节点(进料、反应、出料)`},{label:`B`,text:`以管线为基本分析单元`},{label:`C`,text:`分析对象以主体设备(反应器)为主`},{label:`D`,text:`时间顺序与风险变化无需考虑`}],answer:[`A`,`C`],analysis:`间歇流程按操作阶段/步骤划分节点、以主体设备为主。B 错(以管线划分是连续流程);D 错(时间顺序是间歇流程必须考虑的关键参数)。`,transfer:[`节点划分记忆:"间歇看步骤、连续看管线"。间歇流程以操作阶段(进料/反应/出料)划分、以主体设备(反应器)为分析对象。`,`节点划分错误是最常见失分点——记住这句口诀。`],tags:[`间歇流程`,`节点划分`,`操作阶段`,`反应器`]},{id:`模拟1-9`,source:`模拟1`,part:1,module:`M1`,title:`HAZOP 局限性`,corePoint:`单偏差/定性/依赖人员`,stem:`关于 HAZOP 的局限性,正确的是( )`,options:[{label:`A`,text:`一次只分析一种偏差,不覆盖多重故障连锁失效`},{label:`B`,text:`本质为定性方法,不能量化风险`},{label:`C`,text:`分析成败取决于组长能力与成员的知识、协作`},{label:`D`,text:`能充分处理系统内节点之间的相互影响`}],answer:[`A`,`B`,`C`],analysis:`D 错:HAZOP 不能充分处理节点间相互影响,需事件树/领结图补充。`,transfer:[`HAZOP 三大局限:一次一偏差(不覆盖多重失效)、定性方法(不量化风险)、依赖人员能力。`,`补充:不能充分处理节点间相互影响 → 用事件树(ETA)/领结图(Bow-tie)补充。`],tags:[`HAZOP`,`局限性`,`定性`,`节点间影响`]},{id:`模拟1-5`,source:`模拟1`,part:1,module:`M1`,title:`HAZOP 小组`,corePoint:`多学科4~8人、组长引导式`,stem:`关于 HAZOP 分析小组,正确的是( )`,options:[{label:`A`,text:`可由组长一人独立完成分析`},{label:`B`,text:`一般4~8人,须为多学科小组`},{label:`C`,text:`组长应精通 HAZOP 方法,以引导方式推进讨论,不可过于强势`},{label:`D`,text:`记录员只需记录建议措施,无需记录讨论内容`}],answer:[`B`,`C`],analysis:`A 错(不能单人);D 错(记录员须完整记录讨论内容)。`,transfer:[`HAZOP 小组:4~8 人多学科、组长精通方法以引导方式讨论、记录员完整记录、成员覆盖工艺/设备/仪表/操作。`,`易错:组长不是"权威拍板"而是"引导启发";单人不能完成分析。`],tags:[`HAZOP`,`小组`,`组长`,`多学科`,`记录员`]},{id:`模拟1-10`,source:`模拟1`,part:1,module:`M1`,title:`事故案例应用`,corePoint:`反查覆盖+核实现有措施`,stem:`在 HAZOP 分析中应用事故案例,正确的做法有( )`,options:[{label:`A`,text:`收集同类装置历史事故、未遂事件报告作为输入资料`},{label:`B`,text:`直接照搬事故通报中的后果等级`},{label:`C`,text:`若同类事故原因在本装置同样存在,应核实现有保护措施有效性,必要时开展 LOPA`},{label:`D`,text:`事故案例只需在报告正文罗列,无需纳入偏差分析`}],answer:[`A`,`C`],analysis:`B 错(后果等级应结合本装置实际,不照搬);D 错(应纳入偏差分析)。`,transfer:[`事故案例三正确做法:收集同类历史事故作输入、核实现有措施有效性(必要时 LOPA)、反查覆盖偏差。`,`两个陷阱:后果等级不照搬(结合本装置)、不"只罗列不进偏差"。`],tags:[`事故案例`,`HAZOP`,`LOPA`,`保护措施`,`未遂事件`]},{id:`样题7`,source:`样题`,part:1,module:`M1`,title:`事故案例在 HAZOP 中的应用`,corePoint:`案例反查纳入偏差分析+核实现有措施`,stem:`收集到同类装置3起反应釜超压爆炸事故,关于事故案例在 HAZOP 分析中的应用,做法正确的有( )`,options:[{label:`A`,text:`设计时针对性设置了安全措施,则无需体现事故相关风险`},{label:`B`,text:`同类事故的后果描述和等级可直接使用事故通报内容确定`},{label:`C`,text:`若同类事故的原因在本装置同样存在,应核实现有保护措施的有效性,例如针对场景开展 LOPA 分析`},{label:`D`,text:`分析报告正文列举同类事故,无需纳入具体偏差分析`}],answer:[`C`],analysis:`A 错(即使设置了措施,也必须体现并验证其有效性);B 错(后果应结合本装置实际工艺条件,不能照搬);D 错(事故案例应反查/纳入具体偏差分析)。`,transfer:[`与模拟1-10 同考点:事故案例必须纳入具体偏差分析、核实现有措施有效性(如 LOPA)、不照搬后果等级。`,`关键:"设置了安全措施"≠"措施有效"——必须体现并验证有效性。`],tags:[`事故案例`,`HAZOP`,`LOPA`,`偏差分析`,`真题`]},{id:`模拟1-11`,source:`模拟1`,part:1,module:`M1`,title:`一次只分析一种偏差`,corePoint:`聚焦完整、避免打断`,stem:`"一次只分析一种偏差,全部偏差分析完成后再考虑整改措施"这一纪律的意义有( )`,options:[{label:`A`,text:`保证分析聚焦、完整,避免偏差间相互干扰`},{label:`B`,text:`允许在分析中途讨论整改方案以提高效率`},{label:`C`,text:`避免分析思路被打断`},{label:`D`,text:`提高小组成员参与度`}],answer:[`A`,`C`],analysis:`B 错(应避免中途讨论);D 与此纪律无关。`,transfer:[`"一次只分析一种偏差、分析完再想整改"——保证聚焦完整、避免思路打断、防止偏离主题。`,`纪律意义不等于"提高参与度";中途讨论整改方案是被禁止的。`],tags:[`HAZOP`,`纪律`,`一次一偏差`,`聚焦`]},{id:`样题5`,source:`样题`,part:2,module:`M3`,title:`温度升高的原因`,corePoint:`原因四类——设备/仪表/人为/公用工程`,stem:`在温度升高的事故剧情中,可能的原因包括( )`,options:[{label:`A`,text:`催化剂活性过高`},{label:`B`,text:`仪表故障,人员调小冷却循环量`},{label:`C`,text:`冷却水温度高`},{label:`D`,text:`物料大量气化`}],answer:[`A`,`B`,`C`,`D`],analysis:`"温度过高"偏离的原因链条——反应热↑(A 催化剂活性高)、冷却↓(B 人为调小、C 冷却水温高)、进料异常(D 气化)。全部正确。`,transfer:[`原因四类口诀:设备(泄漏/气化/催化)、仪表(故障/误动作)、人为(误操作)、公用工程(冷却水断/温度高)。`,`反推逻辑:"温度过高"的完整链条=产热↑ + 散热↓ + 进料异常,缺一不可。`],tags:[`原因分析`,`温度过高`,`催化剂`,`冷却水`,`公用工程`,`真题`]},{id:`样题3`,source:`样题`,part:2,module:`M3`,title:`事故场景需分析的偏离`,corePoint:`沿事故链找偏差;A 有口径争议`,stem:`张掖耀邦硫化氢中毒事故(盐酸快速加入含硫废水池→硫化氢快速溢出→人员未防护进入吸入中毒),需分析的偏离是( )`,options:[{label:`A`,text:`外漏`},{label:`B`,text:`加料操作步骤异常`},{label:`C`,text:`人员误操作`},{label:`D`,text:`压力过高`}],answer:[`A`,`B`,`C`],flag:`A(外漏)视讲义口径:若把"敞开池气体逸散"归为外漏则选,否则有争议。B/C 把握度最高。保守策略:不确定 A 时只选 BC(仍得 0.5 分)。`,analysis:`B 加料速度/步骤异常 ✓、C 未穿戴防护冒险进入 ✓;A 若讲义把"敞开池气体逸散"归为外漏则选,否则有争议;D 常压敞开池,事故机理不是超压 ✗。`,transfer:[`分析事故场景先画因果链:加料异常→气体快速溢出→人员暴露中毒,沿链找每个环节的偏差。`,`常压敞开池没有"压力过高"机理——超压只适用于密闭系统,选前先问"这个系统会憋压吗"。`],tags:[`事故场景`,`偏离`,`中毒`,`硫化氢`,`因果链`,`真题`]},{id:`模拟1-4`,source:`模拟1`,part:2,module:`M3`,title:`后果分析`,corePoint:`假定措施失效→最严重后果`,stem:`HAZOP 分析后果(Consequence)时,应当( )`,options:[{label:`A`,text:`假定所有现有安全措施有效,评估正常后果`},{label:`B`,text:`假定所有现有安全措施失效,评估最严重后果`},{label:`C`,text:`后果描述应细化到设备位号、管线、部位`},{label:`D`,text:`分析到"超压"为止即可,不必追到泄漏爆炸`}],answer:[`B`,`C`],analysis:`A 错(应假定失效);D 错(应追到后果链末端,如泄漏→爆炸→火灾,而非停在超压)。`,transfer:[`后果分析铁律:假定所有现有措施失效 → 评估最严重后果 → 追到后果链末端(超压→泄漏→爆炸→火灾→人员伤亡)。`,`细化到设备位号/管线/部位;不要停在"超压"这一层。`],tags:[`后果分析`,`措施失效`,`最严重后果`,`后果链`]},{id:`样题14`,source:`样题`,part:3,module:`M6`,title:`保护措施不符合有效性(需结合 PID)`,corePoint:`措施要针对剧情原因或后果`,stem:`结合 PID-CP25-06 及 HAZOP 节选,选出保护措施不符合保护措施有效性要求的是( )`,options:[{label:`A`,text:`剧情1(炉膛温度过高,原因燃料气量大)→ 燃料气进料压力高报警 PAH037102`},{label:`B`,text:`剧情2(炉膛温度过低,原因市政管网燃料气中断)→ 自控回路 TIC037103`},{label:`C`,text:`剧情3(进炉燃料气压力过低,原因 TIC103 故障阀关小)→ 主燃料气压力低低联锁 PSLL-037103`},{label:`D`,text:`剧情4(炉膛压力过高/回火闪爆)→ 氧含量高报警 AIH037101`}],answer:[`A`,`B`,`C`,`D`],flag:`⚠️ 需以附件 PID 核对测点为准。`,analysis:`①压力高报警不能防止"燃料气量大→温度过高"(压力高≠流量大),且无配套响应;②TIC 回路无法补偿气源中断,且正是剧情1初始事件本身不独立;③PSLL 测点位于阀 PV101 上游,阀故障关小时上游憋压,检测不到进炉实际压力,联锁无效;④氧含量报警不针对炉膛压力过高/回火。`,transfer:[`措施有效性三问:①针对剧情的"原因或后果"吗?②与初始事件独立吗?③能有效执行/触发吗?`,`联锁无效的经典坑:测点位置不覆盖故障场景(PSLL 在阀上游,阀关小→上游憋压测不到),看到"测点位置"就要警惕。`],tags:[`安全措施`,`有效性`,`PID`,`联锁`,`测点`,`真题`]},{id:`样题13`,source:`样题`,part:3,module:`M6`,title:`安全措施有效性判定`,corePoint:`报警+操作员响应(≥PST)、独立自动联锁有效;巡检/监盘无效`,stem:`风险场景"高压分离器液位无→高压气体窜入低压闪蒸罐→低压设备超压爆炸",可判定为有效的是( )`,options:[{label:`A`,text:`低压闪蒸罐设压力高报警,操作规程要求报警后操作员10分钟内打开现场放空阀`},{label:`B`,text:`高压分离器设液位低低联锁,液位<15%自动联锁切断出口切断阀`},{label:`C`,text:`外操每小时现场巡检核对液位计,发现液位低通知内操调整`},{label:`D`,text:`DCS 设液位指示,内操监盘发现后调节液位控制阀`}],answer:[`A`,`B`],analysis:`A 报警+操作员响应,10min 满足 PST ✓;B 独立自动联锁直接切断窜压路径 ✓。C 巡检不作为 IPL ✗;D 依赖人工监盘、与场景同源监控,有效性不足 ✗。`,transfer:[`有效保护层两模板:①报警+操作员响应(响应时间≥PST、任务单一);②独立自动联锁直接切断路径。`,`无效三件套:人工巡检、人工监盘、与场景同源的 DCS 监控——都不作为 IPL。`],tags:[`安全措施`,`有效性`,`报警`,`联锁`,`巡检`,`PST`,`真题`]},{id:`样题12`,source:`样题`,part:3,module:`M6`,title:`安全措施独立性`,corePoint:`共用设备/失效机理/电源=不独立`,stem:`下列哪些情形会使拟识别的安全措施不满足独立性要求,从而不能计入风险降低( )`,options:[{label:`A`,text:`初始事件为"压力控制回路故障",拟增设一安全阀`},{label:`B`,text:`初始事件为"液位计故障显示假低致冒罐",拟用同一块液位计触发的 SIS 高高联锁关阀`},{label:`C`,text:`初始事件为"出料泵电机烧毁",拟用同一回路上的热继电器跳泵保护(同一失效机理)`},{label:`D`,text:`初始事件为"全厂断电",拟用同一 UPS 供电的 ESD 系统`}],answer:[`B`,`C`,`D`],analysis:`选"不满足独立性"的。A 安全阀独立于压力回路 ✅ 可计入。B 共用液位计 ✗;C 共用失效机理 ✗;D 共用电源 ✗。`,transfer:[`不独立四情形:共用传感器/仪表、共用执行机构、共用失效机理、共用电源(如 UPS)。`,`记忆:"同一个东西坏两次"=不独立;初始事件"控制回路故障",安全阀与其无关 → 独立。`],tags:[`安全措施`,`独立性`,`共用`,`电源`,`IPL`,`真题`]},{id:`样题11`,source:`样题`,part:3,module:`M6`,title:`安全措施描述`,corePoint:`针对原因/中间事件/偏离/后果、独立、节点内外、报警上限`,stem:`关于 HAZOP 分析安全措施的描述,正确的是( )`,options:[{label:`A`,text:`应分别针对原因、中间事件、偏离、后果识别已有安全措施`},{label:`B`,text:`安全措施应独立于初始事件`},{label:`C`,text:`安全措施不限于本节点,可在节点内也可在节点外`},{label:`D`,text:`一条剧情上多个报警,最多只能将两个报警作为独立保护层`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。识别安全措施要针对四环节、独立于初始事件、可在节点内外、多报警最多 2 个作独立保护层。`,transfer:[`识别安全措施四点:针对原因/中间事件/偏离/后果四个环节分别识别;独立于初始事件;可在节点内或外;多报警最多 2 个作保护层。`,`"节点外"也要识别——防止"只见树木不见森林"。`],tags:[`安全措施`,`识别`,`节点`,`报警上限`,`独立`,`真题`]},{id:`样题10`,source:`样题`,part:3,module:`M6`,title:`报警成为有效安全措施的条件`,corePoint:`报警须靠人工响应`,stem:`关于报警要成为有效安全措施应满足的条件,说法正确的是( )`,options:[{label:`A`,text:`操作人员应有足够响应时间,至少有5min的响应时间`},{label:`B`,text:`指示(信号)必须是可检测到的`},{label:`C`,text:`操作任务应具有单一性和可操作性,不宜同时执行其它任务`},{label:`D`,text:`报警信号可依赖 DCS 自动触发而无需人工干预,可作为有效安全措施`}],answer:[`A`,`B`,`C`],analysis:`A 关键报警 5min 响应(ISA-18.2)✓;B 可检测 ✓;C 任务单一 ✓。D 错:报警必须靠人工响应才构成保护层,不能自动动作。`,transfer:[`报警成有效安全措施四条件:信号可检测、响应时间够(关键报警 5min/PST)、任务单一可执行、靠人工响应。`,`最常考陷阱:报警不能自动动作,必须依赖操作员人工响应;也不能作为重大危害最后一道防线。`],tags:[`报警`,`安全措施`,`有效性`,`响应时间`,`人工响应`,`真题`]},{id:`样题19`,source:`样题`,part:3,module:`M6`,title:`安全措施可靠性`,corePoint:`铅封开/锁开→可靠性`,stem:`HAZOP 报告建议措施"气液分离罐 D-10 出口蝶阀误关,设备及管道存在超压风险,建议设置铅封开或锁开",该措施是从安全措施的( )特性提出的。`,options:[],answer:[`可靠性`],analysis:`"该动时能动"的概率。蝶阀误关会使超压泄压保护(安全阀)失效;铅封开/锁开把阀门锁定开启,防止误关,确保泄压保护在需要时可靠可用。规范依据:TSG ZF001 安全阀进出口截断阀须铅封锁定全开。`,transfer:[`铅封开/锁开、定期试验、定期检定 → 提高"该动时能动"的可靠性。`,`安全阀进出口截断阀必须铅封锁定全开(TSG ZF001),否则可能因误关导致泄压保护失效。`],tags:[`可靠性`,`铅封`,`锁开`,`安全阀`,`误关`,`真题`],kind:`fill`},{id:`模拟1-18`,source:`模拟1`,part:3,module:`M6`,title:`报警有效性`,corePoint:`报警不能当最后一道防线`,stem:`报警要成为有效安全措施,应满足的条件有( )`,options:[{label:`A`,text:`信号必须可检测、清晰、无歧义、按优先级呈现`},{label:`B`,text:`操作任务应单一,不宜要求同时执行其它任务`},{label:`C`,text:`报警依赖人工响应,不能自动完成保护动作`},{label:`D`,text:`报警可作为重大危害的最后一道防线`}],answer:[`A`,`B`,`C`],analysis:`D 错:报警不能作为重大危害的最后一道防线。`,transfer:[`报警四条件:可检测清晰无歧义、任务单一、人工响应、不能当最后防线。`,`对比记忆:报警是"人机结合"的保护层,去掉人就不成立。`],tags:[`报警`,`有效性`,`人工响应`,`最后防线`]},{id:`模拟1-20`,source:`模拟1`,part:3,module:`M6`,title:`铅封开/锁开→可靠性`,corePoint:`同题19`,stem:`"安全阀进出口切断阀加铅封并锁定全开"主要提高安全措施的( )特性`,options:[{label:`A`,text:`有效性`},{label:`B`,text:`独立性`},{label:`C`,text:`可靠性`},{label:`D`,text:`可审计性`}],answer:[`C`],analysis:`防止关键阀门误关导致超压保护失效,提高"该动时能动"的可靠性。`,transfer:[`四特性区分:有效性=能挡住吗、独立性=独立于事故吗、可靠性=该动时能动吗、可审计性=可追溯吗。`,`铅封锁定=可靠性;加装联锁=有效性;独立 UPS=独立性。`],tags:[`可靠性`,`铅封`,`锁开`,`特性`]},{id:`模拟1-21`,source:`模拟1`,part:3,module:`M6`,title:`识别现有安全措施`,corePoint:`针对四环节、节点内外、多报警上限2个`,stem:`HAZOP 识别现有安全措施时,正确的做法有( )`,options:[{label:`A`,text:`应分别针对原因、中间事件、偏离、后果识别`},{label:`B`,text:`安全措施可以在节点内也可以在节点外`},{label:`C`,text:`一条剧情上多个报警最多作为两个独立保护层`},{label:`D`,text:`只需识别节点内部的安全措施`}],answer:[`A`,`B`,`C`],analysis:`D 错(不限于节点内)。`,transfer:[`识别措施:针对四环节、节点内外、多报警最多 2 个作 IPL。`,`注意"只需识别节点内"是错的——识别范围含节点外。`],tags:[`安全措施`,`识别`,`节点内外`,`报警上限`]},{id:`样题16`,source:`样题`,part:4,module:`M4`,title:`LOPA 计算(死亡可能性)`,corePoint:`LOPA 公式`,stem:`反应器失冷却水升温→反应失控爆炸→1名操作员死亡。冷却水失效频率1×10⁻¹次/年;温度高报警 TIH101(PFD=0.1)、温度高联锁 TIHH101(SIL2,PFD=0.01)均满足功能要求;操作员每天在现场12小时;爆炸后一半机会逃离。用 LOPA 计算造成该操作员死亡的可能性是( )`,options:[],answer:[`2.5×10⁻⁵`,`2.5e-5`],analysis:`死亡频率 = 1×10⁻¹ × 0.1 × 0.01 × (12/24) × 0.5 = 2.5×10⁻⁵ (次/年)。关键:报警 PFD=0.1、SIL2 联锁 PFD=0.01、暴露 12/24=0.5、致死 0.5,一个都不能漏乘。`,transfer:[`LOPA 公式:后果频率 = IE频率 × 使能条件 × ∏PFD × 点火 × 暴露 × 致死——因子一个不漏。`,`PFD 记牢:报警+人=0.1、SIL2 联锁=0.01;暴露=在场时间/总时间;致死=伤亡比例。`,`变式:若再加一个安全阀(0.01),结果再乘 0.01——考"增加保护层降风险"。`],tags:[`LOPA`,`计算`,`PFD`,`SIL2`,`暴露`,`致死频率`,`真题`],kind:`fill`},{id:`样题17`,source:`样题`,part:4,module:`M4`,title:`LOPA 风险降低(SIL/PFD)`,corePoint:`残余频率与目标对比`,stem:`"调节阀故障全开→进料过多→反应失控→爆炸",初始事件频率1×10⁻²/年,现有 BPCS 报警+操作员干预(PFD=0.1)、安全阀泄放(PFD=0.01),要达到1×10⁻⁶/年的可接受风险,可以提出的建议措施是( )`,options:[{label:`A`,text:`增加一个 SIS 联锁,SIL2 等级(PFD=0.01)`},{label:`B`,text:`增加第二个独立报警`},{label:`C`,text:`增加操作人员巡检频次`},{label:`D`,text:`无需增加,现有保护层已足够`}],answer:[`A`],analysis:`现有残余=1×10⁻²×0.1×0.01=1×10⁻⁵/年;目标 1×10⁻⁶,还需降 10 倍。A:1×10⁻⁵×0.01=1×10⁻⁷ 达标 ✓。B 同一场景"报警+人"最多 1 个 IPL ✗;C 巡检不作为 IPL ✗;D 未达标 ✗。`,transfer:[`算残余频率 → 对比目标 → 缺多少降多少;需要降 10 倍 → 加一个 PFD=0.01 的 SIL2 联锁。`,`陷阱:同一场景"报警+人"最多 1 个 IPL,不能靠加报警降风险;巡检不作为 IPL。`],tags:[`LOPA`,`SIL`,`PFD`,`残余风险`,`风险降低`,`真题`]},{id:`样题8`,source:`样题`,part:4,module:`M4`,title:`风险评估基础概念`,corePoint:`广泛可接受≠无需警惕`,stem:`关于风险评估,下列说法不正确的是( )`,options:[{label:`A`,text:`企业可根据自身特点制定事故后果分类的严重程度等级和可接受标准`},{label:`B`,text:`独立保护层是能阻止事故场景向不利后果发展的设备/系统/行动,并独立于初始事件`},{label:`C`,text:`广泛可接受区域"无需对风险保持警惕"`},{label:`D`,text:`多个初始事件导致同一后果,最终事故发生频率等于各独立初始事件频率的总和`}],answer:[`C`],analysis:`C 错:广泛可接受区域剩余风险可忽略、一般不要求进一步措施,但仍需对该水平风险保持警惕。`,transfer:[`广泛可接受区域=剩余风险可忽略、一般不要求进一步措施,但"无需警惕"是错误表述。`,`多初始事件同后果 → 频率相加(频率叠加);IPL 定义=独立于初始事件、能阻止场景发展的设备/系统/行动。`],tags:[`风险评估`,`可接受风险`,`IPL`,`频率叠加`,`真题`]},{id:`模拟1-12`,source:`模拟1`,part:4,module:`M4`,title:`可作为 IPL`,corePoint:`独立 SIS、安全阀 ✓;巡检、共电源 ✗`,stem:`下列措施中,可作为独立保护层(IPL)计入风险降低的是( )`,options:[{label:`A`,text:`独立于 BPCS 的 SIS 高液位联锁切断进料`},{label:`B`,text:`操作规程规定操作员定期巡检`},{label:`C`,text:`正确设计、定期检验的安全阀`},{label:`D`,text:`与初始事件共用同一 UPS 供电的 ESD 系统`}],answer:[`A`,`C`],analysis:`B 巡检不算 IPL;D 共用 UPS 不独立。`,transfer:[`典型 IPL:独立 SIS 联锁、正确设计定期检验的安全阀、报警+操作员(≥10min)、围堰、防爆墙。`,`非 IPL:巡检、培训、消防应急、共电源 ESD、与初始事件同传感器的 SIS。`],tags:[`IPL`,`独立保护层`,`SIS`,`安全阀`,`UPS`]},{id:`模拟1-13`,source:`模拟1`,part:4,module:`M4`,title:`不作为 IPL`,corePoint:`巡检/培训/消防队应急不算`,stem:`下列措施,通常不作为独立保护层(IPL)的有( )`,options:[{label:`A`,text:`操作员巡检`},{label:`B`,text:`培训教育`},{label:`C`,text:`工厂消防队应急响应`},{label:`D`,text:`独立 SIS 联锁`}],answer:[`A`,`B`,`C`],analysis:`D 独立 SIS 是典型 IPL。`,transfer:[`不作为 IPL:巡检、培训教育、工厂消防队应急响应。`,`对比:独立 SIS 联锁、安全阀、爆破片是典型 IPL。`],tags:[`IPL`,`巡检`,`培训`,`消防`,`SIS`]},{id:`模拟1-14`,source:`模拟1`,part:4,module:`M4`,title:`SIL2 PFD`,corePoint:`SIL 数值`,stem:`SIL2 级安全仪表功能(SIF)的平均要求时失效概率(PFDavg)范围为( )`,options:[{label:`A`,text:`1×10⁻¹~1×10⁻²`},{label:`B`,text:`1×10⁻²~1×10⁻³`},{label:`C`,text:`1×10⁻³~1×10⁻⁴`},{label:`D`,text:`1×10⁻⁴~1×10⁻⁵`}],answer:[`B`],analysis:`SIL1=10⁻¹~10⁻²、SIL2=10⁻²~10⁻³、SIL3=10⁻³~10⁻⁴、SIL4=10⁻⁴~10⁻⁵。`,transfer:[`PFDavg:SIL1=10⁻¹~10⁻²、SIL2=10⁻²~10⁻³、SIL3=10⁻³~10⁻⁴、SIL4=10⁻⁴~10⁻⁵。`,`SIL 越高,PFD 越小;口诀:"SIL 几就约等于 10 的负几"。`],tags:[`SIL`,`PFD`,`SIF`,`安全完整性`]},{id:`模拟1-15`,source:`模拟1`,part:4,module:`M4`,title:`LOPA 计算`,corePoint:`使能/点火/暴露/致死都乘`,stem:`某储罐进料泵故障导致溢流,初始事件频率 1×10⁻¹ 次/年;设有高液位报警+操作员响应(PFD=0.1)和安全阀(PFD=0.01);装置 50% 时间处于进料状态;点火概率 0.5、人员暴露概率 0.1、致死概率 0.1。用 LOPA 计算人员死亡频率约为( )`,options:[{label:`A`,text:`2.5×10⁻⁸`},{label:`B`,text:`2.5×10⁻⁶`},{label:`C`,text:`2.5×10⁻⁷`},{label:`D`,text:`5×10⁻⁷`}],answer:[`C`],analysis:`死亡频率 = 1×10⁻¹ × 0.5 × 0.1 × 0.01 × 0.5 × 0.1 × 0.1 = 2.5×10⁻⁷ (次/年)。使能(50%进料=0.5)、点火(0.5)、暴露(0.1)、致死(0.1)都不能漏乘。`,transfer:[`完整 LOPA:IE × 使能(50%进料=0.5)× 报警PFD(0.1)× 安全阀PFD(0.01)× 点火(0.5)× 暴露(0.1)× 致死(0.1)。`,`使能条件(装置是否处于危险工况)、点火概率在计算题里最容易漏乘。`],tags:[`LOPA`,`计算`,`使能`,`点火`,`暴露`,`致死`]},{id:`模拟1-16`,source:`模拟1`,part:4,module:`M4`,title:`报警响应时间`,corePoint:`5min/ PST /作IPL≥10min`,stem:`报警+操作员响应要作为独立保护层,关于操作人员响应时间,正确的是( )`,options:[{label:`A`,text:`关键报警(ISA-18.2)响应时限为5分钟`},{label:`B`,text:`必须在过程安全时间(PST)内完成响应`},{label:`C`,text:`作为 IPL 一般要求 ≥10 分钟且有书面程序支撑`},{label:`D`,text:`无需考虑响应时间`}],answer:[`A`,`B`,`C`],analysis:`D 错。`,transfer:[`三个时间概念:关键报警 5min(ISA-18.2)、必须 <PST(过程安全时间)、作 IPL 一般 ≥10min + 书面程序。`,`响应时间不够 → 报警不能作为 IPL。`],tags:[`报警`,`响应时间`,`PST`,`IPL`,`5min`]},{id:`模拟1-17`,source:`模拟1`,part:4,module:`M4`,title:`多初始事件频率叠加`,corePoint:`频率相加`,stem:`多个初始事件导致同一个后果,该后果的发生频率计算方法是( )`,options:[{label:`A`,text:`等于各初始事件频率中的最大值`},{label:`B`,text:`等于各独立初始事件频率的总和`},{label:`C`,text:`等于各初始事件频率的乘积`},{label:`D`,text:`取各初始事件频率的平均值`}],answer:[`B`],analysis:`各独立初始事件频率之和(频率叠加)。`,transfer:[`多初始事件同一后果 → 频率=各初始事件频率之和(不是最大、不是乘积)。`,`例:两个独立泄漏源都可能导致爆炸,爆炸频率=泄漏1频率+泄漏2频率。`],tags:[`频率叠加`,`初始事件`,`后果频率`,`LOPA`]},{id:`样题18`,source:`样题`,part:5,module:`M9`,title:`本质安全与风险控制优先级`,corePoint:`消除>替代>工程>管理>PPE`,stem:`识别出"氧化剂系统与含氯/还原性物料系统存在潜在串料可能",从本质安全和风险控制优先级角度,最有效、最根本的建议措施是( )`,options:[{label:`A`,text:`增加 H₂O₂ 浓度在线分析高报警`},{label:`B`,text:`增设配制釜温度高高联锁停搅拌`},{label:`C`,text:`选择安全阀+爆破片配置`},{label:`D`,text:`实施物理隔离(拆除连通管或加盲板),并规定"禁止临时软管互连未经审批"`}],answer:[`D`],analysis:`物理隔离属"消除/隔离"最高优先层级,从源头消除危险连接;A/B/C 都是外加保护层、被动响应。`,transfer:[`控制层级(最高到最低):消除 > 替代 > 工程控制 > 管理控制 > PPE。`,`物理隔离(拆管/加盲板)属"消除"层级最根本;报警/联锁/安全阀都是外加保护层,优先级低。`],tags:[`本质安全`,`控制层级`,`消除`,`物理隔离`,`保护层`,`真题`]},{id:`模拟1-22`,source:`模拟1`,part:5,module:`M9`,title:`本质安全四原则`,corePoint:`最小化/替代/缓和/简化`,stem:`下列本质安全设计原则与实例对应正确的有( )`,options:[{label:`A`,text:`最小化 —— 用微通道反应器降低危险物料存量`},{label:`B`,text:`替代 —— 用过氧化氢法替代氯醇法生产环氧丙烷`},{label:`C`,text:`缓和 —— 氨合成压力由高压降至低压`},{label:`D`,text:`简化 —— 减少不必要的管道连接、法兰接头`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`本质安全四原则:最小化(降存量)、替代(换工艺/物料)、缓和(降压力温度)、简化(减少连接)。`,`经典例子:微通道反应器=最小化;过氧化氢法替代氯醇法=替代;低压合成=缓和;少法兰=简化。`],tags:[`本质安全`,`最小化`,`替代`,`缓和`,`简化`]},{id:`模拟1-23`,source:`模拟1`,part:5,module:`M9`,title:`风险矩阵管控要求`,corePoint:`红色=不可接受立即整改`,stem:`风险矩阵法 R=L×S 中,风险等级为"重大风险(红色)"时,对应的管控要求有( )`,options:[{label:`A`,text:`在采取措施降低风险前不能继续作业`},{label:`B`,text:`只需保持现有管理程序即可`},{label:`C`,text:`属不可接受风险,应立即整改`},{label:`D`,text:`由岗位级负责管控`}],answer:[`A`,`C`],analysis:`B 错(不是"保持现状");D 错(红色由公司级管控)。`,transfer:[`风险矩阵四色:红色(重大)=不可接受、立即整改、降低前不作业、公司级管控;橙/黄/蓝依次降级管控。`,`"只需保持现有程序"和"岗位级管控"都是红色风险的错误表述。`],tags:[`风险矩阵`,`红色`,`重大风险`,`管控`,`四色`]},{id:`模拟2-24`,source:`模拟2`,part:5,module:`M9`,title:`风险矩阵计算`,corePoint:`L 频率分级 / S 四维取高 / 可接受=一般风险区域`,stem:`某反应釜超压泄漏场景,泄漏频率为 2×10⁻³ 次/年;可能造成 2 人死亡、直接经济损失 500 万元。按官方附件8 风险矩阵法,该场景 L、S 分级、R 值及可接受性为( )`,options:[{label:`A`,text:`L=4(高)、S=5(重大)、R=20,属不可接受风险(在一般风险区域外)`},{label:`B`,text:`L=4、S=4、R=16,一般风险,可接受`},{label:`C`,text:`L=5、S=5、R=25,不可接受`},{label:`D`,text:`L=3、S=5、R=15,较大风险`}],answer:[`A`],analysis:`L:2×10⁻³∈[10⁻³,10⁻²]→L=4;S:出现死亡→S=5(重大),财务 500 万∈[100万,1000万)→S=4,人员与财务取最高 S=5;R=4×5=20,在一般风险区域外→不可接受。`,transfer:[`官方 L 分级:5>10⁻²、4=10⁻³~10⁻²、3=10⁻⁴~10⁻³、2=10⁻⁵~10⁻⁴、1<10⁻⁵。`,`S 四维(人员/环境/财务/声誉)取最高;出现死亡=5;R=L×S;R 在一般风险区域外=不可接受。`,`变式:3×10⁻⁴ 次/年 → L=3;若只重伤无死亡 → S=4。`],tags:[`风险矩阵`,`计算`,`L分级`,`S分级`,`可接受风险`,`官方附件8`]},{id:`模拟2-25`,source:`模拟2`,part:5,module:`M9`,title:`风险矩阵 S 分级`,corePoint:`官方 S 分级`,stem:`按官方附件8 风险矩阵法的后果严重度(S)分级,下列判定正确的有( )`,options:[{label:`A`,text:`出现 1 人死亡 → S=5(重大)`},{label:`B`,text:`造成 2 人重伤 → S=4(较大)`},{label:`C`,text:`轻微伤害需急救处理 → S=2(低)`},{label:`D`,text:`直接经济损失 500 万元 → S=4(较大)`}],answer:[`A`,`B`,`C`,`D`],analysis:`出现死亡→S5;3人以下重伤→S4;轻微伤害需急救→S2;直接损失 100万~1000万(含100万)→S4。`,transfer:[`官方 S 分级:死亡=5、3 人以下重伤=4、轻伤需急救=2;直接损失 100万~1000万=4、≥1000万=5。`,`S 取值:人员/环境/财务/声誉四个维度取最高的那个。`],tags:[`风险矩阵`,`S分级`,`严重度`,`官方附件8`]},{id:`样题9`,source:`样题`,part:6,module:`M5`,title:`针对泄漏的保护措施`,corePoint:`检测—隔离—稀释—围堵`,stem:`针对泄漏考虑的保护措施有( )`,options:[{label:`A`,text:`检测`},{label:`B`,text:`隔离`},{label:`C`,text:`稀释`},{label:`D`,text:`围堵`}],answer:[`A`,`B`,`C`,`D`],analysis:`检测(气体/液体监测)、隔离(手动或遥控切断)、稀释(蒸汽/氮气)、围堵(事故池/事故槽)。`,transfer:[`泄漏保护四类:检测(气体/液体监测)、隔离(手动/遥控切断)、稀释(蒸汽/氮气)、围堵(事故池)。`,`记忆口诀:"检隔稀围"——四选全。`],tags:[`泄漏`,`保护措施`,`检测`,`隔离`,`稀释`,`围堵`,`真题`]},{id:`模拟1-19`,source:`模拟1`,part:6,module:`M5`,title:`泄漏保护四类`,corePoint:`同题9`,stem:`针对泄漏的保护措施,按"检测—隔离—稀释—围堵"分类,对应正确的有( )`,options:[{label:`A`,text:`可燃气体检测器 → 检测`},{label:`B`,text:`遥控紧急切断阀 → 隔离`},{label:`C`,text:`用氮气稀释泄漏物料 → 稀释`},{label:`D`,text:`事故池收集泄漏物 → 围堵`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`分类对应:可燃气体检测器=检测、紧急切断阀=隔离、氮气稀释=稀释、事故池=围堵。`,`常见错配:把"事故池"归为隔离(是围堵);把"氮气吹扫"归为隔离(是稀释)。`],tags:[`泄漏`,`检测`,`隔离`,`稀释`,`围堵`]},{id:`样题15`,source:`样题`,part:7,module:`M8`,title:`建议措施的有针对性、可执行`,corePoint:`具体+可跟踪,拒绝空泛口号`,stem:`下列 HAZOP 建议措施,满足有针对性、可执行要求,能纳入正式分析报告跟踪落实的有( )`,options:[{label:`A`,text:`"加强操作纪律管理,严格执行工艺卡片参数要求,杜绝超温超压操作"`},{label:`B`,text:`"精馏塔 T-101 塔底增设液位低低联锁,液位低于15%时联锁停塔底出料泵 P-101"`},{label:`C`,text:`"将该反应器操作压力从2.0MPa降至1.5MPa,提高设计安全裕度"`},{label:`D`,text:`"大检修期间对该高温重油管线所有环焊缝进行100%超声波无损检测"`}],answer:[`B`,`C`,`D`],analysis:`A 是泛泛管理口号,无具体对象/参数/动作,不能跟踪落实 ✗。`,transfer:[`好建议措施三标准:有针对性(具体对象/参数)、可执行(明确动作)、可跟踪(能验证落实)。`,`反例陷阱:"加强管理""提高意识"这类口号式措施不能进正式报告。`],tags:[`建议措施`,`针对性`,`可执行`,`可跟踪`,`真题`]},{id:`样题20`,source:`样题`,part:7,module:`M8`,title:`管理类建议措施`,corePoint:`管理类可作为建议措施;作IPL须满足四特性`,stem:`HAZOP 分析时提出建议措施,下列说法不正确的是( )`,options:[{label:`A`,text:`在设计阶段应以工程措施为优先原则`},{label:`B`,text:`管理类措施和识别的安全措施类似,不能作为建议措施提出`},{label:`C`,text:`管理类措施不能作为建议措施提出`},{label:`D`,text:`生产运行阶段若能通过加强管理提高安全水平,可以提出管理类建议措施`}],answer:[`B`,`C`],analysis:`管理类措施可以作为建议措施提出;但作为"保护层/IPL 计减风险"时须满足四特性(有效/独立/可靠/可审计),培训教育类一般不作为 IPL。`,transfer:[`管理类措施可以作为建议措施提出(尤其运行阶段)。`,`但要区分:作为"建议措施"可以提;作为"IPL 计减风险"必须满足四特性(有效/独立/可靠/可审计),培训类一般不作为 IPL。`],tags:[`建议措施`,`管理类`,`IPL`,`四特性`,`真题`]},{id:`模拟1-25`,source:`模拟1`,part:7,module:`M8`,title:`建议措施`,corePoint:`同题15/20`,stem:`关于 HAZOP 建议措施,正确的是( )`,options:[{label:`A`,text:`应具有针对性、可执行、可跟踪`},{label:`B`,text:`设计阶段应以工程措施为优先`},{label:`C`,text:`管理类措施不能作为建议措施提出`},{label:`D`,text:`运行阶段可通过加强管理提出管理类建议措施`}],answer:[`A`,`B`,`D`],analysis:`C 错:管理类措施可以作为建议措施提出。`,transfer:[`同题15/20:设计阶段以工程措施优先、运行阶段可提管理类建议、措施须可执行可跟踪。`,`"管理类不能提"是错误表述。`],tags:[`建议措施`,`管理类`,`工程措施`,`可执行`]},{id:`样题6`,source:`样题`,part:8,module:`M7`,title:`人员暴露率`,corePoint:`暴露率=时间÷周期`,stem:`乙烯装置一小时一巡检,每次裂解炉周围约5分钟,人员暴露率取值可为( )`,options:[],answer:[`0.08`],analysis:`暴露率 = 5分钟 ÷ 60分钟 ≈ 0.083 ≈ 0.08。`,transfer:[`暴露率=实际暴露时间÷统计周期。每小时巡 5 分钟 → 5/60≈0.08。`,`LEC 的 E(暴露频率)与 LOPA 的暴露概率不是一回事:前者是"多常暴露",后者是"暴露时在场概率"。`],tags:[`暴露率`,`LEC`,`计算`,`时间占比`,`真题`],kind:`fill`},{id:`模拟1-24`,source:`模拟1`,part:8,module:`M7`,title:`LEC 计算`,corePoint:`官方 C 表 + D 分级`,stem:`某作业 L=3(可能但不经常)、E=6(每天工作时间内暴露)、C=15(一人死亡),则 D 值及危险等级为( )(按官方附件9标准)`,options:[{label:`A`,text:`D=270,较大风险,需立即采取紧急措施并整改`},{label:`B`,text:`D=270,一般风险,需要整改`},{label:`C`,text:`D=240,较大风险,需要整改`},{label:`D`,text:`D=180,一般风险,需要注意`}],answer:[`A`],analysis:`D=3×6×15=270 → 落在 160~320 = Ⅱ 较大风险,需立即采取紧急措施并整改(官方命名)。`,transfer:[`官方 LEC:D=L×E×C;D 分级:Ⅰ>320 重大不能作业、Ⅱ160~320 较大立即整改、Ⅲ70~160 较大需整改、Ⅳ20~70 一般、Ⅴ0~20 低。`,`官方 C 表:100(10 人以上死亡)/40(3~9 人死亡)/15(一人死亡)/7(一至二人重伤)/3(轻伤)/1(轻微)。`],tags:[`LEC`,`计算`,`C表`,`D分级`,`官方附件9`]},{id:`模拟2-22`,source:`模拟2`,part:8,module:`M7`,title:`LEC 计算(低风险判定)`,corePoint:`低风险判定`,stem:`某现场清理作业,采用 LEC 法开展风险评估:L=0.5(很不可能)、E=3(每周一次或偶然)、C=7(一至二人重伤)。按官方附件9,该作业风险值 D 及等级为( )`,options:[{label:`A`,text:`D=10.5,Ⅴ级低风险,注意防护即可`},{label:`B`,text:`D=10.5,Ⅳ级一般风险,尽量整改`},{label:`C`,text:`D=21,Ⅳ级一般风险,尽量整改`},{label:`D`,text:`D=10.5,Ⅲ级较大风险,需整改`}],answer:[`A`],analysis:`D=0.5×3×7=10.5,落在 0~20 → Ⅴ级低风险。`,transfer:[`D<20 即 Ⅴ 级低风险。注意 L 可以小于 1(0.5=很不可能),乘出来可以是小数。`,`C=7 对应"一至二人重伤",不是死亡。`],tags:[`LEC`,`计算`,`低风险`,`Ⅴ级`,`官方附件9`]},{id:`模拟2-23`,source:`模拟2`,part:8,module:`M7`,title:`LEC 计算(重大风险判定)`,corePoint:`重大风险判定`,stem:`某合成氨装置动火作业:L=6(相当可能)、E=6(每天工作时间内暴露)、C=40(三至九人死亡或10~30人重伤)。按官方附件9 LEC 法,该作业风险值 D 及等级为( )`,options:[{label:`A`,text:`D=1440,Ⅰ级重大风险,不能作业,必须立即停产整改`},{label:`B`,text:`D=1440,Ⅱ级较大风险,立即整改`},{label:`C`,text:`D=720,Ⅰ级重大风险,不能作业`},{label:`D`,text:`D=1440,Ⅴ级低风险`}],answer:[`A`],analysis:`D=6×6×40=1440,>320 → Ⅰ级重大风险,不能作业。`,transfer:[`D>320 即 Ⅰ 级重大风险,不能作业。C=40 对应"3~9 人死亡或 10~30 人重伤"。`,`识别陷阱:C 值用错(如把一人死亡 15 误当 40)、D 分级边界记错。`],tags:[`LEC`,`计算`,`重大风险`,`Ⅰ级`,`官方附件9`]},{id:`模拟2-17`,source:`模拟2`,part:9,module:`M11`,title:`JSA 定义定位`,corePoint:`任务级、与作业许可绑定;≠系统级`,stem:`关于 JSA(作业安全分析),正确的是( )`,options:[{label:`A`,text:`JSA 是任务级、结构化的风险控制方法`},{label:`B`,text:`把作业分解为若干步骤,逐一辨识危害、评价风险并制定控制措施`},{label:`C`,text:`JSA 通常与作业许可证(工作票)绑定执行`},{label:`D`,text:`JSA 属系统级工艺分析,与 HAZOP 作用相同`}],answer:[`A`,`B`,`C`],analysis:`D 错:JSA 属任务层,HAZOP 属系统层,层级不同、作用互补。`,transfer:[`JSA 是任务级方法,把作业拆步骤 → 辨危害 → 评风险(LS法)→ 定措施,与作业许可绑定。`,`层级对比:HAZOP=系统层(工艺全流程)、JSA=任务层(具体作业),作用互补不重叠。`],tags:[`JSA`,`作业安全分析`,`任务级`,`作业许可`,`LS法`]},{id:`模拟2-18`,source:`模拟2`,part:9,module:`M11`,title:`JSA 步骤与危害辨识`,corePoint:`步骤<10、记录"做什么"、四大类、记录表(LS 法)`,stem:`JSA 步骤分解与危害辨识,正确的有( )`,options:[{label:`A`,text:`大多数作业步骤少于 10 步,须保持正确顺序`},{label:`B`,text:`步骤记录重点在"做什么",而非"怎么做"`},{label:`C`,text:`危害因素分为人的因素、物的因素、环境因素、管理因素四大类`},{label:`D`,text:`JSA 记录表含作业步骤、危害因素、现有措施、风险评估(LS 法/风险矩阵)、新增措施等栏位`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`JSA 步骤要求:<10 步、顺序正确、记"做什么"不记"怎么做"。`,`危害辨识四大类:人的因素/物的因素/环境因素/管理因素。`,`记录表栏位:步骤 → 危害(原因+后果)→ 现有措施(有效1/无效0)→ P/S/R → 新增措施 → P1/S1/R1 → 责任人。`],tags:[`JSA`,`步骤分解`,`危害辨识`,`记录表`,`LS法`]},{id:`模拟2-19`,source:`模拟2`,part:10,module:`M12`,title:`事故树 FTA`,corePoint:`与门=冗余、或门=脆弱、一阶割集=单点故障`,stem:`关于事故树分析 FTA,正确的是( )`,options:[{label:`A`,text:`自上而下演绎分析,从顶上事件追溯至基本事件`},{label:`B`,text:`与门表示所有输入事件同时发生才导致输出,对应冗余防御`},{label:`C`,text:`一阶最小割集即单点故障,最为危险`},{label:`D`,text:`一次分析可同时设定多个顶上事件`}],answer:[`A`,`B`,`C`],analysis:`D 错:一次分析只能设一个顶上事件。`,transfer:[`FTA:自上而下演绎、单一顶上事件、与门=冗余(全要)、或门=脆弱(任一)、一阶割集=单点故障最危险。`,`与门/或门辨析:两事件"同时发生才出事"=与门(有冗余);"任一发生就出事"=或门(脆弱)。`],tags:[`FTA`,`事故树`,`与门`,`或门`,`割集`,`顶上事件`]},{id:`模拟2-20`,source:`模拟2`,part:10,module:`M12`,title:`事件树 ETA 与蝴蝶结图`,corePoint:`ETA 正向/分支连乘;Bow-tie 左预防右减缓`,stem:`事件树 ETA 与蝴蝶结图 Bow-tie,正确的有( )`,options:[{label:`A`,text:`ETA 从初始事件出发,正向推演各安全功能成败组合`},{label:`B`,text:`ETA 某分支概率 = 初始事件概率 × 各环节条件概率连乘`},{label:`C`,text:`Bow-tie 左侧布设预防性屏障,右侧布设减缓/恢复屏障`},{label:`D`,text:`Bow-tie 中心为顶上事件(关键事件)`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`ETA 正向推演:初始事件 → 安全功能成败组合 → 各分支概率连乘。`,`Bow-tie:中心=顶上事件(关键事件)、左=预防性屏障(原因侧)、右=减缓/恢复屏障(后果侧)。`],tags:[`ETA`,`事件树`,`Bow-tie`,`蝴蝶结图`,`预防屏障`,`减缓屏障`]},{id:`模拟2-21`,source:`模拟2`,part:10,module:`M12`,title:`双重预防机制`,corePoint:`风险分级管控+隐患排查治理`,stem:`双重预防机制,正确的有( )`,options:[{label:`A`,text:`双重预防机制 = 安全风险分级管控 + 隐患排查治理`},{label:`B`,text:`风险 = 可能性 × 严重性,分重大/较大/一般/低四级(红橙黄蓝)`},{label:`C`,text:`重大事故隐患治理应落实"责任、措施、资金、时限、预案"五落实`},{label:`D`,text:`排查制度为班组日排查、部门周排查、经理月排查`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`双重预防机制=风险分级管控+隐患排查治理,双防线缺一不可。`,`风险四色:重大/较大/一般/低(红橙黄蓝);重大隐患治理"五落实"(责任/措施/资金/时限/预案);排查"日周月"(班组/部门/经理)。`],tags:[`双重预防`,`风险分级管控`,`隐患排查`,`四色`,`五落实`]},{id:`模拟2-10`,source:`模拟2`,part:11,module:`M12`,title:`动火作业分级`,corePoint:`特级/一级/二级及票有效期`,stem:`关于动火作业分级,正确的是( )`,options:[{label:`A`,text:`运行状态下装置带压不置换动火属特级动火`},{label:`B`,text:`管廊上动火按一级动火管理`},{label:`C`,text:`特级动火作业票有效期不超过 8 小时`},{label:`D`,text:`二级动火作业票有效期不超过 72 小时`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`动火三级:特级(带压不置换等,票≤8h)、一级(管廊等,票≤8h)、二级(其他,票≤72h)。`,`记忆:"特殊一紧急"(特级最严);票有效期 特级/一级 8h、二级 72h。`],tags:[`动火作业`,`分级`,`特级`,`一级`,`二级`,`作业票`]},{id:`模拟2-11`,source:`模拟2`,part:11,module:`M12`,title:`动火气体检测`,corePoint:`10m、≤30min、LEL≥4%时≤0.5%、中断30/60min`,stem:`动火作业气体检测,正确的有( )`,options:[{label:`A`,text:`在动火点 10m 范围内进行可燃气体分析`},{label:`B`,text:`取样分析合格与动火开始间隔不超过 30 分钟`},{label:`C`,text:`被测气体爆炸下限 ≥4% 时,浓度 ≤0.5%(体积分数)为合格`},{label:`D`,text:`特级、一级动火中断超过 60 分钟须重新分析`}],answer:[`A`,`B`,`C`],analysis:`D 错:特级/一级中断超 30 分钟重新分析,二级才超 60 分钟。`,transfer:[`动火气体检测三要点:10m 范围内、分析合格与动火间隔≤30min、LEL≥4% 时浓度≤0.5%(LEL<4% 时≤0.2%)。`,`中断重测:特级/一级超 30min、二级超 60min 必须重新分析。`],tags:[`动火作业`,`气体检测`,`10m`,`30分钟`,`LEL`,`0.5%`]},{id:`模拟2-12`,source:`模拟2`,part:11,module:`M12`,title:`特级动火要求`,corePoint:`主要负责人审批/连续监测/影像;30m气体15m液体`,stem:`特级动火作业要求,正确的有( )`,options:[{label:`A`,text:`由企业主要负责人审批`},{label:`B`,text:`动火期间连续监测可燃气体`},{label:`C`,text:`采集全过程作业影像`},{label:`D`,text:`距动火点 30m 内不得排放可燃液体`}],answer:[`A`,`B`,`C`],analysis:`D 错:距动火点 30m 内不排放可燃气体、15m 内不排放可燃液体。`,transfer:[`特级动火四要求:主要负责人审批、连续监测可燃气体、采集全过程影像、运行状态下带压不置换。`,`距离记忆:30m 内不排可燃气体、15m 内不排可燃液体——别记反。`],tags:[`特级动火`,`审批`,`连续监测`,`影 核心公式:偏差 = 引导词 + 工艺参数 = 对设计意图的偏离。
9 步流程:①确定范围与准备(收集 P&ID、SDS、历史事故报告)→②划分节点→③定义设计意图→④确定偏差(引导词+参数)→⑤分析原因→⑥分析后果(假定所有现有安全措施失效,评估最严重后果)→⑦识别现有保护措施并评估风险(风险矩阵定级)→⑧提出建议措施→⑨编制报告与跟踪落实。
标准:AQ/T 3049-2013《应用导则》、GB/T 35320-2017《应用指南》(均基于 IEC 61882)。`,keywords:[`HAZOP`,`定义`,`九步`,`流程`,`设计意图`,`危险与可操作性`,`分析步骤`],relatedIds:[`样题1`,`模拟1-9`,`模拟2-26`]},{id:`M1-节点划分`,module:`M1`,title:`节点划分与设计意图`,content:`节点 = 具有确定边界的工艺单元(管线、容器、泵、塔、换热器,间歇过程可为操作步骤)。
连续流程:从进 P&ID 的管线开始,进行到设计意图改变 / 工艺条件改变 / 下一设备处为止。
间歇流程:按操作阶段/步骤(进料、反应、出料)划分,分析对象以主体设备(反应器)为主。
节点不宜过大或过小、需全面覆盖无遗漏,边界在 P&ID 上用色笔标识。
设计意图描述六要素:设计目的、设计参数、操作参数、复杂控制回路、联锁、特殊操作工况。`,keywords:[`节点`,`节点划分`,`设计意图`,`边界`,`间歇流程`,`连续流程`],relatedIds:[`模拟1-8`,`样题2`]},{id:`M1-间歇流程`,module:`M1`,title:`间歇流程 HAZOP 特点`,content:`间歇(批次)流程与连续流程相比的四大特点:
①时间依赖性(非定常)——时间本身是必须检查的关键参数,风险随操作阶段动态变化;
②按操作阶段/步骤划分节点,以主体设备(反应器)为分析对象;
③操作失误是初始原因的重要类别(人为因素占比更高),小组应含操作人员;
④后果中人员伤亡概率较连续流程高(高风险、短时间、密集操作)。
重点使用时序引导词 EARLY/LATE/BEFORE/AFTER(早/晚/先/后)。
易错:间歇流程不是"只分析操作员误操作",还必须分析工艺参数偏差、步骤遗漏/重复/顺序错误、公用工程失效等。`,keywords:[`间歇流程`,`批次流程`,`batch`,`时间依赖`,`操作步骤`,`时序引导词`,`人为因素`],relatedIds:[`样题2`,`模拟1-8`]},{id:`M1-局限性`,module:`M1`,title:`HAZOP 的局限性`,content:`HAZOP 主要局限:
①单偏差假设:一次只分析一种偏差,不覆盖多重故障连锁失效;
②对人为因素分析不充分;
③本质为定性方法,不能量化风险;
④高度依赖人员能力(组长经验 + 成员知识协作,"人的质量决定 HAZOP 质量");
⑤仅检查 P&ID/设计资料;
⑥单独分析各节点,不能充分处理节点间相互影响 → 需用事件树(ETA)、领结图(Bow-tie)、故障树(FTA)补充;
⑦耗时长成本高。
判断题口径:部分讲义把"团队能力依赖"视为成功条件而非技术局限(样题1考点)。`,keywords:[`HAZOP`,`局限性`,`单偏差`,`定性`,`节点间影响`,`依赖人员`],relatedIds:[`样题1`,`模拟1-9`]},{id:`M1-小组与纪律`,module:`M1`,title:`HAZOP 分析小组与两条纪律`,content:`小组规模 4~8 人(至少 4 人),多学科小组(设计、工艺、操作、维修、安全)。
组长(HAZOP 主席):中立、精通方法、引导式推进,不可过于强势(压制发言会遗漏危害)。
记录员:忠实完整记录、P&ID 标注。
两条重要纪律:
①一次只分析一种偏差(聚焦完整、避免思路被打断);
②全部偏差分析完成后再讨论整改措施(中途讨论会打乱分析节奏)。
组长不能一人独立完成分析;记录员必须记录全部讨论内容。`,keywords:[`小组`,`组长`,`记录员`,`多学科`,`一次一偏差`,`纪律`,`4到8人`],relatedIds:[`模拟1-5`,`模拟1-11`]},{id:`M1-事故案例`,module:`M1`,title:`事故案例在 HAZOP 中的应用`,content:`正确做法:
①作为分析输入资料:分析前收集同类装置历史事故、未遂事件报告;
②作为偏差验证依据:对照真实事故反查 HAZOP 覆盖是否全面;
③若同类事故原因在本装置同样存在,应核实现有保护措施的有效性,必要时开展 LOPA 分析;
④保护措施必须验证实际可用性与自动化程度。
错误做法(陷阱):
①装置设置了安全措施就不体现事故风险——错(即使设置了也要体现并验证有效性);
②直接照搬事故通报的后果等级——错(应结合本装置实际工艺条件);
③正文罗列事故但未纳入具体偏差分析——错(应反查/纳入)。`,keywords:[`事故案例`,`未遂事件`,`历史事故`,`反查`,`LOPA`,`保护措施`],relatedIds:[`样题7`,`模拟1-10`]},{id:`M2-偏差与七引导词`,module:`M2`,title:`偏差公式与七个基本引导词`,content:`偏差 = 引导词 + 工艺参数。引导词描述对设计意图的偏离,非所有"引导词+参数"组合都有意义,需剔除无意义组合。
七个基本引导词(口诀"你不过白捡一半" = 相逆、部分、过量、伴随、空白、减量、异常):
· NO(空白):设计意图完全否定,应发生的不发生(无流量/无搅拌/无冷却);
· MORE(过量):量的增加(流量过高/压力过高/温度过高);
· LESS(减量):量的减少(流量过小/压力过低/温度过低);
· AS WELL AS(伴随):实现意图同时伴随多余东西(杂质混入、两相流);
· PART OF(部分):只完成部分设计意图(缺一组分、跳过某步骤);
· REVERSE(相逆):方向相反(逆流、反向旋转);
· OTHER THAN(异常):完全替代,发生完全不同的事件(装错料、介质替代)。
辨析:液位下降=LESS、液位消失=NO、倒流=REVERSE、混入杂质=AS WELL AS、装错物料=OTHER THAN。`,keywords:[`引导词`,`偏差`,`NO`,`MORE`,`LESS`,`REVERSE`,`PART OF`,`AS WELL AS`,`OTHER THAN`,`你不过白捡一半`],relatedIds:[`模拟1-1`,`模拟1-2`,`模拟1-3`,`模拟1-7`]},{id:`M2-时序引导词`,module:`M2`,title:`间歇流程时序引导词(4个)`,content:`间歇流程 HAZOP 新增 4 个时序引导词:
· EARLY(早):相对于给定时间早发生(安全状态未达到就提前开阀);
· LATE(晚):相对于给定时间晚发生(联锁响应过晚、操作员响应滞后);
· BEFORE(先):相对于顺序提前(步骤在先执行的步骤之前执行);
· AFTER(后):相对于顺序延后(步骤在应随后执行的步骤之后执行)。
辨析:EARLY/LATE = 何时发生(时间)的偏差;BEFORE/AFTER = 哪个步骤前后(顺序)的偏差。
加上 7 个基本引导词,共 11 个。`,keywords:[`引导词`,`时序`,`EARLY`,`LATE`,`BEFORE`,`AFTER`,`早晚先后`,`间歇流程`],relatedIds:[`模拟1-6`]},{id:`M2-参数与矩阵`,module:`M2`,title:`常用工艺参数与偏差矩阵`,content:`常用工艺参数:流量、温度、压力、液位、组分/浓度、反应、时间、pH、混合、分离、速度、黏度、信号、相态等。
偏差矩阵示例(流量/压力/温度):
NO→无流量/无压力;LESS→流量过小/压力过低/温度过低;MORE→流量过大/压力过高/温度过高;PART OF→间歇性流量/压差过高;AS WELL AS→杂质/真空;REVERSE→逆流/真空正压;OTHER THAN→错流。
要点:并非所有"引导词+参数"组合都有意义,需剔除(如"压力/逆流"不成立)。`,keywords:[`工艺参数`,`偏差矩阵`,`流量`,`温度`,`压力`,`液位`,`组合`],relatedIds:[`模拟1-1`]},{id:`M2-异常引导词`,module:`M2`,title:`引导词"异常"(OTHER THAN)的典型应用`,content:`"异常" = 完全替代——发生与设计意图完全不同的事件。典型场景:
①投错料:反应釜投料时 A 投成 B(装错物料);
②错误介质:管线吹扫用压缩空气代替氮气,形成爆炸性混合物;
③漏做关键步骤:氮气置换后未做置换合格分析直接进料。
易错对比:机泵切换误开备用泵出口阀导致两台泵同时运行、流量过大——这是"流量过大(MORE)",不是"异常"。`,keywords:[`异常`,`OTHER THAN`,`完全替代`,`装错物料`,`介质替代`,`投错料`],relatedIds:[`样题4`]},{id:`M3-原因四类`,module:`M3`,title:`偏离原因(Cause)的四大类`,content:`偏离原因四类:设备故障、仪表故障、人为失误(误操作)、公用工程失效,外加外部破坏、组分/条件改变、物料性质变化。
"温度升高"事故剧情的原因链条(可能原因全选):
· 催化剂活性过高(反应热增大);
· 仪表故障,人员调小冷却循环量(人为误操作致冷却不足);
· 冷却水温度高(公用工程冷却能力下降);
· 物料大量气化(反应剧烈/进料异常)。
分析思路:温度过高 = 产热增加 + 散热减少 + 进料异常,沿三个方向找原因。`,keywords:[`原因`,`设备故障`,`仪表故障`,`人为失误`,`公用工程`,`温度过高`,`冷却水`],relatedIds:[`样题5`]},{id:`M3-后果纪律`,module:`M3`,title:`后果分析(Consequence)纪律`,content:`后果分析铁律:
①假定所有现有安全措施失效,评估最严重后果(不是"措施有效下的正常后果");
②后果描述细化到设备位号、管线、部位、步骤;
③事故链追到后果链末端(如超压→破裂→泄漏→爆炸→火灾→人员伤亡),不只停在"超压";
④覆盖火灾、爆炸、中毒、泄漏、环境污染、停工损失。
只有单一可信故障(至多两种)引起的危险被分析——这是 HAZOP 固有局限。`,keywords:[`后果`,`后果分析`,`措施失效`,`最严重后果`,`后果链`,`超压`],relatedIds:[`模拟1-4`]},{id:`M3-事故偏离识别`,module:`M3`,title:`事故场景中"需分析的偏离"识别思路`,content:`给定事故,找出应分析的偏离(引导词+参数 或 操作异常):

· 外漏(物料/气体泄漏溢出到环境)——泄漏类偏离;

方法:先画事故因果链(加料异常→气体溢出→人员中毒),沿链找每个环节的偏差。`,keywords:[`事故`,`偏离`,`操作异常`,`误操作`,`外漏`,`因果链`,`硫化氢`,`中毒`],relatedIds:[`样题3`]},{id:`M3-暴露率`,module:`M3`,title:`人员暴露率计算`,content:`暴露率 = 人员处于危险区域的时间比例 = 暴露时间 ÷ 周期总时间。

注意区分:LEC 的 E(暴露频繁程度)与 LOPA 的暴露概率不是一回事。`,keywords:[`暴露率`,`暴露`,`时间占比`,`0.08`,`5分钟`,`计算`],relatedIds:[`样题6`]},{id:`M4-定义与关系`,module:`M4`,title:`LOPA 定义与 HAZOP 的关系`,content:`LOPA(保护层分析):半定量过程风险分析方法。对 HAZOP 识别出的事故场景,量化初始事件(IE)频率与各独立保护层(IPL)的失效概率(PFD),计算场景后果发生频率,与可接受风险标准比较,判断保护层是否足够、确定需补充的 SIF 及其 SIL 等级。
· HAZOP 是定性(回答"有哪些危险");LOPA 是半定量(回答"风险是否可接受、保护层够不够、SIF 要几级 SIL");
· LOPA 在 HAZOP 之后进行,只对高后果场景做。
标准:AQ/T 3054-2015《保护层分析(LOPA)方法应用导则》。`,keywords:[`LOPA`,`半定量`,`保护层`,`SIF`,`SIL`,`风险评估`],relatedIds:[`样题8`,`样题16`]},{id:`M4-洋葱模型`,module:`M4`,title:`保护层"洋葱模型"(由内到外8层)`,content:`8 层纵深防御:①本质安全设计→②BPCS 基本过程控制→③关键报警+操作员响应→④SIS 安全仪表系统→⑤物理保护·泄压(安全阀/爆破片)→⑥物理保护·收容/抗爆(防火堤/防爆墙/事故池)→⑦工厂应急响应→⑧社区应急响应。
重要:洋葱模型表示装置应具备的全部纵深防御,但只有满足 IPL 判定准则的部分才能作为独立保护层计数。
工厂应急响应、社区应急响应通常不作为 IPL。`,keywords:[`洋葱模型`,`保护层`,`纵深防御`,`BPCS`,`SIS`,`安全阀`,`防火堤`],relatedIds:[`模拟1-12`,`模拟1-13`]},{id:`M4-IPL四属性`,module:`M4`,title:`独立保护层(IPL)四大属性`,content:`IPL 四大属性(口诀"有独靠审"):
①有效性——能有效防止该场景特定后果("四个足够":足够大/快/强/可靠,PFD 一般<10⁻¹);
②独立性——与初始事件无关、与其他 IPL 失效无关,不共用传感器/控制器/执行机构/电源/仪表风/操作员,考虑共因失效;
③可靠性——该动时能动的概率高(PFD 低),靠设计冗余、定期检验保证;
④可审计性——有效性和 PFD 能被定期审查、测试、文档化验证。
不算 IPL:操作员巡检、培训/规程/PPE、消防队应急、设备设计额定值、与初始事件共用设备的措施。
口诀:"所有 IPL 都是安全措施,但并非所有安全措施都是 IPL"。`,keywords:[`IPL`,`独立保护层`,`有效性`,`独立性`,`可靠性`,`可审计性`,`共因失效`,`不独立`],relatedIds:[`样题12`,`模拟1-12`,`模拟1-13`]},{id:`M4-PFD必背`,module:`M4`,title:`典型 IPL 的 PFD 值(必背)`,content:`PFD = 要求保护层起作用时它失效的概率。必背数值:
· BPCS 基本过程控制(与 IE 无关时):1×10⁻¹;
· 报警 + 操作员响应(≥10min):1×10⁻¹;
· SIL1:1×10⁻¹~10⁻²(取 0.1);
· SIL2:1×10⁻²~10⁻³(取 0.01);
· SIL3:1×10⁻³~10⁻⁴(取 0.001);
· 安全阀(正确设计、定期检验):1×10⁻²;
· 爆破片:1×10⁻²。
SIL 每升一级,PFD 上限缩小 10 倍。BPCS 作为 IPL 最多只给 1×10⁻¹ 信用。`,keywords:[`PFD`,`报警`,`安全阀`,`爆破片`,`SIL1`,`SIL2`,`SIL3`,`失效概率`,`0.1`,`0.01`],relatedIds:[`样题16`,`样题17`,`模拟1-14`]},{id:`M4-LOPA公式`,module:`M4`,title:`LOPA 场景频率计算公式`,content:`核心公式:
后果发生频率 = 初始事件频率(IE) × 使能条件(P_E) × ∏(各IPL的PFD) × 点火概率(P_ig) × 人员暴露概率(P_ex) × 致死概率(P_d)
· P_E 使能条件:装置处于危险状态的时间占比(仅 50% 时间进料取 0.5);
· P_ig 点火概率:泄漏后点着的概率(常取 0.1~0.5);
· P_ex 暴露概率:人员在现场时间比例(每天 12 小时在场 → 0.5);
· P_d 致死概率:暴露后死亡概率(0.01~0.5)。
答题四步:①后果前段频率=IE×P_E×∏PFD(各保护层全失效)→②×点火概率→③×暴露概率(换算时间比例)→④×致死概率。
一个因子都不能漏乘!`,keywords:[`LOPA`,`公式`,`初始事件`,`使能`,`点火概率`,`暴露概率`,`致死概率`,`计算`,`后果频率`],relatedIds:[`样题16`,`模拟1-15`]},{id:`M4-报警限制`,module:`M4`,title:`报警作为保护层的限制`,content:`报警+操作员响应作为独立保护层的限制:
· 同一场景最多 1 个"报警+人员响应"IPL(人为行动只可作一道 IPL);
· 同一 BPCS 上的报警回路最多计 2 个(方法B);
· 共用组件必须合并:多个回路共用同一传感器/执行元件/逻辑控制器,只算 1 个 IPL;
· 初始事件涉及 BPCS 或人员时不成立:IE 是 BPCS 回路失效时,同一 BPCS 报警不能作 IPL(不独立)。
操作员响应时间要求:关键报警(ISA-18.2)5min;必须在 PST(过程安全时间)内完成;作 IPL 一般要求 ≥10min 且有书面程序支撑。`,keywords:[`报警`,`响应时间`,`PST`,`5分钟`,`10分钟`,`操作员`,`IPL`,`独立`],relatedIds:[`模拟1-16`,`样题10`,`模拟1-18`]},{id:`M4-ALARP与叠加`,module:`M4`,title:`可接受风险(ALARP)与频率叠加`,content:`风险 = 后果严重度 × 发生频率。ALARP 三区域:
①不可接受区域——必须降低风险;
②广泛可接受区域(低风险)——剩余风险可忽略,一般不要求进一步措施,但仍需对该水平风险保持警惕("无需警惕"是错误表述);
③可容忍区域——投入"合理可行"的措施降至最低合理可行。
多初始事件导致同一后果:最终事故发生频率 = 各独立初始事件频率的总和(频率叠加,不是取最大、不是相乘)。`,keywords:[`ALARP`,`可接受风险`,`广泛可接受`,`不可接受`,`频率叠加`,`多初始事件`],relatedIds:[`样题8`,`模拟1-17`]},{id:`M5-泄漏四类`,module:`M5`,title:`针对泄漏的保护措施(检测—隔离—稀释—围堵)`,content:`针对泄漏的保护措施按功能分四类(口诀"检隔稀围"):
①检测(Detection)——尽早发现泄漏:可燃/有毒气体检测器、液位高高报警、在线分析仪;
②隔离(Isolation)——切断物料:手动/遥控切断、紧急切断装置(ESD)、SIS 联锁自动切料;
③稀释(Dilution)——使泄漏物不进入爆炸范围:蒸汽/氮气/新鲜空气稀释、氮封、火炬气氮吹扫;
④围堵(Containment)——收集泄漏物限制扩散:事故池、事故槽、围堤/防火堤。
常见错配:把"事故池"归为隔离(是围堵);把"氮气吹扫"归为隔离(是稀释)。`,keywords:[`泄漏`,`检测`,`隔离`,`稀释`,`围堵`,`事故池`,`围堤`,`ESD`,`紧急切断`],relatedIds:[`样题9`,`模拟1-19`]},{id:`M6-报警有效条件`,module:`M6`,title:`报警成为有效安全措施的条件`,content:`报警要成为有效安全措施必须满足:
①足够响应时间——操作人员应有足够响应时间(关键报警 5min/ISA-18.2;作 IPL 一般 ≥10min 且有书面程序);
②信号可检测——指示清晰、无歧义、按优先级呈现,不被报警泛滥淹没;
③任务单一可操作——不宜要求操作人员同时执行其它任务;
④依赖人工响应——报警本身不做动作,"报警+人"才构成保护层,不能完全自动;
⑤独立性——报警不能与初始事件共用同一失效机理。
最常考陷阱:报警不能自动动作,必须靠人工响应;不能作为重大危害的最后一道防线。`,keywords:[`报警`,`有效性`,`响应时间`,`可检测`,`任务单一`,`人工响应`,`最后防线`,`独立`],relatedIds:[`样题10`,`模拟1-18`,`模拟1-16`]},{id:`M6-四特性`,module:`M6`,title:`安全措施四个特性(有效性/独立性/可靠性/可审计性)`,content:`安全措施四特性(口诀"有独靠审"):
①有效性——能在危险事件发生时,以所需能力在所需时间内完成防止后果的功能;
②独立性——不受初始事件影响、不与其他保护层共因失效;
③可靠性——该动时能动的概率(用 PFD 量化),靠设计冗余、定期测试维护保证;
④可审计性——有效性和 PFD 能通过检查、审计、文档记录证明。
典型应用:安全阀进出口切断阀加铅封并锁定全开(TSG ZF001)→ 提高可靠性(防止误关导致泄压保护失效)。
易混淆:铅封开/锁开不是有效性,也不是独立性。`,keywords:[`有效性`,`独立性`,`可靠性`,`可审计性`,`铅封`,`锁开`,`TSG`,`特性`],relatedIds:[`样题19`,`模拟1-20`]},{id:`M6-识别范围`,module:`M6`,title:`HAZOP 安全措施的识别范围`,content:`识别已有安全措施的要点:
①应分别针对原因、中间事件、偏离、后果四个环节识别(针对原因:泵备台、巡检;针对中间事件:联锁、隔离阀;针对偏离:BPCS 调节、报警;针对后果:安全阀、围堤、事故池);
②安全措施不限于本节点,可在节点内也可在节点外(下游装置、全厂公用系统、远程切断);
③一条剧情上多个报警,最多只能将两个报警作为独立保护层。
错误说法:"只需识别节点内部的安全措施"。`,keywords:[`安全措施`,`识别`,`原因`,`中间事件`,`偏离`,`后果`,`节点内外`,`报警上限`],relatedIds:[`样题11`,`模拟1-21`]},{id:`M6-独立性判断`,module:`M6`,title:`安全措施不满足独立性要求的情形`,content:`判断独立性三问:①独立于初始事件吗?②独立于其他被计数的 IPL 吗?③有共因失效吗(共用传感器/控制器/执行机构/电源/仪表风/操作员)?任一"共用"即不能独立计入。
典型不独立情形:
· 与初始事件共用同一块检测仪表(液位计故障触发同一液位计的高高联锁);
· 同一失效机理(电机烧毁,用同一回路热继电器跳泵保护);
· 共用电源(全厂断电,用同一 UPS 供电的 ESD)。
独立情形:初始事件是"压力控制回路故障",增设安全阀——安全阀独立于压力回路,可计入。
有效保护层模板:报警+操作员响应(响应时间合理)或独立自动联锁直接切断路径;巡检、人工监盘不作为有效安全措施。`,keywords:[`独立性`,`共因失效`,`共用`,`传感器`,`电源`,`UPS`,`巡检`,`监盘`],relatedIds:[`样题12`,`样题13`]},{id:`M6-结合PID判有效性`,module:`M6`,title:`结合 PID 判定保护措施有效性(题14方法)`,content:`判定逻辑:保护措施要能直接防止该剧情的原因或后果(有效性);与初始事件共因、位于错误测点、不针对该风险的,不符合有效性。
四个典型"不符合有效性"的情形(样题14):
①压力高报警不能防止"燃料气量大→温度过高"(压力高≠流量大,且无配套响应);
②TIC 自控回路本身就是初始事件(原因),不能作为独立于初始事件的保护措施;
③联锁测点位置错误:测点位于阀 PV101 上游,阀故障关小时上游憋压、测不到进炉实际压力,联锁无效;
④氧含量报警不针对炉膛压力过高/回火风险。
做题必须结合附件 PID 逐项核对"该措施是否真能防住该偏离"。`,keywords:[`PID`,`有效性`,`测点`,`联锁`,`报警`,`剧情`,`炉膛`,`串料`],relatedIds:[`样题14`]},{id:`M7-LEC公式`,module:`M7`,title:`LEC 法公式与要素`,content:`LEC 法(作业条件危险性评价法 / 格雷厄姆-金尼法):半定量方法,适用于作业活动/岗位风险评价。
公式:D = L × E × C
· L = 事故发生的可能性(Likelihood);
· E = 人员暴露于危险环境的频繁程度(Exposure);
· C = 发生事故可能产生的后果严重性(Consequence);
· D = 危险性分值,D 值越大作业条件越危险。
⚠️注意:本竞赛团体赛 JSA 实操按官方要求采用 LS 法(风险矩阵 R=L×S);LEC 法作为独立考点(个人赛)仍须掌握,用官方附件9的 C 表与 D 分级。`,keywords:[`LEC`,`公式`,`D=LEXC`,`可能性`,`暴露频繁程度`,`后果`,`半定量`,`格雷厄姆金尼`],relatedIds:[`模拟1-24`,`模拟2-22`,`模拟2-23`]},{id:`M7-LEC分值表`,module:`M7`,title:`LEC 法 L/E/C 分值表(官方附件9)`,content:`L(事故发生的可能性,官方版):10 完全可以预料;6 相当可能(不能被发现/无防范监测措施/正常经常发生);3 可能但不经常(不易发现/未按规程/控制措施不当);1 可能性小完全意外(易发现/曾监测/过去发生过);0.5 很不可能(能及时发现且定期监测);0.2 极不可能(有充分防范措施);0.1 实际不可能。
E(暴露频繁程度):10 连续暴露;6 每天工作时间暴露;3 每周一次或偶然;2 每月一次;1 每年几次;0.5 非常罕见。
C(后果,官方版):100 重大灾难(10 人以上死亡);40 灾难(3~9 人死亡或 10~30 人重伤);15 非常严重(1~2 人死亡或 3~9 人重伤);7 严重(1~2 人重伤);3 较大(1~2 人轻伤);1 引人关注(不符合要求)。`,keywords:[`LEC`,`分值`,`C表`,`L值`,`E值`,`后果`,`重伤`,`死亡`,`官方附件9`],relatedIds:[`模拟1-24`,`模拟2-22`,`模拟2-23`]},{id:`M7-LEC分级`,module:`M7`,title:`LEC 法 D 危险等级划分(官方版)`,content:`D 分级(官方附件9命名,与通用教材不同):
· Ⅰ级:D>320 —— 重大风险,不能继续作业(采取措施降低危害前不能作业,立即);
· Ⅱ级:160~320 —— 较大风险,需立即采取紧急措施并整改;
· Ⅲ级:70~160 —— 较大风险,需要整改(2 年内治理);
· Ⅳ级:20~70 —— 一般风险,具备条件尽量整改;
· Ⅴ级:0~20 —— 低风险,需要注意(无需控制措施但保存记录)。

· 确定后果等级 S 取"最坏可信后果"(Worst Credible),并考虑现有保护措施;
· 确定可能性 L 考虑现有安全措施的有效性:有效措施可降 1 级 L,特别有效可降 2 级 L(关键考点!);
· 风险分级:R=1~2 可接受(绿色);R=3~4 需关注(黄色);R=6 显著(橙色);R=8~10 高度(红色,必须采取措施后才能作业);R=15~25 极度(红色,禁止作业)。

· S3:较大——人员轻伤 1~2 人或轻度中毒 / 财产损失 10~100 万元;

③工程控制(Engineering Controls)——隔离/防护(通风、防护罩、泄压、联锁);
④管理控制(Administrative Controls)——规程、培训、挂牌上锁、警示标识;
⑤个体防护(PPE)——防护用品(最后一道防线)。

标准流程(通常 6 步):
①选择作业任务(识别非常规、高风险作业);
②将作业分解为一系列步骤(步骤要具体、可操作,一般 5~15 步);
③识别每一步的潜在危害与后果(人/物/环境);
④评估风险(LS 法:对该步骤定 L 和 S,得 R);
⑤确定控制措施(针对每项危害,按控制层级);
⑥落实措施并批准作业(交底、监护人、票证)。
参与人员:作业人员 + 属地负责人 + 安全人员 + 监护人等,需多人参与讨论,不能一人代填。`,keywords:[`JSA`,`作业安全分析`,`流程`,`步骤分解`,`危害识别`,`控制措施`,`交底`],relatedIds:[`模拟2-16`,`模拟2-17`]},{id:`M11-JSA-LS应用`,module:`M11`,title:`JSA 用 LS 法评估风险(关键考点)`,content:`JSA 中风险等级用 LS 法(风险矩阵 R=L×S):
· 后果严重度 S:按"最坏可信后果"确定该步骤最严重但合理的后果等级(死亡/重伤/轻伤/财产损失);
· 可能性 L:考虑该步骤现有安全措施:有效措施可降 1 级,特别有效可降 2 级(两档降级);
· 举例:高处作业(2~5m)不系安全带坠亡后果 S=5(死亡),若无防护 L=5→R=25 极度(禁止);若设双钩安全带+水平生命线(特别有效)可降至 L=3→R=15,仍需确认后作业;
· R≥8(红区)必须采取进一步措施后才能作业;R≥15(极度)须上报并专项审批。
⚠️不要用 LEC 法做 JSA(官方明确);R 直接由 L×S 得到,不是 D。`,keywords:[`JSA`,`LS法`,`风险矩阵`,`最坏可信`,`降级`,`特别有效`,`R`,`25`,`15`,`红区`],relatedIds:[`模拟2-17`,`模拟2-24`,`模拟2-25`]},{id:`M11-JSA有效与无效`,module:`M11`,title:`JSA 中"有效 vs 无效"安全措施`,content:`判定 JSA 安全措施是否有效(模拟2-18 方法):
①措施针对该步骤的具体危害(不是通用口号),能直接阻止危害发生或降低后果;
②措施可执行、可验证(明确到工具/人员/标准,如"佩戴五点式安全带并挂设于生命线上",而非"注意安全");
③措施按控制层级优先工程措施(防护栏、双钩安全带、气体检测、盲板隔离),管理措施(专人监护、培训)作补充;
④无效/低效做法:仅写"加强培训""提高安全意识""作业时小心""检查工具完好"(无具体对象),或 PPE 一栏全写"劳保用品"。
多选题常让你从一组措施里挑"有效"与"无效",按上述四条逐条判定。`,keywords:[`JSA`,`有效`,`无效`,`措施`,`针对性`,`可验证`,`控制层级`,`培训`,`PPE`],relatedIds:[`模拟2-18`]},{id:`M11-JSA实操要点`,module:`M11`,title:`JSA 实操表格填写要点`,content:`JSA 表格(作业步骤 / 危害与后果 / 风险等级 R / 控制措施 / 负责人)填写要点:
①步骤分解粒度适中:过粗漏危害、过细繁琐,5~15 步为宜;
②每步至少识别出 1 个主要危害,按"人、机、料、法、环"逐项排查;
③每个危害都要有对应的控制措施,且一一对应(措施不匹配=无效);
④风险等级:作业前按现有措施评一次;新增措施后再评估是否降到可接受(必填,体现措施效果);
⑤填写人、审批人、作业人员签字齐全;交底确认;

团体赛给空白 JSA 表 + 场景,要求补充步骤、识别危害、定级、写措施。`,keywords:[`JSA`,`表格`,`填写`,`步骤`,`危害`,`措施`,`交底`,`签字`,`变更`],relatedIds:[`模拟2-18`,`模拟2-19`]},{id:`M12-FTA事故树`,module:`M12`,title:`FTA 事故树分析(最小割集)`,content:`FTA(Fault Tree Analysis,事故树/故障树):从顶上事件(不希望发生的事故)开始,用逻辑门自上而下分析其发生途径的演绎方法。
· 与门(AND):所有输入事件都发生,输出才发生(冗余系统,提高可靠性);
· 或门(OR):任一输入事件发生,输出即发生(任何单点故障都能导致顶上事件);
· 最小割集:能导致顶上事件发生的最小事件集合。一阶割集 = 单点故障(最危险,应优先消除);割集阶数越高,同时发生所需条件越多,越不容易发生;
· 提高可靠性方法:增加与门(冗余),减少或门。
与 ETA 区分:FTA 从顶上事件往下推原因(演绎);ETA 从初始事件往上推后果(归纳)。`,keywords:[`FTA`,`事故树`,`故障树`,`顶上事件`,`与门`,`或门`,`最小割集`,`单点故障`,`演绎`],relatedIds:[`样题20`,`模拟1-9`]},{id:`M12-ETA事件树`,module:`M12`,title:`ETA 事件树分析`,content:`ETA(Event Tree Analysis,事件树):从初始事件(IE)出发,按顺序考虑各保护层/安全措施是否成功发挥作用,分支组合出各种可能的后果(成功/失败)的归纳方法。
· 每条分支路径 = 一个后果场景;失败分支继续分裂;
