/可靠/可审计)`,4:`LOPA 保护层分析`,5:`本质安全 / 风险矩阵 / 控制层级`,6:`泄漏保护措施`,7:`建议措施`,8:`LEC 法 / 暴露率`,9:`JSA 作业安全分析`,10:`风险分析方法体系(FTA/ETA/Bow-tie/双重预防)`,11:`特殊作业(八大作业)`,12:`化工过程安全基础`,13:`团体赛 HAZOP 实操`},zn=[{id:`样题4`,source:`样题`,part:1,module:`M2`,title:`引导词"异常"(OTHER THAN)的应用`,corePoint:`异常=完全替代`,stem:`下列间歇步骤分析场景中,适合使用引导词"异常"组成偏离进行分析的有( )`,options:[{label:`A`,text:`投错物料,A投成B`},{label:`B`,text:`氮气置换后未做置换合格分析直接进料`},{label:`C`,text:`机泵切换时误开备用泵出口阀,两台泵同时运行,流量过大`},{label:`D`,text:`管线吹扫时用压缩空气代替氮气,形成爆炸性混合物`}],answer:[`A`,`B`,`D`],analysis:`"异常"=发生与设计意图完全不同的事件(完全替代)。A 装错物料 ✓、B 该做的置换分析没做就进料 ✓、D 吹扫介质被替代 ✓。C 是"流量过大(MORE)"不是异常 ✗。`,transfer:[`变式:适合"相逆(REVERSE)"的是止回阀失效逆流、物料倒灌;适合"伴随(AS WELL AS)"的是混入杂质、组分变化两相流。`,`口诀记 7 大基本引导词:"你不过白捡一半"(相逆/部分/过量/伴随/空白/减量/异常);"异常"=完全替代,装错料、介质替代、漏做关键步骤都是它。`],tags:[`引导词`,`异常`,`OTHER THAN`,`偏差`,`完全替代`,`真题`]},{id:`样题2`,source:`样题`,part:1,module:`M1`,title:`间歇流程 HAZOP 特点`,corePoint:`间歇≠只查误操作`,stem:`下列关于间歇流程 HAZOP 分析特点说法不正确的是( )`,options:[{label:`A`,text:`间歇流程人为因素类原因占比更高`},{label:`B`,text:`只需分析操作人员在执行特定步骤时发生误操作的风险`},{label:`C`,text:`后果中出现人员伤亡的概率较连续流程高`},{label:`D`,text:`时间依赖性显著,风险随操作阶段动态变化,应按操作阶段划分节点`}],answer:[`B`],analysis:`B 错——间歇流程 HAZOP 除操作误操作外,还必须分析工艺参数偏差、时间顺序(早/晚/先/后)、步骤遗漏/重复、公用工程失效等,"只需分析误操作"以偏概全。`,transfer:[`间歇流程四大特点:人为原因占比高、后果伤亡概率高、时间依赖性强(时序引导词早/晚/先/后)、按操作阶段划分节点。`,`对比:连续流程按管线/设备划分节点,以参数偏差(流量/压力/温度)为主;间歇流程还要分析步骤遗漏/重复、公用工程失效。`],tags:[`间歇流程`,`HAZOP`,`特点`,`节点`,`时序`,`真题`]},{id:`样题1`,source:`样题`,part:1,module:`M1`,title:`HAZOP 的局限性`,corePoint:`局限四表述;此题需核对讲义`,stem:`下列关于 HAZOP 的局限性,描述错误的是( )`,options:[{label:`A`,text:`单独分析各节点,严重危险涉及节点间相互影响时需用事件树和领结图进一步研究`},{label:`B`,text:`无法保证识别所有危险,复杂系统不宜完全依赖 HAZOP,宜联合使用`},{label:`C`,text:`系统高度关联,偏离原因可能源于其他系统;局部减缓措施不一定消除真正原因`},{label:`D`,text:`分析成功取决于组长能力和经验,以及成员知识、经验和协作`}],answer:[`D`],flag:`⚠️ 需结合培训讲义确认:四个选项按权威资料均为局限性的标准表述,未见明显"错误"项。若必选"非局限性",D(团队能力依赖)在部分讲义中被视为"成功条件"而非"技术局限"。考场遇此不确定题,遵守"少选保0.5",切勿乱选。`,analysis:`按权威资料(AQ/T 3049、GB/T 35320、IChemE),A/B/C 均为局限标准表述;D 若判"错误",依据是"团队能力依赖"属于成功条件而非技术局限(口径差异)。`,transfer:[`HAZOP 局限四表述:①单节点分析难覆盖节点间相互影响;②不保证识别全部危险;③原因可能跨系统,局部措施未必治本;④依赖组长与成员能力。`,`考场应对:遇"描述错误的是"且四项都像局限表述,少选保 0.5,别硬选。`],tags:[`HAZOP`,`局限性`,`局限`,`真题`]},{id:`模拟1-1`,source:`模拟1`,part:1,module:`M2`,title:`偏差概念`,corePoint:`偏差=引导词+工艺参数`,stem:`关于 HAZOP 中"偏差"的概念,正确的是( )`,options:[{label:`A`,text:`偏差 = 引导词 + 工艺参数(如"流量/过高")`},{label:`B`,text:`偏差 = 后果 + 原因`},{label:`C`,text:`偏差 = 对设计意图的偏离`},{label:`D`,text:`需剔除无意义的"引导词+参数"组合`}],answer:[`A`,`C`,`D`],analysis:`偏差=引导词+参数=对设计意图的偏离;非所有组合都有意义需剔除。B 错(偏差不是"后果+原因")。`,transfer:[`做题先拆"参数+引导词":流量/过高=流量过高,压力/减量=压力过低,温度/空白=无温度。`,`无意义组合示例:"压力/逆流""流量/反向"等物理上不成立的组合需剔除。`],tags:[`偏差`,`引导词`,`工艺参数`,`设计意图`,`概念`]},{id:`模拟1-2`,source:`模拟1`,part:1,module:`M2`,title:`引导词"减量"`,corePoint:`LESS`,stem:`某储罐液位持续下降,原因是底部出料管线泄漏。描述该偏差最合适的引导词是( )`,options:[{label:`A`,text:`NO(无)`},{label:`B`,text:`LESS(减量)`},{label:`C`,text:`REVERSE(相逆)`},{label:`D`,text:`PART OF(部分)`}],answer:[`B`],analysis:`液位下降=液位减量 → LESS。A 无液位、C 逆流、D 部分均不贴切。`,transfer:[`引导词对照:液位下降=减量(LESS)、液位消失=空白(NO)、物料倒流=相逆(REVERSE)。`,`记 7 大引导词:NO空白、LESS减量、MORE过量、REVERSE相逆、PART OF部分、AS WELL AS伴随、OTHER THAN异常。`],tags:[`引导词`,`减量`,`LESS`,`液位`,`偏差`]},{id:`模拟1-3`,source:`模拟1`,part:1,module:`M2`,title:`引导词"无/空白"`,corePoint:`NO=应发生的不发生`,stem:`下列场景中,适合用引导词"NO(无/空白)"组成偏离的有( )`,options:[{label:`A`,text:`泵故障导致无流量`},{label:`B`,text:`止回阀失效导致逆流`},{label:`C`,text:`搅拌器故障导致无搅拌`},{label:`D`,text:`冷却水中断导致无冷却`}],answer:[`A`,`C`,`D`],analysis:`NO=完全否定:无流量/无搅拌/无冷却 ✓。B 逆流是方向相反 → REVERSE。`,transfer:[`NO=应发生的不发生:无流量、无搅拌、无冷却、无反应、无加热都是。`,`对比:逆流是 REVERSE,不是 NO——方向做反≠没发生。`],tags:[`引导词`,`NO`,`空白`,`无流量`,`偏差`]},{id:`模拟1-6`,source:`模拟1`,part:1,module:`M2`,title:`时序引导词`,corePoint:`间歇流程 +4`,stem:`间歇流程 HAZOP 新增的时序引导词包括( )`,options:[{label:`A`,text:`EARLY(早)`},{label:`B`,text:`LATE(晚)`},{label:`C`,text:`BEFORE(先)`},{label:`D`,text:`AFTER(后)`}],answer:[`A`,`B`,`C`,`D`],analysis:`间歇流程新增时序引导词:EARLY 早、LATE 晚、BEFORE 先、AFTER 后。`,transfer:[`间歇流程 4 个时序引导词:"早晚先后"(EARLY/LATE/BEFORE/AFTER)。`,`必考辨析:7 个基本引导词(你不过白捡一半)+ 4 个时序引导词 = 共 11 个引导词。`],tags:[`引导词`,`时序`,`EARLY`,`LATE`,`间歇流程`,`BEFORE`,`AFTER`]},{id:`模拟1-7`,source:`模拟1`,part:1,module:`M2`,title:`引导词"伴随"`,corePoint:`AS WELL AS=伴随多余东西`,stem:`适合用"AS WELL AS(伴随)"组成偏离的场景有( )`,options:[{label:`A`,text:`反应原料中混入杂质水分`},{label:`B`,text:`物料流向与设计相反`},{label:`C`,text:`进料流量为零`},{label:`D`,text:`反应产物组分变化、出现两相流`}],answer:[`A`,`D`],analysis:`伴随=实现意图同时伴随多余东西:杂质混入、组分变化/两相流 ✓。B 逆流=REVERSE;C 无流量=NO。`,transfer:[`AS WELL AS=实现意图的同时伴随多余的东西:杂质混入、副产物、两相流、第二股进料。`,`对比:方向反=REVERSE、完全没有=NO、比设计多=MORE。`],tags:[`引导词`,`伴随`,`AS WELL AS`,`杂质`,`两相流`]},{id:`模拟1-8`,source:`模拟1`,part:1,module:`M1`,title:`间歇流程节点划分`,corePoint:`按操作阶段划节点`,stem:`关于间歇流程 HAZOP 的节点划分,正确的是( )`,options:[{label:`A`,text:`按操作阶段/步骤划分节点(进料、反应、出料)`},{label:`B`,text:`以管线为基本分析单元`},{label:`C`,text:`分析对象以主体设备(反应器)为主`},{label:`D`,text:`时间顺序与风险变化无需考虑`}],answer:[`A`,`C`],analysis:`间歇流程按操作阶段/步骤划分节点、以主体设备为主。B 错(以管线划分是连续流程);D 错(时间顺序是间歇流程必须考虑的关键参数)。`,transfer:[`节点划分记忆:"间歇看步骤、连续看管线"。间歇流程以操作阶段(进料/反应/出料)划分、以主体设备(反应器)为分析对象。`,`节点划分错误是最常见失分点——记住这句口诀。`],tags:[`间歇流程`,`节点划分`,`操作阶段`,`反应器`]},{id:`模拟1-9`,source:`模拟1`,part:1,module:`M1`,title:`HAZOP 局限性`,corePoint:`单偏差/定性/依赖人员`,stem:`关于 HAZOP 的局限性,正确的是( )`,options:[{label:`A`,text:`一次只分析一种偏差,不覆盖多重故障连锁失效`},{label:`B`,text:`本质为定性方法,不能量化风险`},{label:`C`,text:`分析成败取决于组长能力与成员的知识、协作`},{label:`D`,text:`能充分处理系统内节点之间的相互影响`}],answer:[`A`,`B`,`C`],analysis:`D 错:HAZOP 不能充分处理节点间相互影响,需事件树/领结图补充。`,transfer:[`HAZOP 三大局限:一次一偏差(不覆盖多重失效)、定性方法(不量化风险)、依赖人员能力。`,`补充:不能充分处理节点间相互影响 → 用事件树(ETA)/领结图(Bow-tie)补充。`],tags:[`HAZOP`,`局限性`,`定性`,`节点间影响`]},{id:`模拟1-5`,source:`模拟1`,part:1,module:`M1`,title:`HAZOP 小组`,corePoint:`多学科4~8人、组长引导式`,stem:`关于 HAZOP 分析小组,正确的是( )`,options:[{label:`A`,text:`可由组长一人独立完成分析`},{label:`B`,text:`一般4~8人,须为多学科小组`},{label:`C`,text:`组长应精通 HAZOP 方法,以引导方式推进讨论,不可过于强势`},{label:`D`,text:`记录员只需记录建议措施,无需记录讨论内容`}],answer:[`B`,`C`],analysis:`A 错(不能单人);D 错(记录员须完整记录讨论内容)。`,transfer:[`HAZOP 小组:4~8 人多学科、组长精通方法以引导方式讨论、记录员完整记录、成员覆盖工艺/设备/仪表/操作。`,`易错:组长不是"权威拍板"而是"引导启发";单人不能完成分析。`],tags:[`HAZOP`,`小组`,`组长`,`多学科`,`记录员`]},{id:`模拟1-10`,source:`模拟1`,part:1,module:`M1`,title:`事故案例应用`,corePoint:`反查覆盖+核实现有措施`,stem:`在 HAZOP 分析中应用事故案例,正确的做法有( )`,options:[{label:`A`,text:`收集同类装置历史事故、未遂事件报告作为输入资料`},{label:`B`,text:`直接照搬事故通报中的后果等级`},{label:`C`,text:`若同类事故原因在本装置同样存在,应核实现有保护措施有效性,必要时开展 LOPA`},{label:`D`,text:`事故案例只需在报告正文罗列,无需纳入偏差分析`}],answer:[`A`,`C`],analysis:`B 错(后果等级应结合本装置实际,不照搬);D 错(应纳入偏差分析)。`,transfer:[`事故案例三正确做法:收集同类历史事故作输入、核实现有措施有效性(必要时 LOPA)、反查覆盖偏差。`,`两个陷阱:后果等级不照搬(结合本装置)、不"只罗列不进偏差"。`],tags:[`事故案例`,`HAZOP`,`LOPA`,`保护措施`,`未遂事件`]},{id:`样题7`,source:`样题`,part:1,module:`M1`,title:`事故案例在 HAZOP 中的应用`,corePoint:`案例反查纳入偏差分析+核实现有措施`,stem:`收集到同类装置3起反应釜超压爆炸事故,关于事故案例在 HAZOP 分析中的应用,做法正确的有( )`,options:[{label:`A`,text:`设计时针对性设置了安全措施,则无需体现事故相关风险`},{label:`B`,text:`同类事故的后果描述和等级可直接使用事故通报内容确定`},{label:`C`,text:`若同类事故的原因在本装置同样存在,应核实现有保护措施的有效性,例如针对场景开展 LOPA 分析`},{label:`D`,text:`分析报告正文列举同类事故,无需纳入具体偏差分析`}],answer:[`C`],analysis:`A 错(即使设置了措施,也必须体现并验证其有效性);B 错(后果应结合本装置实际工艺条件,不能照搬);D 错(事故案例应反查/纳入具体偏差分析)。`,transfer:[`与模拟1-10 同考点:事故案例必须纳入具体偏差分析、核实现有措施有效性(如 LOPA)、不照搬后果等级。`,`关键:"设置了安全措施"≠"措施有效"——必须体现并验证有效性。`],tags:[`事故案例`,`HAZOP`,`LOPA`,`偏差分析`,`真题`]},{id:`模拟1-11`,source:`模拟1`,part:1,module:`M1`,title:`一次只分析一种偏差`,corePoint:`聚焦完整、避免打断`,stem:`"一次只分析一种偏差,全部偏差分析完成后再考虑整改措施"这一纪律的意义有( )`,options:[{label:`A`,text:`保证分析聚焦、完整,避免偏差间相互干扰`},{label:`B`,text:`允许在分析中途讨论整改方案以提高效率`},{label:`C`,text:`避免分析思路被打断`},{label:`D`,text:`提高小组成员参与度`}],answer:[`A`,`C`],analysis:`B 错(应避免中途讨论);D 与此纪律无关。`,transfer:[`"一次只分析一种偏差、分析完再想整改"——保证聚焦完整、避免思路打断、防止偏离主题。`,`纪律意义不等于"提高参与度";中途讨论整改方案是被禁止的。`],tags:[`HAZOP`,`纪律`,`一次一偏差`,`聚焦`]},{id:`样题5`,source:`样题`,part:2,module:`M3`,title:`温度升高的原因`,corePoint:`原因四类——设备/仪表/人为/公用工程`,stem:`在温度升高的事故剧情中,可能的原因包括( )`,options:[{label:`A`,text:`催化剂活性过高`},{label:`B`,text:`仪表故障,人员调小冷却循环量`},{label:`C`,text:`冷却水温度高`},{label:`D`,text:`物料大量气化`}],answer:[`A`,`B`,`C`,`D`],analysis:`"温度过高"偏离的原因链条——反应热↑(A 催化剂活性高)、冷却↓(B 人为调小、C 冷却水温高)、进料异常(D 气化)。全部正确。`,transfer:[`原因四类口诀:设备(泄漏/气化/催化)、仪表(故障/误动作)、人为(误操作)、公用工程(冷却水断/温度高)。`,`反推逻辑:"温度过高"的完整链条=产热↑ + 散热↓ + 进料异常,缺一不可。`],tags:[`原因分析`,`温度过高`,`催化剂`,`冷却水`,`公用工程`,`真题`]},{id:`样题3`,source:`样题`,part:2,module:`M3`,title:`事故场景需分析的偏离`,corePoint:`沿事故链找偏差;A 有口径争议`,stem:`张掖耀邦硫化氢中毒事故(盐酸快速加入含硫废水池→硫化氢快速溢出→人员未防护进入吸入中毒),需分析的偏离是( )`,options:[{label:`A`,text:`外漏`},{label:`B`,text:`加料操作步骤异常`},{label:`C`,text:`人员误操作`},{label:`D`,text:`压力过高`}],answer:[`A`,`B`,`C`],flag:`A(外漏)视讲义口径:若把"敞开池气体逸散"归为外漏则选,否则有争议。B/C 把握度最高。保守策略:不确定 A 时只选 BC(仍得 0.5 分)。`,analysis:`B 加料速度/步骤异常 ✓、C 未穿戴防护冒险进入 ✓;A 若讲义把"敞开池气体逸散"归为外漏则选,否则有争议;D 常压敞开池,事故机理不是超压 ✗。`,transfer:[`分析事故场景先画因果链:加料异常→气体快速溢出→人员暴露中毒,沿链找每个环节的偏差。`,`常压敞开池没有"压力过高"机理——超压只适用于密闭系统,选前先问"这个系统会憋压吗"。`],tags:[`事故场景`,`偏离`,`中毒`,`硫化氢`,`因果链`,`真题`]},{id:`模拟1-4`,source:`模拟1`,part:2,module:`M3`,title:`后果分析`,corePoint:`假定措施失效→最严重后果`,stem:`HAZOP 分析后果(Consequence)时,应当( )`,options:[{label:`A`,text:`假定所有现有安全措施有效,评估正常后果`},{label:`B`,text:`假定所有现有安全措施失效,评估最严重后果`},{label:`C`,text:`后果描述应细化到设备位号、管线、部位`},{label:`D`,text:`分析到"超压"为止即可,不必追到泄漏爆炸`}],answer:[`B`,`C`],analysis:`A 错(应假定失效);D 错(应追到后果链末端,如泄漏→爆炸→火灾,而非停在超压)。`,transfer:[`后果分析铁律:假定所有现有措施失效 → 评估最严重后果 → 追到后果链末端(超压→泄漏→爆炸→火灾→人员伤亡)。`,`细化到设备位号/管线/部位;不要停在"超压"这一层。`],tags:[`后果分析`,`措施失效`,`最严重后果`,`后果链`]},{id:`样题14`,source:`样题`,part:3,module:`M6`,title:`保护措施不符合有效性(需结合 PID)`,corePoint:`措施要针对剧情原因或后果`,stem:`结合 PID-CP25-06 及 HAZOP 节选,选出保护措施不符合保护措施有效性要求的是( )`,options:[{label:`A`,text:`剧情1(炉膛温度过高,原因燃料气量大)→ 燃料气进料压力高报警 PAH037102`},{label:`B`,text:`剧情2(炉膛温度过低,原因市政管网燃料气中断)→ 自控回路 TIC037103`},{label:`C`,text:`剧情3(进炉燃料气压力过低,原因 TIC103 故障阀关小)→ 主燃料气压力低低联锁 PSLL-037103`},{label:`D`,text:`剧情4(炉膛压力过高/回火闪爆)→ 氧含量高报警 AIH037101`}],answer:[`A`,`B`,`C`,`D`],flag:`⚠️ 需以附件 PID 核对测点为准。`,analysis:`①压力高报警不能防止"燃料气量大→温度过高"(压力高≠流量大),且无配套响应;②TIC 回路无法补偿气源中断,且正是剧情1初始事件本身不独立;③PSLL 测点位于阀 PV101 上游,阀故障关小时上游憋压,检测不到进炉实际压力,联锁无效;④氧含量报警不针对炉膛压力过高/回火。`,transfer:[`措施有效性三问:①针对剧情的"原因或后果"吗?②与初始事件独立吗?③能有效执行/触发吗?`,`联锁无效的经典坑:测点位置不覆盖故障场景(PSLL 在阀上游,阀关小→上游憋压测不到),看到"测点位置"就要警惕。`],tags:[`安全措施`,`有效性`,`PID`,`联锁`,`测点`,`真题`]},{id:`样题13`,source:`样题`,part:3,module:`M6`,title:`安全措施有效性判定`,corePoint:`报警+操作员响应(≥PST)、独立自动联锁有效;巡检/监盘无效`,stem:`风险场景"高压分离器液位无→高压气体窜入低压闪蒸罐→低压设备超压爆炸",可判定为有效的是( )`,options:[{label:`A`,text:`低压闪蒸罐设压力高报警,操作规程要求报警后操作员10分钟内打开现场放空阀`},{label:`B`,text:`高压分离器设液位低低联锁,液位<15%自动联锁切断出口切断阀`},{label:`C`,text:`外操每小时现场巡检核对液位计,发现液位低通知内操调整`},{label:`D`,text:`DCS 设液位指示,内操监盘发现后调节液位控制阀`}],answer:[`A`,`B`],analysis:`A 报警+操作员响应,10min 满足 PST ✓;B 独立自动联锁直接切断窜压路径 ✓。C 巡检不作为 IPL ✗;D 依赖人工监盘、与场景同源监控,有效性不足 ✗。`,transfer:[`有效保护层两模板:①报警+操作员响应(响应时间≥PST、任务单一);②独立自动联锁直接切断路径。`,`无效三件套:人工巡检、人工监盘、与场景同源的 DCS 监控——都不作为 IPL。`],tags:[`安全措施`,`有效性`,`报警`,`联锁`,`巡检`,`PST`,`真题`]},{id:`样题12`,source:`样题`,part:3,module:`M6`,title:`安全措施独立性`,corePoint:`共用设备/失效机理/电源=不独立`,stem:`下列哪些情形会使拟识别的安全措施不满足独立性要求,从而不能计入风险降低( )`,options:[{label:`A`,text:`初始事件为"压力控制回路故障",拟增设一安全阀`},{label:`B`,text:`初始事件为"液位计故障显示假低致冒罐",拟用同一块液位计触发的 SIS 高高联锁关阀`},{label:`C`,text:`初始事件为"出料泵电机烧毁",拟用同一回路上的热继电器跳泵保护(同一失效机理)`},{label:`D`,text:`初始事件为"全厂断电",拟用同一 UPS 供电的 ESD 系统`}],answer:[`B`,`C`,`D`],analysis:`选"不满足独立性"的。A 安全阀独立于压力回路 ✅ 可计入。B 共用液位计 ✗;C 共用失效机理 ✗;D 共用电源 ✗。`,transfer:[`不独立四情形:共用传感器/仪表、共用执行机构、共用失效机理、共用电源(如 UPS)。`,`记忆:"同一个东西坏两次"=不独立;初始事件"控制回路故障",安全阀与其无关 → 独立。`],tags:[`安全措施`,`独立性`,`共用`,`电源`,`IPL`,`真题`]},{id:`样题11`,source:`样题`,part:3,module:`M6`,title:`安全措施描述`,corePoint:`针对原因/中间事件/偏离/后果、独立、节点内外、报警上限`,stem:`关于 HAZOP 分析安全措施的描述,正确的是( )`,options:[{label:`A`,text:`应分别针对原因、中间事件、偏离、后果识别已有安全措施`},{label:`B`,text:`安全措施应独立于初始事件`},{label:`C`,text:`安全措施不限于本节点,可在节点内也可在节点外`},{label:`D`,text:`一条剧情上多个报警,最多只能将两个报警作为独立保护层`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。识别安全措施要针对四环节、独立于初始事件、可在节点内外、多报警最多 2 个作独立保护层。`,transfer:[`识别安全措施四点:针对原因/中间事件/偏离/后果四个环节分别识别;独立于初始事件;可在节点内或外;多报警最多 2 个作保护层。`,`"节点外"也要识别——防止"只见树木不见森林"。`],tags:[`安全措施`,`识别`,`节点`,`报警上限`,`独立`,`真题`]},{id:`样题10`,source:`样题`,part:3,module:`M6`,title:`报警成为有效安全措施的条件`,corePoint:`报警须靠人工响应`,stem:`关于报警要成为有效安全措施应满足的条件,说法正确的是( )`,options:[{label:`A`,text:`操作人员应有足够响应时间,至少有5min的响应时间`},{label:`B`,text:`指示(信号)必须是可检测到的`},{label:`C`,text:`操作任务应具有单一性和可操作性,不宜同时执行其它任务`},{label:`D`,text:`报警信号可依赖 DCS 自动触发而无需人工干预,可作为有效安全措施`}],answer:[`A`,`B`,`C`],analysis:`A 关键报警 5min 响应(ISA-18.2)✓;B 可检测 ✓;C 任务单一 ✓。D 错:报警必须靠人工响应才构成保护层,不能自动动作。`,transfer:[`报警成有效安全措施四条件:信号可检测、响应时间够(关键报警 5min/PST)、任务单一可执行、靠人工响应。`,`最常考陷阱:报警不能自动动作,必须依赖操作员人工响应;也不能作为重大危害最后一道防线。`],tags:[`报警`,`安全措施`,`有效性`,`响应时间`,`人工响应`,`真题`]},{id:`样题19`,source:`样题`,part:3,module:`M6`,title:`安全措施可靠性`,corePoint:`铅封开/锁开→可靠性`,stem:`HAZOP 报告建议措施"气液分离罐 D-10 出口蝶阀误关,设备及管道存在超压风险,建议设置铅封开或锁开",该措施是从安全措施的( )特性提出的。`,options:[],answer:[`可靠性`],analysis:`"该动时能动"的概率。蝶阀误关会使超压泄压保护(安全阀)失效;铅封开/锁开把阀门锁定开启,防止误关,确保泄压保护在需要时可靠可用。规范依据:TSG ZF001 安全阀进出口截断阀须铅封锁定全开。`,transfer:[`铅封开/锁开、定期试验、定期检定 → 提高"该动时能动"的可靠性。`,`安全阀进出口截断阀必须铅封锁定全开(TSG ZF001),否则可能因误关导致泄压保护失效。`],tags:[`可靠性`,`铅封`,`锁开`,`安全阀`,`误关`,`真题`],kind:`fill`},{id:`模拟1-18`,source:`模拟1`,part:3,module:`M6`,title:`报警有效性`,corePoint:`报警不能当最后一道防线`,stem:`报警要成为有效安全措施,应满足的条件有( )`,options:[{label:`A`,text:`信号必须可检测、清晰、无歧义、按优先级呈现`},{label:`B`,text:`操作任务应单一,不宜要求同时执行其它任务`},{label:`C`,text:`报警依赖人工响应,不能自动完成保护动作`},{label:`D`,text:`报警可作为重大危害的最后一道防线`}],answer:[`A`,`B`,`C`],analysis:`D 错:报警不能作为重大危害的最后一道防线。`,transfer:[`报警四条件:可检测清晰无歧义、任务单一、人工响应、不能当最后防线。`,`对比记忆:报警是"人机结合"的保护层,去掉人就不成立。`],tags:[`报警`,`有效性`,`人工响应`,`最后防线`]},{id:`模拟1-20`,source:`模拟1`,part:3,module:`M6`,title:`铅封开/锁开→可靠性`,corePoint:`同题19`,stem:`"安全阀进出口切断阀加铅封并锁定全开"主要提高安全措施的( )特性`,options:[{label:`A`,text:`有效性`},{label:`B`,text:`独立性`},{label:`C`,text:`可靠性`},{label:`D`,text:`可审计性`}],answer:[`C`],analysis:`防止关键阀门误关导致超压保护失效,提高"该动时能动"的可靠性。`,transfer:[`四特性区分:有效性=能挡住吗、独立性=独立于事故吗、可靠性=该动时能动吗、可审计性=可追溯吗。`,`铅封锁定=可靠性;加装联锁=有效性;独立 UPS=独立性。`],tags:[`可靠性`,`铅封`,`锁开`,`特性`]},{id:`模拟1-21`,source:`模拟1`,part:3,module:`M6`,title:`识别现有安全措施`,corePoint:`针对四环节、节点内外、多报警上限2个`,stem:`HAZOP 识别现有安全措施时,正确的做法有( )`,options:[{label:`A`,text:`应分别针对原因、中间事件、偏离、后果识别`},{label:`B`,text:`安全措施可以在节点内也可以在节点外`},{label:`C`,text:`一条剧情上多个报警最多作为两个独立保护层`},{label:`D`,text:`只需识别节点内部的安全措施`}],answer:[`A`,`B`,`C`],analysis:`D 错(不限于节点内)。`,transfer:[`识别措施:针对四环节、节点内外、多报警最多 2 个作 IPL。`,`注意"只需识别节点内"是错的——识别范围含节点外。`],tags:[`安全措施`,`识别`,`节点内外`,`报警上限`]},{id:`样题16`,source:`样题`,part:4,module:`M4`,title:`LOPA 计算(死亡可能性)`,corePoint:`LOPA 公式`,stem:`反应器失冷却水升温→反应失控爆炸→1名操作员死亡。冷却水失效频率1×10⁻¹次/年;温度高报警 TIH101(PFD=0.1)、温度高联锁 TIHH101(SIL2,PFD=0.01)均满足功能要求;操作员每天在现场12小时;爆炸后一半机会逃离。用 LOPA 计算造成该操作员死亡的可能性是( )`,options:[],answer:[`2.5×10⁻⁵`,`2.5e-5`],analysis:`死亡频率 = 1×10⁻¹ × 0.1 × 0.01 × (12/24) × 0.5 = 2.5×10⁻⁵ (次/年)。关键:报警 PFD=0.1、SIL2 联锁 PFD=0.01、暴露 12/24=0.5、致死 0.5,一个都不能漏乘。`,transfer:[`LOPA 公式:后果频率 = IE频率 × 使能条件 × ∏PFD × 点火 × 暴露 × 致死——因子一个不漏。`,`PFD 记牢:报警+人=0.1、SIL2 联锁=0.01;暴露=在场时间/总时间;致死=伤亡比例。`,`变式:若再加一个安全阀(0.01),结果再乘 0.01——考"增加保护层降风险"。`],tags:[`LOPA`,`计算`,`PFD`,`SIL2`,`暴露`,`致死频率`,`真题`],kind:`fill`},{id:`样题17`,source:`样题`,part:4,module:`M4`,title:`LOPA 风险降低(SIL/PFD)`,corePoint:`残余频率与目标对比`,stem:`"调节阀故障全开→进料过多→反应失控→爆炸",初始事件频率1×10⁻²/年,现有 BPCS 报警+操作员干预(PFD=0.1)、安全阀泄放(PFD=0.01),要达到1×10⁻⁶/年的可接受风险,可以提出的建议措施是( )`,options:[{label:`A`,text:`增加一个 SIS 联锁,SIL2 等级(PFD=0.01)`},{label:`B`,text:`增加第二个独立报警`},{label:`C`,text:`增加操作人员巡检频次`},{label:`D`,text:`无需增加,现有保护层已足够`}],answer:[`A`],analysis:`现有残余=1×10⁻²×0.1×0.01=1×10⁻⁵/年;目标 1×10⁻⁶,还需降 10 倍。A:1×10⁻⁵×0.01=1×10⁻⁷ 达标 ✓。B 同一场景"报警+人"最多 1 个 IPL ✗;C 巡检不作为 IPL ✗;D 未达标 ✗。`,transfer:[`算残余频率 → 对比目标 → 缺多少降多少;需要降 10 倍 → 加一个 PFD=0.01 的 SIL2 联锁。`,`陷阱:同一场景"报警+人"最多 1 个 IPL,不能靠加报警降风险;巡检不作为 IPL。`],tags:[`LOPA`,`SIL`,`PFD`,`残余风险`,`风险降低`,`真题`]},{id:`样题8`,source:`样题`,part:4,module:`M4`,title:`风险评估基础概念`,corePoint:`广泛可接受≠无需警惕`,stem:`关于风险评估,下列说法不正确的是( )`,options:[{label:`A`,text:`企业可根据自身特点制定事故后果分类的严重程度等级和可接受标准`},{label:`B`,text:`独立保护层是能阻止事故场景向不利后果发展的设备/系统/行动,并独立于初始事件`},{label:`C`,text:`广泛可接受区域"无需对风险保持警惕"`},{label:`D`,text:`多个初始事件导致同一后果,最终事故发生频率等于各独立初始事件频率的总和`}],answer:[`C`],analysis:`C 错:广泛可接受区域剩余风险可忽略、一般不要求进一步措施,但仍需对该水平风险保持警惕。`,transfer:[`广泛可接受区域=剩余风险可忽略、一般不要求进一步措施,但"无需警惕"是错误表述。`,`多初始事件同后果 → 频率相加(频率叠加);IPL 定义=独立于初始事件、能阻止场景发展的设备/系统/行动。`],tags:[`风险评估`,`可接受风险`,`IPL`,`频率叠加`,`真题`]},{id:`模拟1-12`,source:`模拟1`,part:4,module:`M4`,title:`可作为 IPL`,corePoint:`独立 SIS、安全阀 ✓;巡检、共电源 ✗`,stem:`下列措施中,可作为独立保护层(IPL)计入风险降低的是( )`,options:[{label:`A`,text:`独立于 BPCS 的 SIS 高液位联锁切断进料`},{label:`B`,text:`操作规程规定操作员定期巡检`},{label:`C`,text:`正确设计、定期检验的安全阀`},{label:`D`,text:`与初始事件共用同一 UPS 供电的 ESD 系统`}],answer:[`A`,`C`],analysis:`B 巡检不算 IPL;D 共用 UPS 不独立。`,transfer:[`典型 IPL:独立 SIS 联锁、正确设计定期检验的安全阀、报警+操作员(≥10min)、围堰、防爆墙。`,`非 IPL:巡检、培训、消防应急、共电源 ESD、与初始事件同传感器的 SIS。`],tags:[`IPL`,`独立保护层`,`SIS`,`安全阀`,`UPS`]},{id:`模拟1-13`,source:`模拟1`,part:4,module:`M4`,title:`不作为 IPL`,corePoint:`巡检/培训/消防队应急不算`,stem:`下列措施,通常不作为独立保护层(IPL)的有( )`,options:[{label:`A`,text:`操作员巡检`},{label:`B`,text:`培训教育`},{label:`C`,text:`工厂消防队应急响应`},{label:`D`,text:`独立 SIS 联锁`}],answer:[`A`,`B`,`C`],analysis:`D 独立 SIS 是典型 IPL。`,transfer:[`不作为 IPL:巡检、培训教育、工厂消防队应急响应。`,`对比:独立 SIS 联锁、安全阀、爆破片是典型 IPL。`],tags:[`IPL`,`巡检`,`培训`,`消防`,`SIS`]},{id:`模拟1-14`,source:`模拟1`,part:4,module:`M4`,title:`SIL2 PFD`,corePoint:`SIL 数值`,stem:`SIL2 级安全仪表功能(SIF)的平均要求时失效概率(PFDavg)范围为( )`,options:[{label:`A`,text:`1×10⁻¹~1×10⁻²`},{label:`B`,text:`1×10⁻²~1×10⁻³`},{label:`C`,text:`1×10⁻³~1×10⁻⁴`},{label:`D`,text:`1×10⁻⁴~1×10⁻⁵`}],answer:[`B`],analysis:`SIL1=10⁻¹~10⁻²、SIL2=10⁻²~10⁻³、SIL3=10⁻³~10⁻⁴、SIL4=10⁻⁴~10⁻⁵。`,transfer:[`PFDavg:SIL1=10⁻¹~10⁻²、SIL2=10⁻²~10⁻³、SIL3=10⁻³~10⁻⁴、SIL4=10⁻⁴~10⁻⁵。`,`SIL 越高,PFD 越小;口诀:"SIL 几就约等于 10 的负几"。`],tags:[`SIL`,`PFD`,`SIF`,`安全完整性`]},{id:`模拟1-15`,source:`模拟1`,part:4,module:`M4`,title:`LOPA 计算`,corePoint:`使能/点火/暴露/致死都乘`,stem:`某储罐进料泵故障导致溢流,初始事件频率 1×10⁻¹ 次/年;设有高液位报警+操作员响应(PFD=0.1)和安全阀(PFD=0.01);装置 50% 时间处于进料状态;点火概率 0.5、人员暴露概率 0.1、致死概率 0.1。用 LOPA 计算人员死亡频率约为( )`,options:[{label:`A`,text:`2.5×10⁻⁸`},{label:`B`,text:`2.5×10⁻⁶`},{label:`C`,text:`2.5×10⁻⁷`},{label:`D`,text:`5×10⁻⁷`}],answer:[`C`],analysis:`死亡频率 = 1×10⁻¹ × 0.5 × 0.1 × 0.01 × 0.5 × 0.1 × 0.1 = 2.5×10⁻⁷ (次/年)。使能(50%进料=0.5)、点火(0.5)、暴露(0.1)、致死(0.1)都不能漏乘。`,transfer:[`完整 LOPA:IE × 使能(50%进料=0.5)× 报警PFD(0.1)× 安全阀PFD(0.01)× 点火(0.5)× 暴露(0.1)× 致死(0.1)。`,`使能条件(装置是否处于危险工况)、点火概率在计算题里最容易漏乘。`],tags:[`LOPA`,`计算`,`使能`,`点火`,`暴露`,`致死`]},{id:`模拟1-16`,source:`模拟1`,part:4,module:`M4`,title:`报警响应时间`,corePoint:`5min/ PST /作IPL≥10min`,stem:`报警+操作员响应要作为独立保护层,关于操作人员响应时间,正确的是( )`,options:[{label:`A`,text:`关键报警(ISA-18.2)响应时限为5分钟`},{label:`B`,text:`必须在过程安全时间(PST)内完成响应`},{label:`C`,text:`作为 IPL 一般要求 ≥10 分钟且有书面程序支撑`},{label:`D`,text:`无需考虑响应时间`}],answer:[`A`,`B`,`C`],analysis:`D 错。`,transfer:[`三个时间概念:关键报警 5min(ISA-18.2)、必须 <PST(过程安全时间)、作 IPL 一般 ≥10min + 书面程序。`,`响应时间不够 → 报警不能作为 IPL。`],tags:[`报警`,`响应时间`,`PST`,`IPL`,`5min`]},{id:`模拟1-17`,source:`模拟1`,part:4,module:`M4`,title:`多初始事件频率叠加`,corePoint:`频率相加`,stem:`多个初始事件导致同一个后果,该后果的发生频率计算方法是( )`,options:[{label:`A`,text:`等于各初始事件频率中的最大值`},{label:`B`,text:`等于各独立初始事件频率的总和`},{label:`C`,text:`等于各初始事件频率的乘积`},{label:`D`,text:`取各初始事件频率的平均值`}],answer:[`B`],analysis:`各独立初始事件频率之和(频率叠加)。`,transfer:[`多初始事件同一后果 → 频率=各初始事件频率之和(不是最大、不是乘积)。`,`例:两个独立泄漏源都可能导致爆炸,爆炸频率=泄漏1频率+泄漏2频率。`],tags:[`频率叠加`,`初始事件`,`后果频率`,`LOPA`]},{id:`样题18`,source:`样题`,part:5,module:`M9`,title:`本质安全与风险控制优先级`,corePoint:`消除>替代>工程>管理>PPE`,stem:`识别出"氧化剂系统与含氯/还原性物料系统存在潜在串料可能",从本质安全和风险控制优先级角度,最有效、最根本的建议措施是( )`,options:[{label:`A`,text:`增加 H₂O₂ 浓度在线分析高报警`},{label:`B`,text:`增设配制釜温度高高联锁停搅拌`},{label:`C`,text:`选择安全阀+爆破片配置`},{label:`D`,text:`实施物理隔离(拆除连通管或加盲板),并规定"禁止临时软管互连未经审批"`}],answer:[`D`],analysis:`物理隔离属"消除/隔离"最高优先层级,从源头消除危险连接;A/B/C 都是外加保护层、被动响应。`,transfer:[`控制层级(最高到最低):消除 > 替代 > 工程控制 > 管理控制 > PPE。`,`物理隔离(拆管/加盲板)属"消除"层级最根本;报警/联锁/安全阀都是外加保护层,优先级低。`],tags:[`本质安全`,`控制层级`,`消除`,`物理隔离`,`保护层`,`真题`]},{id:`模拟1-22`,source:`模拟1`,part:5,module:`M9`,title:`本质安全四原则`,corePoint:`最小化/替代/缓和/简化`,stem:`下列本质安全设计原则与实例对应正确的有( )`,options:[{label:`A`,text:`最小化 —— 用微通道反应器降低危险物料存量`},{label:`B`,text:`替代 —— 用过氧化氢法替代氯醇法生产环氧丙烷`},{label:`C`,text:`缓和 —— 氨合成压力由高压降至低压`},{label:`D`,text:`简化 —— 减少不必要的管道连接、法兰接头`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`本质安全四原则:最小化(降存量)、替代(换工艺/物料)、缓和(降压力温度)、简化(减少连接)。`,`经典例子:微通道反应器=最小化;过氧化氢法替代氯醇法=替代;低压合成=缓和;少法兰=简化。`],tags:[`本质安全`,`最小化`,`替代`,`缓和`,`简化`]},{id:`模拟1-23`,source:`模拟1`,part:5,module:`M9`,title:`风险矩阵管控要求`,corePoint:`红色=不可接受立即整改`,stem:`风险矩阵法 R=L×S 中,风险等级为"重大风险(红色)"时,对应的管控要求有( )`,options:[{label:`A`,text:`在采取措施降低风险前不能继续作业`},{label:`B`,text:`只需保持现有管理程序即可`},{label:`C`,text:`属不可接受风险,应立即整改`},{label:`D`,text:`由岗位级负责管控`}],answer:[`A`,`C`],analysis:`B 错(不是"保持现状");D 错(红色由公司级管控)。`,transfer:[`风险矩阵四色:红色(重大)=不可接受、立即整改、降低前不作业、公司级管控;橙/黄/蓝依次降级管控。`,`"只需保持现有程序"和"岗位级管控"都是红色风险的错误表述。`],tags:[`风险矩阵`,`红色`,`重大风险`,`管控`,`四色`]},{id:`模拟2-24`,source:`模拟2`,part:5,module:`M9`,title:`风险矩阵计算`,corePoint:`L 频率分级 / S 四维取高 / 可接受=一般风险区域`,stem:`某反应釜超压泄漏场景,泄漏频率为 2×10⁻³ 次/年;可能造成 2 人死亡、直接经济损失 500 万元。按官方附件8 风险矩阵法,该场景 L、S 分级、R 值及可接受性为( )`,options:[{label:`A`,text:`L=4(高)、S=5(重大)、R=20,属不可接受风险(在一般风险区域外)`},{label:`B`,text:`L=4、S=4、R=16,一般风险,可接受`},{label:`C`,text:`L=5、S=5、R=25,不可接受`},{label:`D`,text:`L=3、S=5、R=15,较大风险`}],answer:[`A`],analysis:`L:2×10⁻³∈[10⁻³,10⁻²]→L=4;S:出现死亡→S=5(重大),财务 500 万∈[100万,1000万)→S=4,人员与财务取最高 S=5;R=4×5=20,在一般风险区域外→不可接受。`,transfer:[`官方 L 分级:5>10⁻²、4=10⁻³~10⁻²、3=10⁻⁴~10⁻³、2=10⁻⁵~10⁻⁴、1<10⁻⁵。`,`S 四维(人员/环境/财务/声誉)取最高;出现死亡=5;R=L×S;R 在一般风险区域外=不可接受。`,`变式:3×10⁻⁴ 次/年 → L=3;若只重伤无死亡 → S=4。`],tags:[`风险矩阵`,`计算`,`L分级`,`S分级`,`可接受风险`,`官方附件8`]},{id:`模拟2-25`,source:`模拟2`,part:5,module:`M9`,title:`风险矩阵 S 分级`,corePoint:`官方 S 分级`,stem:`按官方附件8 风险矩阵法的后果严重度(S)分级,下列判定正确的有( )`,options:[{label:`A`,text:`出现 1 人死亡 → S=5(重大)`},{label:`B`,text:`造成 2 人重伤 → S=4(较大)`},{label:`C`,text:`轻微伤害需急救处理 → S=2(低)`},{label:`D`,text:`直接经济损失 500 万元 → S=4(较大)`}],answer:[`A`,`B`,`C`,`D`],analysis:`出现死亡→S5;3人以下重伤→S4;轻微伤害需急救→S2;直接损失 100万~1000万(含100万)→S4。`,transfer:[`官方 S 分级:死亡=5、3 人以下重伤=4、轻伤需急救=2;直接损失 100万~1000万=4、≥1000万=5。`,`S 取值:人员/环境/财务/声誉四个维度取最高的那个。`],tags:[`风险矩阵`,`S分级`,`严重度`,`官方附件8`]},{id:`样题9`,source:`样题`,part:6,module:`M5`,title:`针对泄漏的保护措施`,corePoint:`检测—隔离—稀释—围堵`,stem:`针对泄漏考虑的保护措施有( )`,options:[{label:`A`,text:`检测`},{label:`B`,text:`隔离`},{label:`C`,text:`稀释`},{label:`D`,text:`围堵`}],answer:[`A`,`B`,`C`,`D`],analysis:`检测(气体/液体监测)、隔离(手动或遥控切断)、稀释(蒸汽/氮气)、围堵(事故池/事故槽)。`,transfer:[`泄漏保护四类:检测(气体/液体监测)、隔离(手动/遥控切断)、稀释(蒸汽/氮气)、围堵(事故池)。`,`记忆口诀:"检隔稀围"——四选全。`],tags:[`泄漏`,`保护措施`,`检测`,`隔离`,`稀释`,`围堵`,`真题`]},{id:`模拟1-19`,source:`模拟1`,part:6,module:`M5`,title:`泄漏保护四类`,corePoint:`同题9`,stem:`针对泄漏的保护措施,按"检测—隔离—稀释—围堵"分类,对应正确的有( )`,options:[{label:`A`,text:`可燃气体检测器 → 检测`},{label:`B`,text:`遥控紧急切断阀 → 隔离`},{label:`C`,text:`用氮气稀释泄漏物料 → 稀释`},{label:`D`,text:`事故池收集泄漏物 → 围堵`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`分类对应:可燃气体检测器=检测、紧急切断阀=隔离、氮气稀释=稀释、事故池=围堵。`,`常见错配:把"事故池"归为隔离(是围堵);把"氮气吹扫"归为隔离(是稀释)。`],tags:[`泄漏`,`检测`,`隔离`,`稀释`,`围堵`]},{id:`样题15`,source:`样题`,part:7,module:`M8`,title:`建议措施的有针对性、可执行`,corePoint:`具体+可跟踪,拒绝空泛口号`,stem:`下列 HAZOP 建议措施,满足有针对性、可执行要求,能纳入正式分析报告跟踪落实的有( )`,options:[{label:`A`,text:`"加强操作纪律管理,严格执行工艺卡片参数要求,杜绝超温超压操作"`},{label:`B`,text:`"精馏塔 T-101 塔底增设液位低低联锁,液位低于15%时联锁停塔底出料泵 P-101"`},{label:`C`,text:`"将该反应器操作压力从2.0MPa降至1.5MPa,提高设计安全裕度"`},{label:`D`,text:`"大检修期间对该高温重油管线所有环焊缝进行100%超声波无损检测"`}],answer:[`B`,`C`,`D`],analysis:`A 是泛泛管理口号,无具体对象/参数/动作,不能跟踪落实 ✗。`,transfer:[`好建议措施三标准:有针对性(具体对象/参数)、可执行(明确动作)、可跟踪(能验证落实)。`,`反例陷阱:"加强管理""提高意识"这类口号式措施不能进正式报告。`],tags:[`建议措施`,`针对性`,`可执行`,`可跟踪`,`真题`]},{id:`样题20`,source:`样题`,part:7,module:`M8`,title:`管理类建议措施`,corePoint:`管理类可作为建议措施;作IPL须满足四特性`,stem:`HAZOP 分析时提出建议措施,下列说法不正确的是( )`,options:[{label:`A`,text:`在设计阶段应以工程措施为优先原则`},{label:`B`,text:`管理类措施和识别的安全措施类似,不能作为建议措施提出`},{label:`C`,text:`管理类措施不能作为建议措施提出`},{label:`D`,text:`生产运行阶段若能通过加强管理提高安全水平,可以提出管理类建议措施`}],answer:[`B`,`C`],analysis:`管理类措施可以作为建议措施提出;但作为"保护层/IPL 计减风险"时须满足四特性(有效/独立/可靠/可审计),培训教育类一般不作为 IPL。`,transfer:[`管理类措施可以作为建议措施提出(尤其运行阶段)。`,`但要区分:作为"建议措施"可以提;作为"IPL 计减风险"必须满足四特性(有效/独立/可靠/可审计),培训类一般不作为 IPL。`],tags:[`建议措施`,`管理类`,`IPL`,`四特性`,`真题`]},{id:`模拟1-25`,source:`模拟1`,part:7,module:`M8`,title:`建议措施`,corePoint:`同题15/20`,stem:`关于 HAZOP 建议措施,正确的是( )`,options:[{label:`A`,text:`应具有针对性、可执行、可跟踪`},{label:`B`,text:`设计阶段应以工程措施为优先`},{label:`C`,text:`管理类措施不能作为建议措施提出`},{label:`D`,text:`运行阶段可通过加强管理提出管理类建议措施`}],answer:[`A`,`B`,`D`],analysis:`C 错:管理类措施可以作为建议措施提出。`,transfer:[`同题15/20:设计阶段以工程措施优先、运行阶段可提管理类建议、措施须可执行可跟踪。`,`"管理类不能提"是错误表述。`],tags:[`建议措施`,`管理类`,`工程措施`,`可执行`]},{id:`样题6`,source:`样题`,part:8,module:`M7`,title:`人员暴露率`,corePoint:`暴露率=时间÷周期`,stem:`乙烯装置一小时一巡检,每次裂解炉周围约5分钟,人员暴露率取值可为( )`,options:[],answer:[`0.08`],analysis:`暴露率 = 5分钟 ÷ 60分钟 ≈ 0.083 ≈ 0.08。`,transfer:[`暴露率=实际暴露时间÷统计周期。每小时巡 5 分钟 → 5/60≈0.08。`,`LEC 的 E(暴露频率)与 LOPA 的暴露概率不是一回事:前者是"多常暴露",后者是"暴露时在场概率"。`],tags:[`暴露率`,`LEC`,`计算`,`时间占比`,`真题`],kind:`fill`},{id:`模拟1-24`,source:`模拟1`,part:8,module:`M7`,title:`LEC 计算`,corePoint:`官方 C 表 + D 分级`,stem:`某作业 L=3(可能但不经常)、E=6(每天工作时间内暴露)、C=15(一人死亡),则 D 值及危险等级为( )(按官方附件9标准)`,options:[{label:`A`,text:`D=270,较大风险,需立即采取紧急措施并整改`},{label:`B`,text:`D=270,一般风险,需要整改`},{label:`C`,text:`D=240,较大风险,需要整改`},{label:`D`,text:`D=180,一般风险,需要注意`}],answer:[`A`],analysis:`D=3×6×15=270 → 落在 160~320 = Ⅱ 较大风险,需立即采取紧急措施并整改(官方命名)。`,transfer:[`官方 LEC:D=L×E×C;D 分级:Ⅰ>320 重大不能作业、Ⅱ160~320 较大立即整改、Ⅲ70~160 较大需整改、Ⅳ20~70 一般、Ⅴ0~20 低。`,`官方 C 表:100(10 人以上死亡)/40(3~9 人死亡)/15(一人死亡)/7(一至二人重伤)/3(轻伤)/1(轻微)。`],tags:[`LEC`,`计算`,`C表`,`D分级`,`官方附件9`]},{id:`模拟2-22`,source:`模拟2`,part:8,module:`M7`,title:`LEC 计算(低风险判定)`,corePoint:`低风险判定`,stem:`某现场清理作业,采用 LEC 法开展风险评估:L=0.5(很不可能)、E=3(每周一次或偶然)、C=7(一至二人重伤)。按官方附件9,该作业风险值 D 及等级为( )`,options:[{label:`A`,text:`D=10.5,Ⅴ级低风险,注意防护即可`},{label:`B`,text:`D=10.5,Ⅳ级一般风险,尽量整改`},{label:`C`,text:`D=21,Ⅳ级一般风险,尽量整改`},{label:`D`,text:`D=10.5,Ⅲ级较大风险,需整改`}],answer:[`A`],analysis:`D=0.5×3×7=10.5,落在 0~20 → Ⅴ级低风险。`,transfer:[`D<20 即 Ⅴ 级低风险。注意 L 可以小于 1(0.5=很不可能),乘出来可以是小数。`,`C=7 对应"一至二人重伤",不是死亡。`],tags:[`LEC`,`计算`,`低风险`,`Ⅴ级`,`官方附件9`]},{id:`模拟2-23`,source:`模拟2`,part:8,module:`M7`,title:`LEC 计算(重大风险判定)`,corePoint:`重大风险判定`,stem:`某合成氨装置动火作业:L=6(相当可能)、E=6(每天工作时间内暴露)、C=40(三至九人死亡或10~30人重伤)。按官方附件9 LEC 法,该作业风险值 D 及等级为( )`,options:[{label:`A`,text:`D=1440,Ⅰ级重大风险,不能作业,必须立即停产整改`},{label:`B`,text:`D=1440,Ⅱ级较大风险,立即整改`},{label:`C`,text:`D=720,Ⅰ级重大风险,不能作业`},{label:`D`,text:`D=1440,Ⅴ级低风险`}],answer:[`A`],analysis:`D=6×6×40=1440,>320 → Ⅰ级重大风险,不能作业。`,transfer:[`D>320 即 Ⅰ 级重大风险,不能作业。C=40 对应"3~9 人死亡或 10~30 人重伤"。`,`识别陷阱:C 值用错(如把一人死亡 15 误当 40)、D 分级边界记错。`],tags:[`LEC`,`计算`,`重大风险`,`Ⅰ级`,`官方附件9`]},{id:`模拟2-17`,source:`模拟2`,part:9,module:`M11`,title:`JSA 定义定位`,corePoint:`任务级、与作业许可绑定;≠系统级`,stem:`关于 JSA(作业安全分析),正确的是( )`,options:[{label:`A`,text:`JSA 是任务级、结构化的风险控制方法`},{label:`B`,text:`把作业分解为若干步骤,逐一辨识危害、评价风险并制定控制措施`},{label:`C`,text:`JSA 通常与作业许可证(工作票)绑定执行`},{label:`D`,text:`JSA 属系统级工艺分析,与 HAZOP 作用相同`}],answer:[`A`,`B`,`C`],analysis:`D 错:JSA 属任务层,HAZOP 属系统层,层级不同、作用互补。`,transfer:[`JSA 是任务级方法,把作业拆步骤 → 辨危害 → 评风险(LS法)→ 定措施,与作业许可绑定。`,`层级对比:HAZOP=系统层(工艺全流程)、JSA=任务层(具体作业),作用互补不重叠。`],tags:[`JSA`,`作业安全分析`,`任务级`,`作业许可`,`LS法`]},{id:`模拟2-18`,source:`模拟2`,part:9,module:`M11`,title:`JSA 步骤与危害辨识`,corePoint:`步骤<10、记录"做什么"、四大类、记录表(LS 法)`,stem:`JSA 步骤分解与危害辨识,正确的有( )`,options:[{label:`A`,text:`大多数作业步骤少于 10 步,须保持正确顺序`},{label:`B`,text:`步骤记录重点在"做什么",而非"怎么做"`},{label:`C`,text:`危害因素分为人的因素、物的因素、环境因素、管理因素四大类`},{label:`D`,text:`JSA 记录表含作业步骤、危害因素、现有措施、风险评估(LS 法/风险矩阵)、新增措施等栏位`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`JSA 步骤要求:<10 步、顺序正确、记"做什么"不记"怎么做"。`,`危害辨识四大类:人的因素/物的因素/环境因素/管理因素。`,`记录表栏位:步骤 → 危害(原因+后果)→ 现有措施(有效1/无效0)→ P/S/R → 新增措施 → P1/S1/R1 → 责任人。`],tags:[`JSA`,`步骤分解`,`危害辨识`,`记录表`,`LS法`]},{id:`模拟2-19`,source:`模拟2`,part:10,module:`M12`,title:`事故树 FTA`,corePoint:`与门=冗余、或门=脆弱、一阶割集=单点故障`,stem:`关于事故树分析 FTA,正确的是( )`,options:[{label:`A`,text:`自上而下演绎分析,从顶上事件追溯至基本事件`},{label:`B`,text:`与门表示所有输入事件同时发生才导致输出,对应冗余防御`},{label:`C`,text:`一阶最小割集即单点故障,最为危险`},{label:`D`,text:`一次分析可同时设定多个顶上事件`}],answer:[`A`,`B`,`C`],analysis:`D 错:一次分析只能设一个顶上事件。`,transfer:[`FTA:自上而下演绎、单一顶上事件、与门=冗余(全要)、或门=脆弱(任一)、一阶割集=单点故障最危险。`,`与门/或门辨析:两事件"同时发生才出事"=与门(有冗余);"任一发生就出事"=或门(脆弱)。`],tags:[`FTA`,`事故树`,`与门`,`或门`,`割集`,`顶上事件`]},{id:`模拟2-20`,source:`模拟2`,part:10,module:`M12`,title:`事件树 ETA 与蝴蝶结图`,corePoint:`ETA 正向/分支连乘;Bow-tie 左预防右减缓`,stem:`事件树 ETA 与蝴蝶结图 Bow-tie,正确的有( )`,options:[{label:`A`,text:`ETA 从初始事件出发,正向推演各安全功能成败组合`},{label:`B`,text:`ETA 某分支概率 = 初始事件概率 × 各环节条件概率连乘`},{label:`C`,text:`Bow-tie 左侧布设预防性屏障,右侧布设减缓/恢复屏障`},{label:`D`,text:`Bow-tie 中心为顶上事件(关键事件)`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`ETA 正向推演:初始事件 → 安全功能成败组合 → 各分支概率连乘。`,`Bow-tie:中心=顶上事件(关键事件)、左=预防性屏障(原因侧)、右=减缓/恢复屏障(后果侧)。`],tags:[`ETA`,`事件树`,`Bow-tie`,`蝴蝶结图`,`预防屏障`,`减缓屏障`]},{id:`模拟2-21`,source:`模拟2`,part:10,module:`M12`,title:`双重预防机制`,corePoint:`风险分级管控+隐患排查治理`,stem:`双重预防机制,正确的有( )`,options:[{label:`A`,text:`双重预防机制 = 安全风险分级管控 + 隐患排查治理`},{label:`B`,text:`风险 = 可能性 × 严重性,分重大/较大/一般/低四级(红橙黄蓝)`},{label:`C`,text:`重大事故隐患治理应落实"责任、措施、资金、时限、预案"五落实`},{label:`D`,text:`排查制度为班组日排查、部门周排查、经理月排查`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`双重预防机制=风险分级管控+隐患排查治理,双防线缺一不可。`,`风险四色:重大/较大/一般/低(红橙黄蓝);重大隐患治理"五落实"(责任/措施/资金/时限/预案);排查"日周月"(班组/部门/经理)。`],tags:[`双重预防`,`风险分级管控`,`隐患排查`,`四色`,`五落实`]},{id:`模拟2-10`,source:`模拟2`,part:11,module:`M12`,title:`动火作业分级`,corePoint:`特级/一级/二级及票有效期`,stem:`关于动火作业分级,正确的是( )`,options:[{label:`A`,text:`运行状态下装置带压不置换动火属特级动火`},{label:`B`,text:`管廊上动火按一级动火管理`},{label:`C`,text:`特级动火作业票有效期不超过 8 小时`},{label:`D`,text:`二级动火作业票有效期不超过 72 小时`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`动火三级:特级(带压不置换等,票≤8h)、一级(管廊等,票≤8h)、二级(其他,票≤72h)。`,`记忆:"特殊一紧急"(特级最严);票有效期 特级/一级 8h、二级 72h。`],tags:[`动火作业`,`分级`,`特级`,`一级`,`二级`,`作业票`]},{id:`模拟2-11`,source:`模拟2`,part:11,module:`M12`,title:`动火气体检测`,corePoint:`10m、≤30min、LEL≥4%时≤0.5%、中断30/60min`,stem:`动火作业气体检测,正确的有( )`,options:[{label:`A`,text:`在动火点 10m 范围内进行可燃气体分析`},{label:`B`,text:`取样分析合格与动火开始间隔不超过 30 分钟`},{label:`C`,text:`被测气体爆炸下限 ≥4% 时,浓度 ≤0.5%(体积分数)为合格`},{label:`D`,text:`特级、一级动火中断超过 60 分钟须重新分析`}],answer:[`A`,`B`,`C`],analysis:`D 错:特级/一级中断超 30 分钟重新分析,二级才超 60 分钟。`,transfer:[`动火气体检测三要点:10m 范围内、分析合格与动火间隔≤30min、LEL≥4% 时浓度≤0.5%(LEL<4% 时≤0.2%)。`,`中断重测:特级/一级超 30min、二级超 60min 必须重新分析。`],tags:[`动火作业`,`气体检测`,`10m`,`30分钟`,`LEL`,`0.5%`]},{id:`模拟2-12`,source:`模拟2`,part:11,module:`M12`,title:`特级动火要求`,corePoint:`主要负责人审批/连续监测/影像;30m气体15m液体`,stem:`特级动火作业要求,正确的有( )`,options:[{label:`A`,text:`由企业主要负责人审批`},{label:`B`,text:`动火期间连续监测可燃气体`},{label:`C`,text:`采集全过程作业影像`},{label:`D`,text:`距动火点 30m 内不得排放可燃液体`}],answer:[`A`,`B`,`C`],analysis:`D 错:距动火点 30m 内不排放可燃气体、15m 内不排放可燃液体。`,transfer:[`特级动火四要求:主要负责人审批、连续监测可燃气体、采集全过程影像、运行状态下带压不置换。`,`距离记忆:30m 内不排可燃气体、15m 内不排可燃液体——别记反。`],tags:[`特级动火`,`审批`,`连续监测`,`影像`,`30m`,`15m`] :`4%(vol)`},{label:`C`,text:`25%(vol)`},{label:`D`,text:`75%(vol)`}],answer:[`A`],analysis:`25% × 4% = 1.0vol%。`,transfer:[`vol% = %LEL × LEL。氢 LEL=4%,25%LEL=1.0vol%。`,`常见爆炸极限:氢 4~75%、氨 15~28%、甲烷 5~15%。`],tags:[`%LEL`,`换算`,`爆炸极限`,`氢气`,`LEL`]},{id:`模拟2-2`,source:`模拟2`,part:12,module:`M13`,title:`爆炸极限影响因素`,corePoint:`温度↑范围宽、压力↑UEL、惰性收窄;>UEL≠安全`,stem:`关于爆炸极限及影响因素,正确的是( )`,options:[{label:`A`,text:`温度升高,爆炸下限降低、上限升高,爆炸范围变宽`},{label:`B`,text:`压力升高主要使爆炸上限显著升高`},{label:`C`,text:`惰性气体(如氮气)稀释可使可燃范围收窄直至失去爆炸性`},{label:`D`,text:`可燃气体浓度高于爆炸上限即绝对安全,可放心排放`}],answer:[`A`,`B`,`C`],analysis:`D 错:>UEL 只是氧不足不爆,稀释后可能回入爆炸范围。`,transfer:[`温度↑→范围变宽(LEL↓/UEL↑);压力↑→UEL 显著升高;惰性气体→范围收窄。`,`陷阱:>UEL 不爆≠安全,稀释后会回入爆炸范围。`],tags:[`爆炸极限`,`影响因素`,`温度`,`压力`,`惰性气体`,`UEL`]},{id:`模拟2-3`,source:`模拟2`,part:12,module:`M13`,title:`气体检测报警值`,corePoint:`可燃 25%/50%LEL;有毒 100%/200%OEL`,stem:`按 GB/T 50493-2019,可燃/有毒气体检测报警值设定正确的有( )`,options:[{label:`A`,text:`可燃气体一级报警 ≤25%LEL`},{label:`B`,text:`可燃气体二级报警 ≤25%LEL`},{label:`C`,text:`有毒气体一级报警 ≤100%OEL`},{label:`D`,text:`有毒气体二级报警 ≤50%OEL`}],answer:[`A`,`C`],analysis:`可燃一级 25%、二级 50%;有毒一级 100%、二级 200%。`,transfer:[`GB/T 50493-2019:可燃一级≤25%LEL、二级≤50%LEL;有毒一级≤100%OEL、二级≤200%OEL。`,`数值记忆:可燃"25/50",有毒"100/200"。`],tags:[`气体检测`,`报警值`,`LEL`,`OEL`,`GB50493`]},{id:`模拟2-4`,source:`模拟2`,part:12,module:`M13`,title:`置换吹扫合格标准`,corePoint:`可燃≤0.5%、氧≤0.5~1%`,stem:`合成氨装置检修前进行氮气置换,下列置换合格标准正确的有( )`,options:[{label:`A`,text:`氮气置换可燃气体:可燃气体成分 ≤0.5%(体积)`},{label:`B`,text:`可燃气体置换惰性气体:氧含量 ≤0.5%`},{label:`C`,text:`氮气置换空气:氧含量 ≤1%`},{label:`D`,text:`置换结束后保持微正压,防止空气倒吸`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`氮气置换:置换可燃气体 → 可燃≤0.5%;可燃置换惰性 → 氧≤0.5%;氮气置换空气 → 氧≤1%(后引可燃介质则≤0.5%)。`,`置换后保持微正压防倒吸。`],tags:[`置换`,`吹扫`,`合格标准`,`氧含量`,`0.5%`,`微正压`]},{id:`模拟2-5`,source:`模拟2`,part:12,module:`M13`,title:`受限空间气体检测`,corePoint:`氧19.5~21%(富氧≤23.5%)、可燃<10%LEL、30min/60min`,stem:`受限空间作业气体检测与管理,正确的有( )`,options:[{label:`A`,text:`进入前氧含量应为 19.5%~21%,富氧环境不大于 23.5%`},{label:`B`,text:`可燃气体浓度应低于爆炸下限的 10%(<10%LEL)`},{label:`C`,text:`作业前 30 分钟内检测合格方可进入;中断超过 60 分钟重新检测`},{label:`D`,text:`严禁向受限空间充纯氧,须设外部专人全程监护`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`受限空间检测:氧 19.5~21%(富氧≤23.5%)、可燃<10%LEL;作业前 30min 检测、中断超 60min 重测。`,`严禁充纯氧;外部专人全程监护。`],tags:[`受限空间`,`氧含量`,`LEL`,`30分钟`,`监护`]},{id:`模拟2-6`,source:`模拟2`,part:12,module:`M13`,title:`安全阀 vs 爆破片`,corePoint:`安全阀可重复/爆破片密封好响应快`,stem:`安全阀与爆破片比较,正确的是( )`,options:[{label:`A`,text:`安全阀可重复启闭,爆破片一次性破裂须更换`},{label:`B`,text:`爆破片密封性好,适合腐蚀性、粘性介质`},{label:`C`,text:`安全阀响应快于爆破片,适合急剧升压场合`},{label:`D`,text:`整定压力应不大于容器设计压力`}],answer:[`A`,`B`,`D`],analysis:`C 错:爆破片响应更快。`,transfer:[`安全阀:可重复启闭、响应有滞后;爆破片:一次性、密封好、响应快,适合腐蚀/粘性/急剧升压。`,`整定压力≤容器设计压力。`],tags:[`安全阀`,`爆破片`,`泄压`,`密封`,`响应速度`]},{id:`模拟2-7`,source:`模拟2`,part:12,module:`M13`,title:`液氨储存`,corePoint:`装量系数0.85、严禁满液、50℃约2.0MPa`,stem:`液氨储罐充装与储存安全,正确的有( )`,options:[{label:`A`,text:`装量系数取 K=0.85,留足气相空间`},{label:`B`,text:`液氨严禁满液充装,满液状态下温升 3~5℃ 即可能胀破储罐`},{label:`C`,text:`储罐应设液位高高联锁切断进料`},{label:`D`,text:`50℃ 时液氨饱和压力约 0.5MPa`}],answer:[`A`,`B`,`C`],analysis:`D 错:50℃ 约 2.0MPa。`,transfer:[`液氨:装量系数 K=0.85、严禁满液(温升 3~5℃ 即胀破)、50℃ 饱和压力约 2.0MPa。`,`满液储罐受热=液体膨胀超压 → 物理爆炸,是液氨储运头号风险。`],tags:[`液氨`,`装量系数`,`满液`,`饱和压力`,`2.0MPa`]},{id:`模拟2-8`,source:`模拟2`,part:12,module:`M13`,title:`重大危险源`,corePoint:`液氨10t、氢5t、甲烷50t`,stem:`重大危险源辨识(GB 18218-2018),正确的是( )`,options:[{label:`A`,text:`单元内 Σ(q/Q) ≥1 即构成重大危险源`},{label:`B`,text:`液氨临界量为 10t`},{label:`C`,text:`氢气临界量为 5t`},{label:`D`,text:`甲烷/天然气临界量为 5t`}],answer:[`A`,`B`,`C`],analysis:`D 错:甲烷/天然气临界量 50t。`,transfer:[`GB 18218-2018:Σ(q/Q)≥1 即构成;临界量:液氨 10t、氢 5t、甲烷 50t、天然气 50t。`,`辨识单元:生产单元/储存单元分别按边界划分。`],tags:[`重大危险源`,`临界量`,`液氨`,`氢气`,`甲烷`,`GB18218`]},{id:`模拟2-9`,source:`模拟2`,part:12,module:`M13`,title:`职业接触限值`,corePoint:`氨20/30、H₂S MAC10、PC-TWA 定义`,stem:`职业接触限值(GBZ 2.1),正确的有( )`,options:[{label:`A`,text:`氨 PC-TWA 为 20 mg/m³`},{label:`B`,text:`氨 PC-STEL 为 30 mg/m³`},{label:`C`,text:`硫化氢 MAC 为 10 mg/m³`},{label:`D`,text:`PC-TWA 指任何时刻都不得超过的浓度`}],answer:[`A`,`B`,`C`],analysis:`D 错:PC-TWA 是 8h 时间加权平均;MAC 才是任何时刻不得超过。`,transfer:[`氨:PC-TWA 20、PC-STEL 30(mg/m³);H₂S:MAC 10mg/m³。`,`三个限值概念:PC-TWA=8h 加权平均、PC-STEL=短时间(15min)接触限、MAC=任何时刻不得超过。`],tags:[`职业接触限值`,`氨`,`硫化氢`,`PC-TWA`,`PC-STEL`,`MAC`]},{id:`模拟2-26`,source:`模拟2`,part:13,module:`M11`,title:`HAZOP 实操框架`,corePoint:`九步顺序、措施失效、R=L×S、控制层级`,stem:`团体赛 HAZOP 实操分析,正确的做法有( )`,options:[{label:`A`,text:`分析顺序:划分节点 → 描述设计意图 → 选定参数与引导词组合成偏差`},{label:`B`,text:`后果分析应假定现有安全措施失效,分析最严重后果`},{label:`C`,text:`风险定级用风险矩阵 R=L×S(官方附件8)`},{label:`D`,text:`建议措施应遵循"消除 > 替代 > 工程控制 > 管理控制 > PPE"顺序`}],answer:[`A`,`B`,`C`,`D`],analysis:`全部正确。`,transfer:[`团体赛 HAZOP 实操:划节点 → 设计意图 → 偏差(参数+引导词)→ 找原因 → 后果(措施失效)→ 定级 R=L×S → 建议(消除>替代>工程>管理>PPE)。`,`九步流程、后果假定措施失效、官方风险矩阵——三点必记。`],tags:[`团体赛`,`HAZOP实操`,`风险矩阵`,`LS法`,`控制层级`]},{id:`专项1`,source:`专项`,part:1,module:`M1`,title:`工艺单元识别与关注点`,corePoint:`八类单元各看什么`,stem:`关于 HAZOP 分析前对工艺单元的识别与关注点,说法正确的有( )`,options:[{label:`A`,text:`对泵类单元重点看抽空/汽蚀、机封泄漏;泵停或误关进出口阀会引起上游憋压、下游断料`},{label:`B`,text:`对换热器重点看两侧介质互串(管程裂→高压侧串入低压侧)与换热能力下降导致的温度偏差`},{label:`C`,text:`识别单元只需管"有转动、传热或反应"的设备;普通管线段、阀门连通段不属于需要识别的对象`},{label:`D`,text:`对反应器重点看温度与配比是否会引发放热失控、混合是否均匀、进料与移热是否匹配`}],answer:[`A`,`B`,`D`],analysis:`C 错:管线是八类单元积木之一,逆流/堵塞/憋压等大量偏差恰恰发生在普通管线与阀门连通段,必须识别。A/B/D 对应泵、换热器、反应器的关注点正确。`,transfer:[`八类工艺单元积木:管线(流向/倒流/堵塞)、容器(液位/超压)、泵(抽空/汽蚀)、压缩机(喘振/超温)、塔(液泛/淹塔)、反应器(温度/配比/放热)、换热器(互串/换热不足)、加热炉(熄火/炉管超温)。`,`判断误区:只看"主要设备"而忽略管线连接段是新手常错点,逆流类偏差多在管线/阀门段。`],tags:[`工艺单元`,`识别`,`单元`,`M1`,`专项`]},{id:`专项2`,source:`专项`,part:1,module:`M1`,title:`连续流程分层与循环回路`,corePoint:`装置→工段→节点`,stem:`关于连续流程"装置→工段→节点"分层划分,说法正确的有( )`,options:[{label:`A`,text:`一个合成氨装置可整体作为一个节点完成分析,不必再分层切段`},{label:`B`,text:`工段是工艺链上功能相对独立的一段,如造气、变换净化、合成回路、冷冻分离、液氨储运`},{label:`C`,text:`合成回路是闭环:循环气经压缩→合成→分离→再回压缩机;沿闭合回路切段要首尾相接回到起点,不能从中间断开就算完`},{label:`D`,text:`节点切得越细越好,把每条管线每米都单独切出来才能保证不漏`}],answer:[`B`,`C`],analysis:`A 错:整个装置作一个节点过大,细节全被吞掉。D 错:节点应"单一设计意图、边界清楚",过细则碎而无意义。B 工段切分、C 循环回路闭环正确。`,transfer:[`三层:装置(一个工厂)→ 工段(功能相对独立的一段工艺)→ 节点(可单独写设计意图的最小分析段)。`,`循环回路要沿物料流向闭环切段,别从中间断开——漏掉"回到压缩机"这段就漏了循环气带液等偏差。`],tags:[`连续流程`,`分层`,`工段`,`节点`,`闭环`,`M1`,`专项`]},{id:`专项3`,source:`专项`,part:1,module:`M1`,title:`切段原理:判据随阶段变化`,corePoint:`功能/工艺条件/下一设备处切段`,stem:`关于连续流程在何处切段及"开车段与正常段为何要分开",正确的有( )`,options:[{label:`A`,text:`同一合成塔开车升温段(维持 8.5~9.0MPaG、床层向 300℃ 爬升)与正常运行段(约 13~14MPaG、床层 170~432℃)要分成不同节点:两阶段的操作判据与设计意图不同`},{label:`B`,text:`只要设备与管线没有变,无论操作阶段怎么变化,都可以并作同一个节点`},{label:`C`,text:`"功能改变 / 工艺条件改变 / 进入下一台设备"三个切段信号本质同源:都是设计意图变了`},{label:`D`,text:`设计压力 16.5MPaG 这类物理极限不随阶段改变,所以该塔从开车到停车全程只需一个节点`}],answer:[`A`,`C`],analysis:`A 对:升温段与正常段"多高算危险、多高算超压"的判据不同,必须分节点。B/D 错:判据与设计意图变了就要切段,物理极限不变不等于设计意图不变。C 三信号同源正确。`,transfer:[`切段黄金句:节点内"设计意图基本一致";判据(参数/联锁/红线)改变处就是下一个节点。`,`同一个参数在不同节点可能是不同偏差——升温段 8.5~9.0MPaG 是"目标",正常段 13~14MPaG 是"常态",别用错基准。`],tags:[`切段`,`节点`,`开车`,`正常`,`设计意图`,`M1`,`专项`]},{id:`专项4`,source:`专项`,part:1,module:`M1`,title:`节点边界划分(物理+概念)`,corePoint:`边界六条规则`,stem:`关于 HAZOP 节点边界与范围的划分,做法正确的有( )`,options:[{label:`A`,text:`节点起点/终点优先选在阀门、法兰、设备接口等明确的物理边界,便于定位与复查`},{label:`B`,text:`也可用"概念边界",如某压力达到设定高值即判定为超压这类看不见的判据来界定分析范围`},{label:`C`,text:`为了不漏项,把反应器、换热器、高压分离器等串联设备尽量包进同一个节点整体分析`},{label:`D`,text:`节点范围以"单一设计意图、边界清楚、便于记录、覆盖无漏"为适度:太大吞细节、太小碎而无意义`}],answer:[`A`,`B`,`D`],analysis:`C 错:把多台功能不同的设备揉进一个大节点会吞掉逐台设备的偏差细节,违背"单一设计意图"原则。A 物理边界、B 概念边界、D 适度范围均正确。`,transfer:[`边界两类:物理边界(法兰/阀门/管线-设备界面)+ 概念边界(设计限值/联锁设定值)。`,`记忆:能画在图上的边界都有明确"归属感",方便你复盘时原路找到这条节点切在哪。`],tags:[`边界`,`节点`,`物理边界`,`概念边界`,`范围`,`M1`,`专项`]},{id:`专项5`,source:`专项`,part:1,module:`M1`,title:`设计意图六要素`,corePoint:`六要素识别`,stem:`编写某开车升温节点的"设计意图"时,下列属于应写清要素的有( )`,options:[{label:`A`,text:`设计目的:为什么设这个节点——升温建立反应条件,为转化率与热量平衡打基础`},{label:`B`,text:`操作参数与红线:升温速率、操作压力范围、烟道气≤745℃/出口≤525℃ 等不可逾越的红线`},{label:`C`,text:`联锁与报警:床层/塔壁温度高报警、燃料压力低低联锁切断等控制回路与安全联锁`},{label:`D`,text:`当班检修安排与人员名单:谁负责升温、谁来巡检属于设计意图必备内容`}],answer:[`A`,`B`,`C`],analysis:`D 错:检修排程、人员名单属于作业组织,不属于"设计意图"。设计意图六要素 = 设计目的/设计参数/操作参数/复杂控制回路/联锁与报警/特殊操作工况。`,transfer:[`六要素速记:目的+设计参数+操作参数+控制回路+联锁报警+特殊工况。`,`设计参数(16.5MPaG 物理极限)与操作参数(13~14MPaG 运行值)必须分开写,这是高频易错点。`],tags:[`设计意图`,`六要素`,`设计参数`,`操作参数`,`M1`,`专项`]},{id:`专项6`,source:`专项`,part:1,module:`M1`,title:`间歇流程节点切分`,corePoint:`时间切成节点清单`,stem:`关于间歇(批次)流程按"时间"切分节点,做法正确的有( )`,options:[{label:`A`,text:`一批料从惰化→投料→升温→恒温滴加→终止→冷却→出料→清洗可切为多个阶段(幕),逐幕写小设计意图、逐幕做偏差分析`},{label:`B`,text:`阶段之间的"转移点"(如投料开始、出料完成)状态与前后都不同,通常单独成节点分析`},{label:`C`,text:`装置的公共系统(回流、放空、公用工程管线)也要单独成节点,不能只随某一批料分析就带过`},{label:`D`,text:`间歇既然按时间切,主要用时序引导词查步骤先后即可,流量/压力/温度等工艺参数偏差可以略过`}],answer:[`A`,`B`,`C`],analysis:`D 错:时序引导词(早/晚/先/后)是间歇的补充维度,不能替代工艺参数偏差——每个阶段内照样要组"参数+引导词"偏差。A 幕式切分、B 转移点单列、C 公共线单列均正确。`,transfer:[`间歇切分:写阶段剧本→定起止事件→逐幕写小设计意图→转移点单独成节点;一台釜往往等于多个节点。`,`别把"时序偏差"与"参数偏差"二选一,间歇两者都要;参数偏差依然是主体。`],tags:[`间歇流程`,`切分`,`节点`,`时序`,`批次`,`M1`,`专项`]},{id:`专项7`,source:`专项`,part:1,module:`M1`,title:`间歇流程查什么(不只误操作)`,corePoint:`17条错误→后果`,stem:`间歇流程 HAZOP 中,除操作员误操作外,下列需要分析的"错误→后果"链条正确的有( )`,options:[{label:`A`,text:`温度未升到就加入引发剂/进料→物料蓄积,一旦反应启动瞬间放热,可能热失控`},{label:`B`,text:`上一批残留物料未清洗合格就投下一批→物料交叉污染、副反应或配比异常`},{label:`C`,text:`夹套冷却水(公用工程)中断→无法移热;若此时泄放也失效,将超出设备强度`},{label:`D`,text:`间歇 HAZOP 以查操作员"按错按钮、看错表"为主,其余异常交给常规巡检兜底即可`}],answer:[`A`,`B`,`C`],analysis:`D 错:间歇 HAZOP 还要查工艺参数偏差、时间顺序(早/晚/先/后)、步骤遗漏/重复、公用工程失效、设备仪表故障与上批残留,不是只查误操作。A/B/C 链条均成立。`,transfer:[`间歇六条主线:参数偏差 / 时序 EARLY·LATE / 顺序 BEFORE·AFTER / 步骤遗漏重复 / 公用工程失效 / 物料与上批残留。`,`经典热失控:未惰化就投料、先 B 后 A、温度没到加引发剂、滴加过快、搅拌停——每一条都要能说出对应后果。`],tags:[`间歇流程`,`误操作`,`残留`,`公用工程`,`热失控`,`M1`,`专项`]},{id:`专项8`,source:`专项`,part:1,module:`M1`,title:`同一设备的阶段风险`,corePoint:`开车/正常/停车/检修各不同`,stem:`关于同一台设备在不同操作阶段的风险分析,说法正确的有( )`,options:[{label:`A`,text:`高压分离器:开车升压阶段关注升压过快、仪表/联锁投运不全;正常阶段关注液位与压力控制;停车泄压阶段关注排放与可燃气体扩散`},{label:`B`,text:`开车阶段物料尚未进满、负荷低,风险一定低于正常运行阶段`},{label:`C`,text:`检修阶段风险来源不同但同样致命:动火/受限空间前需能量隔离与置换合格,防止检修事故`},{label:`D`,text:`阶段风险分析把设备"开车→正常→停车→检修"的操作剧本写清,为每个阶段单独回答"什么会变坏"`}],answer:[`A`,`C`,`D`],analysis:`B 错:开车阶段恰是事故高发段(超温超压、物料误配、仪表不齐),"没进料=低风险"是错误直觉。A/C/D 分别覆盖运行阶段差异、检修隔离、剧本化分析,均正确。`,transfer:[`一句话:风险跟着"状态剧本"走,不看设备新旧看阶段。`,`开车怕"该有的还没建立"(联锁未投、置换不彻底);停车检修怕"能量没隔离干净"。`],tags:[`阶段风险`,`开车`,`检修`,`停车`,`剧本`,`M1`,`专项`]},{id:`专项9`,source:`专项`,part:1,module:`M1`,title:`工段内再切节点`,corePoint:`切段信号三同源`,stem:`在已划分的工段(如合成回路)内部再切节点,下列做法正确的有( )`,options:[{label:`A`,text:`凡"进入下一台设备"(压缩机→合成塔→废热回收→分离器)处,都可能是切段位置`},{label:`B`,text:`凡"工艺条件明显改变"(如由 13~14MPaG 高压侧降至低压闪蒸侧)处要切开,高低压界面往往就是事故界面`},{label:`C`,text:`凡"功能改变"(由压缩增压改为反应、由反应改为分离)处要切开`},{label:`D`,text:`划分层级只能是"装置→工段→节点"三层,工段内部不允许再有切段`}],answer:[`A`,`B`,`C`],analysis:`D 错:三层是描述习惯,不是硬性只允许三层——工段内部按"功能/工艺条件/下台设备"三信号继续切节点正是方法本身。A/B/C 对应三个切段信号,正确。`,transfer:[`切段三信号(记忆):换功能、变工况、进下一台设备——三者本质都是"设计意图变了"。`,`高低压界面、串并联切换点、开车升温与正常运行的过渡点,都是切段高发处。`],tags:[`切段`,`工段`,`高低压界面`,`设计意图`,`M1`,`专项`]},{id:`专项10`,source:`专项`,part:1,module:`M2`,title:`偏差组合的有效性`,corePoint:`剔除无意义组合`,stem:`关于用"引导词 + 工艺参数"组成偏差并进行筛选,说法正确的有( )`,options:[{label:`A`,text:`偏差 = 引导词 + 工艺参数 = 对设计意图的偏离,如"流量/无""压力/过高"`},{label:`B`,text:`并非所有"引导词+参数"组合都有分析意义:该处根本不存在或对设计意图无影响的组合应剔除,避免分析发散`},{label:`C`,text:`只要工艺参数名能列出,就可以直接作为该节点的偏差使用,不必看该处是否有该参数的设计含义`},{label:`D`,text:`同一节点的偏差组合一旦选定,分析过程中不再随位置、段落的不同而变化`}],answer:[`A`,`B`],analysis:`C 错:参数必须对该处设计意图有意义才可组偏差(如对纯气相线组"液位/高"通常无意义)。D 错:节点内随位置/段落不同,适用偏差组合可能不同,需结合实际裁剪。`,transfer:[`先写设计意图,再挑"该处真存在的参数",最后用有意义的引导词去组偏差——顺序别反。`,`引导词不是越多越好:无效组合会稀释分析,把精力从真正的危险组合上带走。`],tags:[`偏差`,`引导词`,`工艺参数`,`组合`,`M2`,`专项`]},{id:`专项11`,source:`专项`,part:2,module:`M2`,title:`流量偏差:原因与后果`,corePoint:`无/大/小/逆流`,stem:`泵与管线系统的流量偏差,原因与后果分析正确的有( )`,options:[{label:`A`,text:`泵入口抽空/汽蚀、泵跳停、上游容器液位过低、出口阀误关→流量下降直至无流量`},{label:`B`,text:`止回阀失效使下游高压介质倒流回泵及上游→"流量/逆流"偏差,可能损坏泵并污染上游`},{label:`C`,text:`切换操作失误使两台泵并联同时运行→流量过大,可能使下游塔液泛、换热器超负荷`},{label:`D`,text:`流量偏差多为运行波动,重开阀门调回即可,一般不会引发系统级后果`}],answer:[`A`,`B`,`C`],analysis:`D 错:断流可能使受热设备干烧/超温、机泵损坏、下游失去冷却或密封;逆流可能击穿止回阀后的低压系统——流量偏差后果可上到系统级。A/B/C 原因链正确。`,transfer:[`流量四偏差:无(泵停/阀关/断料)、小(抽空/汽蚀/堵塞)、大(并泵/阀开过大)、逆(止回失效/倒灌)。`,`凡是"下游靠这股流量冷却/密封/增压"的,流量一去,后果立刻放大——按"失去冷却/密封"推极限。`],tags:[`流量`,`逆流`,`泵`,`汽蚀`,`后果`,`M2`,`专项`]},{id:`专项12`,source:`专项`,part:2,module:`M2`,title:`超压:安全阀也失效的极限`,corePoint:`措施失效假设推最坏`,stem:`合成回路超压偏差的分析,做法正确的有( )`,options:[{label:`A`,text:`超压原因可包括:循环气量积聚(冷却失效)、压缩量过大、泄压/放空路径被误关、开车阶段升压过快`},{label:`B`,text:`回路设计压力 16.5MPaG,配有高压联锁(PI037002);超压时正常缓解路径先由联锁/泄放阀动作`},{label:`C`,text:`若进一步假设泄放阀也失效,压力继续上升超过设备强度→高压容器/回路破裂、高压氢气泄漏并可能着火,这是该偏差的极限后果`},{label:`D`,text:`只要装好了安全泄放阀,分析后果时就可以不再考虑设备本身超压破裂的可能`}],answer:[`A`,`B`,`C`],analysis:`D 错:安全阀是缓解超压的保护层,分析"最严重后果"时按 HAZOP 惯例假定现有措施失效(泄放阀也有 PFD)。A 原因、B 正常缓解路径、C 泄放失效后的极限后果均正确。`,transfer:[`后果推法:超压→联锁先动→泄放阀再泄→若再失效→超出强度破裂。逐层"措施失效"推下去,最后那层才是要写进后果的极限。`,`联锁测点在阀上游等布置缺陷,会让"泄放阀该动时没动"的共因失效放大——分析独立性别想当然。`],tags:[`超压`,`安全阀`,`泄放`,`联锁`,`失效`,`极限后果`,`M2`,`专项`]},{id:`专项13`,source:`专项`,part:2,module:`M2`,title:`负压偏差`,corePoint:`负压=压瘪+抽空气`,stem:`关于负压(压力/过低)偏差,分析正确的有( )`,options:[{label:`A`,text:`设备泄压/吹扫后快速冷却、蒸汽系统冷凝等可使容器形成负压,真空度超出设计→被大气压压瘪`},{label:`B`,text:`负压还会把外部空气从法兰/密封/破损处抽入;若系统内介质在含氧气氛下可燃,则形成爆炸性气氛`},{label:`C`,text:`常压/微正压储罐在液位下降过快、顶部呼吸阀堵塞时也可能出现负压`},{label:`D`,text:`负压只发生在刻意设计的真空系统;常压设备不存在负压风险`}],answer:[`A`,`B`,`C`],analysis:`D 错:只要容器被密闭冷却/抽空就会形成负压,常压储罐也不例外。A 压瘪、B 抽入空气形成爆燃气氛、C 呼吸阀堵塞三类均需覆盖。`,transfer:[`负压两条线:一怕"压瘪"(超真空→失稳),二怕"抽空气"(氧进来→与可燃介质形成爆燃氛围)。`,`切换/泄压工况、蒸汽伴热系统是负压偏差的高发场合,别只看真空泵那类"正经真空系统"。`],tags:[`负压`,`真空`,`压瘪`,`空气`,`储罐`,`M2`,`专项`]},{id:`专项14`,source:`专项`,part:2,module:`M2`,title:`超温:反应器热失控`,corePoint:`移热失效→飞温→烧结/失效`,stem:`对放热反应器/合成塔超温偏差的深挖,正确的是( )`,options:[{label:`A`,text:`超温原因:冷却中断或能力不足、搅拌失效、进料配比失衡、催化剂活性突升、升温速率过快`},{label:`B`,text:`合成塔超温后果链:床层超过约 432℃→催化剂烧结失活、内件过热强度下降;若继续超温超压且联锁/泄放失效→内件损坏甚至塔体失效`},{label:`C`,text:`治理按 LOPA 分层:温度高报与减负荷联锁→紧急泄放→(再失效)→设备失效;每一层都能独立动作才谈得上可靠`},{label:`D`,text:`升温阶段温度上升快是正常的,只要不超红线,升温速率本身无需作为偏差关注`}],answer:[`A`,`B`,`C`],analysis:`D 错:升温速率是间歇/开车阶段的关键操作参数,"升温/过高(MORE)"过快本身就是一个要分析的偏差(如 45℃/h 超限)。A/B/C 覆盖原因、后果链与分层治理,正确。`,transfer:[`超温深挖三段:找移热去哪了(冷却/搅拌/配比)→ 推床层与内件谁先受不了(烧结/强度)→ 分层给措施(报警联锁→泄放→设备失效)。`,`记忆锚点:催化剂床层 ≤432℃、内件设计温度 280℃、升温速率 45℃/h——超限即偏离设计意图。`],tags:[`超温`,`热失控`,`催化剂`,`温度`,`LOPA`,`M2`,`专项`]},{id:`专项15`,source:`专项`,part:2,module:`M2`,title:`液位偏差:低窜压·高带液`,corePoint:`液位两头都危险`,stem:`对高压分离器液位偏差的分析,正确的有( )`,options:[{label:`A`,text:`液位过低甚至空液位→失去液封,高压气体直接窜入下游低压闪蒸系统,属高低压界面被破坏的典型`},{label:`B`,text:`窜压后果:低压设备超压甚至破裂、物料大量泄放;低压侧承压不足正是把液位当关键参数的原因`},{label:`C`,text:`液位过高(满液)→气液分离空间不足,液体被夹带进循环气,可能损坏下游循环压缩机`},{label:`D`,text:`液位只影响本容器,波动不会波及下游压力与机泵`}],answer:[`A`,`B`,`C`],analysis:`D 错:空液位→高压窜低压、满液→带液进压缩机,液位偏差的下游后果都是系统级。A/B/C 分别覆盖低液位窜压、窜压后果、高液位带液,均正确。`,transfer:[`液位"两头都危险":低→失去液封窜压;高→分离失效带液。控制目标是把液位维持在设计窗口中间。`,`高低压界面处请多看一眼:止回阀、液封、泄放、联锁哪个失效会先把界面的"墙"打穿。`],tags:[`液位`,`窜压`,`带液`,`高压分离器`,`高低压界面`,`M2`,`专项`]},{id:`专项16`,source:`专项`,part:2,module:`M2`,title:`组分/毒物:催化剂中毒`,corePoint:`毒物累积→中毒→恶性循环`,stem:`对合成回路新鲜气带入毒物、组分失衡的分析,正确的有( )`,options:[{label:`A`,text:`新鲜气带 CO、CO₂、油等毒物→循环气中毒物浓度超过指标→催化剂中毒失活、转化率下降`},{label:`B`,text:`为维持产量被迫提温提压→中毒进一步加深,形成"中毒→提温→更快失活"的恶性循环`},{label:`C`,text:`循环流程杂质"只进不出"会累积,需靠弛放(排放部分循环气)控制惰性气与杂质浓度`},{label:`D`,text:`催化剂抗毒能力强,毒物就不必作为组分偏差纳入分析`}],answer:[`A`,`B`,`C`],analysis:`D 错:再抗毒也有上限,毒物/杂质是组分偏差的标准分析对象,还与催化剂寿命、出口质量相关。A/B/C 覆盖中毒机理、恶性循环与弛放控制,正确。`,transfer:[`组分偏差套路:杂质哪来的(新鲜气/副反应/残留)→ 会伤谁(催化剂/塔器/下游质量)→ 怎么控(精制/弛放/定期更换)。`,`合成回路毒物红线参考:CO+CO₂ 含量须维持在极低水平(如低于 10ppm 量级),超标即偏离设计意图。`],tags:[`组分`,`毒物`,`催化剂中毒`,`弛放`,`杂质累积`,`M2`,`专项`]},{id:`专项17`,source:`专项`,part:2,module:`M2`,title:`混合/搅拌失效`,corePoint:`不均即热点`,stem:`对强放热反应体系"混合/搅拌"偏差的分析,正确的有( )`,options:[{label:`A`,text:`搅拌失效(停转/断桨)→体系混合不均→局部反应物积累形成热点→温度飞升,属"混合/不足"`},{label:`B`,text:`滴加过快、在温度/催化剂条件未达到时加入引发剂→物料蓄积,反应一旦启动瞬间放热→迟滞型热失控`},{label:`C`,text:`冷却失效与搅拌失效同时发生时,若泄放也失效,可能超出设备压力/温度极限而爆裂——后果分析应覆盖这一组合`},{label:`D`,text:`放热反应的温度控制主要靠操作员盯表、发现异常手动停,不必依赖自动联锁`}],answer:[`A`,`B`,`C`],analysis:`D 错:手动处置有响应时间与人为遗漏,放热失控需有自动联锁/泄放作为独立保护层,"靠人盯"不是 HAZOP 认可的独立措施。A/B/C 分别覆盖不均热点、迟滞放热与组合失效,正确。`,transfer:[`混合失效的一句话:不是整锅同时变坏,是"局部先坏"——不均即热点,热点即失控起点。`,`热失控三种喂料错误都要能说:加错、先加后加颠倒、温度没到就加。`],tags:[`混合`,`搅拌`,`热点`,`热失控`,`迟滞`,`M2`,`专项`]},{id:`专项18`,source:`专项`,part:2,module:`M2`,title:`相态/两相流`,corePoint:`闪蒸·汽蚀·偏流`,stem:`关于相态变化与两相流相关的分析,正确的有( )`,options:[{label:`A`,text:`高压液体减压闪蒸形成两相流;两相流经泄放管路时泄放能力明显下降,泄放系统需按两相流校核`},{label:`B`,text:`泵入口液体接近饱和温度、吸入高度不足→汽蚀;入口带气(气缚)→泵打不上量`},{label:`C`,text:`加热炉/换热器管内单相被加热汽化→气阻、偏流→部分炉管过热甚至爆管`},{label:`D`,text:`两相流与单相流对泵选型、泄放能力、换热设计没有实质差别`}],answer:[`A`,`B`,`C`],analysis:`D 错:两相流改变密度、流速与传热特性,直接影响泄放能力、泵 NPSH 与换热裕量,是必须单列分析的一类偏差。A/B/C 覆盖闪蒸泄放、汽蚀气缚、气阻偏流,均正确。`,transfer:[`相态偏差三个挂点:泄放(两相能力打折)、泵(汽蚀/气缚)、炉管(气阻偏流爆管)。`,`凡是"高压液体→减压、低温液体→升温、饱和液→流动"都要多想一步会不会发生相变。`],tags:[`相态`,`两相流`,`闪蒸`,`汽蚀`,`气缚`,`M2`,`专项`]},{id:`专项19`,source:`专项`,part:4,module:`M2`,title:`泄放阀:保护层与失效假设`,corePoint:`PFD≠不会失效`,stem:`把安全泄放阀当作保护层来理解与使用,说法正确的有( )`,options:[{label:`A`,text:`泄放阀是"缓解超压"的保护层,自身有不可忽略的失效概率(PFD);不能因装了阀就认为超压后果不存在`},{label:`B`,text:`LOPA 要求保护层独立、有效、可审计:若泄放阀与上游联锁共用同一测点/同一失效模式,其独立性打折扣`},{label:`C`,text:`后果分析按"现有措施均失效"推最严重后果,再回填建议措施——泄放阀存在并不豁免这一推演`},{label:`D`,text:`联锁与泄放阀都装好后,该节点超压的残余风险即固定为零,无需再写措施`}],answer:[`A`,`B`,`C`],analysis:`D 错:任何保护层都有失效可能,残余风险不会归零,减量到可接受才是目标。A/B/C 关于 PFD、独立性与"措施失效假设"均正确。`,transfer:[`泄放阀位置:PFD 很小,不是零;LOPA 里它是一层保护,永远当"可能失效"来推极限后果。`,`独立性检查三连:测点共用了吗?能源(仪表风/电)共用了吗?维修/校验排程重合了吗?`],tags:[`泄放阀`,`PFD`,`LOPA`,`保护层`,`独立性`,`M2`,`专项`]},{id:`专项20`,source:`专项`,part:2,module:`M2`,title:`高低压界面逆流(REVERSE)`,corePoint:`止回阀可失效→低压侧需能承受`,stem:`对高压系统向低压系统"逆流/窜压"偏差的分析,正确的有( )`,options:[{label:`A`,text:`"相逆(REVERSE)"典型触发:止回阀失效、压缩机停车后高压侧回泄、误开切断阀使两个不同压力系统并联`},{label:`B`,text:`防止高压倒流不能只依赖一只止回阀:它可失效;低压侧要么设计成能承受高压,要么配独立的超压泄放+联锁隔离`},{label:`C`,text:`一旦低压侧不能承受高压而发生窜压,常表现为灾难性破裂;故高低压界面常单独设节点重点分析`},{label:`D`,text:`止回阀属机械高可靠件,装上后逆向流风险可以不再考虑`}],answer:[`A`,`B`,`C`],analysis:`D 错:止回阀本身会失效(卡涩、阀芯脱落、反向不严),属可失效的保护层。A/B/C 覆盖触发场景、本质安全设计取向与界面风险,正确。`,transfer:[`高低压界面安全三问:低压侧能不能承受高压?有没有独立泄放?高压侧停机时会不会通过并联/止回把压力送过去?`,`别把"装了止回阀"当结论写进措施——要写就写"低压侧能承受+泄放校核+定期检验止回阀"。`],tags:[`相逆`,`逆流`,`窜压`,`止回阀`,`高低压界面`,`M2`,`专项`]}],Bn=`hazop-quiz:progress`,Vn=`hazop-quiz:settings`,Hn={apiKey:``,baseUrl:`https://api.openai.com/v1`,model:`gpt-4o-mini`};function Un(e,t){if(!e)return t;try{return JSON.parse(e)}catch{return t}}function Wn(){try{return Un(localStorage.getItem(Bn),{})}catch{return{}}}function Gn(e){try{let t=Wn();t[e.questionId]=e,localStorage.setItem(Bn,JSON.stringify(t))}catch{}}function Kn(e){return Wn()[e]}function qn(){try{localStorage.removeItem(Bn)}catch{}}function Jn(){try{return{. HAZOP(危险与可操作性分析)= 请一批内行专家开会,拿着装置图纸,一个部位一个部位地问"万一出了岔子会怎样",把危险提前找出来。就像给装置做一次"安全体检"。

📘 核心讲解
· 关键公式:偏差 = 引导词 + 工艺参数。
  大白话:引导词是 7 个"挑刺的角度"(没有/多了/少了/反了…),工艺参数是"流量、温度、压力"这些被挑刺的对象。比如"冷却水【没有】了" = 引导词"没有"(NO) + 参数"流量"。
· 完整 9 步流程(考试常考顺序):
  ① 定范围做准备(收集 P&ID 图纸、物料安全说明书 SDS、历史事故报告)
  ② 把整套装置切成一段段的"节点"
  ③ 说清每个节点"本该怎样"(设计意图)
  ④ 用引导词找出所有"偏差"(偏差 = 引导词+参数)
  ⑤ 分析每个偏差的原因(Cause)
  ⑥ 假设所有现有安全措施都失效,评估最严重后果(Consequence)
  ⑦ 看现有有哪些保护措施,用风险矩阵给风险定级
  ⑧ 对风险高的场景提出改进建议(建议措施)
  ⑨ 编制报告并跟踪落实
· 依据标准:AQ/T 3049-2013《应用导则》、GB/T 35320-2017(基于 IEC 61882)。

🧪 举个例子
分析节点"反应釜温度",本该保持 60℃。问:"如果温度【过高】(MORE+温度)会怎样?"——原因可能是冷却水阀卡死、催化剂加多;后果(先假定安全阀也失效)是反应加速→超压→爆炸。然后看现状:有温度报警吗?有联锁吗?够不够?——这完整的一问一答,就是一次 HAZOP。

⚠️ 易错提醒
① 后果必须按"所有现有措施全部失效"来想,不能因为"装了安全阀"就觉得没事;
② 偏差 = 引导词 + 参数,答题时"过高(引导词)"和"温度(参数)"要分清楚。`,keywords:[`HAZOP`,`危险与可操作性分析`,`定义`,`九步`,`流程`,`设计意图`,`偏差`,`分析步骤`,`安全体检`],relatedIds:[`样题1`,`模拟1-9`,`模拟2-26`]},{id:`M1-工艺单元识别`,module:`M1`,title:`工艺单元识别:管线/容器/泵/塔/反应器/换热器 各看什么`,content:`💡 一句话理解
先把"分析对象是什么家伙"认准:节点大多数就是一个工艺单元(设备)。不同类型的单元,最怕的失控和该盯的参数不一样——反应器怕超温,塔怕淹塔,换热器怕串漏。

📘 核心讲解
· 常见的节点积木有八类,各有分析重心:
  ① 管线:连续流程最基本的单元,"两容器之间的管线"可以单独成节点。看流量(无/多/少/逆流/间歇)、堵塞、憋压水击、腐蚀减薄泄漏、支线互串。
  ② 容器/储罐(缓冲、沉降、储存、分离):看液位(高→冒罐溢流;低→抽空窜气)、超压与真空、氮封失效进氧、进出料倒错。
  ③ 反应器/反应釜(发生化学转化,风险最集中):看温度(放热失控)、压力、搅拌失效、加料顺序与速率、冷却失效、催化剂活性。
  ④ 塔(精馏/吸收等气液传质):看塔顶塔釜压力与液位、塔压差(淹塔/漏液/堵塞)、塔顶冷量、真空回流。
  ⑤ 泵:看抽空气蚀、出口超压、反转(止回阀失效)、机械密封外漏可燃或有毒介质。
  ⑥ 压缩机:看振动喘振(需要防喘振控制)、出口超温超压、密封与润滑油系统。
  ⑦ 换热器:看结垢降效、内外漏串料(高压侧漏进低压侧→下游超压/污染)、管子破裂、相变位置漂移。
  ⑧ 加热炉/锅炉(明火设备):看燃料泄漏爆燃、炉膛回火与熄火、出口超温、炉管结焦爆管。
· 同一类单元(好几台泵、好几台换热器)会在流程里反复出现,是"同一类节点"的多次分析,别漏也别嫌重复。

🧪 举个例子
合成回路里:K036001 合成气压缩机属"压缩机"类,重点盯喘振与出口超压;R037001 合成塔属"反应器"类,重点盯床层超温(≤432℃)与催化剂活性;S037001 高压氨分离器属"容器/分离"类,重点盯液位——空了会窜压去低压闪蒸罐,满液会把氨带进循环气。

⚠️ 易错提醒
不要因为"只是段管线"就不当节点——管线单独成节点是连续流程的基本功,漏了"两设备之间那段管线"是最常见的覆盖缺口。`,keywords:[`工艺单元`,`单元类型`,`管线`,`容器`,`储罐`,`反应器`,`反应釜`,`塔`,`泵`,`压缩机`,`换热器`,`加热炉`,`设备`],relatedIds:[`模拟1-8`]},{id:`M1-连续流程分层`,module:`M1`,title:`连续流程怎么分工段:装置 → 工段 → 节点(三层)`,content:`💡 一句话理解
连续流程像一条长流水线。分析前别一头扎进单个设备,先"从大到小"分三层:整套装置 → 工艺段(工段)→ 节点,一段一段吃透、编号。

📘 核心讲解
· 第1层 装置全流程(PFD 方块图):先把主物流串成一条工序链——原料从哪进、经过哪些单元操作、产品/副产/排放到哪,心里先有张总图。
· 第2层 工艺段(工段):按"工艺功能/单元操作"把总图切成若干大段,如 原料预处理段、反应段、压缩段、分离段、换热回收段、储存段。段与段之间通常是缓冲罐、界区或参数等级分界;沿主物流的先后顺序,就是分段顺序。
· 第3层 节点:在每个工艺段内,再沿物流把"设备 + 其进出管线"切成一个个分析节点(规则见 M1-节点划分与 M1-边界划分规则卡)。
· 三条大原则:段与段要"接得上"(上一段出口=下一段进口,不重不漏);循环回路、驰放线、公用工程线不能顺着主流程"走丢",要回头闭环单独理清;节点覆盖全部,包括返回到起点的线。
· 合成氨厂例子:工段链 = 造气/原料气制备 → 变换净化(脱硫脱碳)→ 合成气压缩(K036001)→ 氨合成回路 → 氨冷冻分离 → 液氨储存。其中"合成回路"内部再切:压缩机循环段 → 开工加热炉 F037001(开车)→ 合成塔 R037001 → 废热回收 → 冷却 → 高压氨分离 S037001 → 循环气回压缩机(闭环);中压闪蒸 S037002 接低压侧。这套现场 HAZOP 记录表的节点 0-1~6-3,正是把这条回路按"开车升温(0 组)与正常运行参数偏离(1~6 组)"一段段拆开编号分析的。

🧪 举个例子
拿到多页 P&ID 别慌:先指着头问"物料从哪进",沿主物流把塔、釜、压缩机、分离器串一遍,标出每个工艺段的起止;再回身把每段内部的单线节点补齐——整张装置的节点清单就出来了。

⚠️ 易错提醒
① 不能按图纸页次切段(图纸边界≠工艺边界),要按功能与物流切;
② 循环回路不闭环追,从最后一台设备回到第一台设备之间的返回线会成为漏网节点。`,keywords:[`连续流程`,`工段`,`工序`,`分段`,`工艺流程`,`三层`,`PFD`,`循环回路`,`节点`,`装置分解`],relatedIds:[`模拟2-26`]},{id:`M1-切段原理`,module:`M1`,title:`为什么在"设计意图改变/工艺条件改变"处切段`,content:`💡 一句话理解
HAZOP 里的所有偏差,都是拿现实和"设计意图"(本该怎样)比出来的。设计意图一变,同一句话的含义就全变了——所以必须在那里另起一段,重新定义"该怎样"。

📘 核心讲解
· 偏差 = 对设计意图的偏离。先有"应该怎样",才问得出"万一不这样呢";设计意图不清楚,引导词无从套、偏差无从谈起。
· 连续流程在"设计意图改变 / 工艺条件改变 / 到下一设备"三个信号处切段,各自的道理:
  ① 设计意图(功能)改变:任务变了,如从"把料送到储罐"变成"在塔里分离"。前一段的设计意图对后一段根本不适用,硬套会漏掉各自特有的危险。
  ② 工艺条件改变:温度、压力、相态、组分、压力等级发生剧变——危险的"规则"跟着变(是否进入爆炸极限?相变?承压等级换了?),保护手段也不一样。在这种规则突变点切段,等于换一副新眼镜重新看。
  ③ 到下一设备:设备是功能与参数双变化的天然断点,进出口法兰就是现成的边界。
· 三个信号本质是一回事——都是"设计意图变了",所以常并列出现在判断句里,不是互斥选项。
· 装置实例:同一套合成回路,开车升温阶段压力维持 8.5~9.0MPaG、一床入口温度往 300℃ 爬;正常阶段操作压力升到约 13~14MPaG、床层 170~432℃ 运行。"温度多高算危险、压力多高算超压"两阶段判据完全不同——所以这套记录把开车升温(0-1、0-2)与正常运行参数偏离(1-1 起)分成不同节点。
· 反例警示:把高压侧和低压侧糊进一个节点,就会漏掉"高压分离器液位空 → 高压气体窜入低压闪蒸罐超压爆炸"这类跨压级危险(样题13)——中间那道减压边界正是"工艺条件改变"点,必须切开单独看守。

🧪 举个例子
液氨从 13.5MPa 高压分离器减压去 5.5MPa 中压闪蒸罐:若当成一个节点,只会查"液位过高",高低压互窜(液位过低反向倒压、阀门失灵直通高压)就没人查了。切段,等于让"窜压"成为两个节点各自要防的偏差。

⚠️ 易错提醒
答题时"到下一设备为止""设计意图改变处为止""工艺条件改变处为止"三种说法都是连续流程节点终点的正确表述,别只认其中一种就判另两种错。`,keywords:[`设计意图改变`,`工艺条件改变`,`切段`,`边界`,`节点终点`,`为什么切段`,`窜压`,`压力等级`],relatedIds:[`样题13`,`模拟2-26`]},{id:`M1-边界划分规则`,module:`M1`,title:`节点边界怎么划:物理边界 + 概念边界,六条规则`,content:`💡 一句话理解
切节点先定边界:这段从哪起到哪止。边界清清楚楚,分析才不会串台、不漏段、不重复。

📘 核心讲解
· 边界有两种:
  ① 物理边界:管线、法兰、阀门、设备本体、泵/压缩机进出口、调节阀前后等看得见的断点;
  ② 概念边界:设计限值、联锁与报警设定值、操作包络等看不见的界——超过设计限值本身就等于越出了该节点的设计意图。
· 常用断点:管线进出口、设备进出口法兰、切断阀与盲板处、调节阀前后、放空排凝分支点。
· 六条规则(记住):
  ① 节点范围适中——过大细节全漏,过小琐碎重复;经验不足的组长宜划小;
  ② 一个节点最好只装一个设计意图——意图改变就另起一段(见 M1-切段原理卡);
  ③ 全流程覆盖、无遗漏、不重叠——两设备之间的管线、支线、公用工程支管都要有着落;
  ④ 连续流程从进 P&ID 的管线开始切,间歇流程按操作步骤起止切;
  ⑤ 边界在 P&ID 上用色笔标出,写明节点名称与编号(建议措施编号随节点号走,便于追溯);
  ⑥ 公用工程(冷却水/蒸汽/氮气/仪表风/火炬)可单独设节点,也可并入受其影响的主节点分析。

🧪 举个例子
"原料罐 → 泵 → 加热器 → 反应釜"切成 4 段:①原料罐到泵的管线 ②泵 ③泵出口到反应釜(含加热器)的管线 ④反应釜。边界取法兰与进出口,夹在中间的加热器并入泵后管线段一起分析,不单独抢节点。

⚠️ 易错提醒
一整条长流程当一个节点(过大)会漏掉中间工艺条件改变处的危险;一根短管都单开节点(过小)则重复冗余。边界切得对不对,拿"这个节点设计意图是否单一"来校验。`,keywords:[`边界`,`划分边界`,`物理边界`,`概念边界`,`节点划分规则`,`色笔`,`范围适中`,`覆盖`,`无遗漏`],relatedIds:[`模拟1-8`]},{id:`M1-节点划分`,module:`M1`,title:`节点划分与设计意图(把大装置切成小段)`,content:`💡 一句话理解
节点 = 把整套装置切成"一段一段"来分析的小单元。一次分析一小段,保证不漏、不糊。

📘 核心讲解
· 节点是什么:有明确边界的工艺单元——一段管线、一个容器、一台泵、一座塔、一台换热器(间歇流程里一个操作步骤也算一个节点)。
· 连续流程(像自来水一直流)怎么切:从进 P&ID 的管线开始,一直分析到"设计意图改变 / 工艺条件改变 / 到下一个设备"为止。
· 间歇流程(像煮饭一锅锅做)怎么切:按操作步骤划(进料→反应→出料),分析对象以主体设备(反应器)为主。
· 边界要在图纸上用色笔标出;节点不能太大(漏细节)也不能太小(太碎)。
· 设计意图要写清六要素:设计目的、设计参数(压力/温度)、操作参数、复杂控制回路、联锁、特殊操作工况(开停车、检修)。

🧪 举个例子
一条"原料罐 → 泵 → 加热器 → 反应釜"的流程,可切成 4 个节点:①原料罐到泵的管线 ②泵 ③泵到反应釜(含加热器)的管线 ④反应釜。逐段分析,谁都不会漏。

⚠️ 易错提醒
间歇流程不能只按设备分,要按"操作步骤"分——同一个反应釜,投料阶段和反应阶段的风险完全不同。`,keywords:[`节点`,`节点划分`,`设计意图`,`边界`,`间歇流程`,`连续流程`,`泵`,`反应器`],relatedIds:[`模拟1-8`,`样题2`]},{id:`M1-设计意图六要素`,module:`M1`,title:`设计意图六要素:逐个拆开讲(展开自 M1-节点划分)`,content:`💡 一句话理解
"设计意图"= 这个节点"本该干什么、按什么运转",是判定偏差的基准线。描述设计意图要写全六要素,六要素齐了,偏差分析才有着落。

📘 核心讲解
① 设计目的:该节点在整个装置里承担的任务——做什么、产出什么。如合成塔 R037001 让 H₂ 与 N₂ 在铁触媒上放热合成 NH₃(反应热副产蒸汽)。目的定了,才知道该关心哪些参数和危险。
② 设计参数:设备"按什么极限造出来"的——设计压力、设计温度、材质与腐蚀裕度(机械设计包络)。如 R037001 设计 16.5MPa / 280℃(内件)、材质 14Cr1MoR;安全阀整定压力一般≤设计压力。这决定设备本身扛不扛得住。
③ 操作参数:正常运行时必须维持的操作条件与设定值——温度、压力、流量、液位、组分及其正常值、报警/联锁限值。如床层≤432℃、塔壁≤270℃、升温 45℃/h、循环量低报 125000 Nm³/h(FISA-037010)。HAZOP 问的"偏差",绝大多数就是操作参数越界。
④ 复杂控制回路:为稳住操作参数而设的较复杂控制方案——串级、比值、分程、选择性、前馈、超驰等(区别于简单单回路)。写清"谁测量-谁运算-谁执行",判断这个回路失控会产生什么偏差。如开工炉燃料压力与负荷的分程/联锁逻辑、压缩机防喘振控制。
⑤ 联锁(安全联锁系统 SIS):独立于过程控制、异常时自动把装置拉到安全状态的保护——含检测、逻辑、执行机构与表决结构。如 PI-037002 高压联锁、TIAZS 4oo6 表决、燃料压力低低联锁 PSLL 关切断阀 XV。联锁失效=一道保护层消失。
⑥ 特殊操作工况:不在正常稳态内的过渡与边界工况——开停车、升温还原、置换吹扫、紧急停车、检修交出与恢复、冬季防冻。这些阶段参数变化剧烈,往往正是事故高发窗口(展开见 M1-单元阶段风险卡)。

🧪 举个例子
写合成塔"开车升温节点"的设计意图:R037001 以 45℃/h 恒速把床层升温至一床入口≥300℃ 触发反应(目的+操作参数);烟道气≤745℃、工艺气出口≤525℃(红线参数);回路压力维持 8.5~9.0MPaG(操作参数);出口温度高报 TIA-037104、塔壁温度高报(联锁与报警);燃料压力低低联锁关切断阀(联锁,注意这套记录里测点在阀上游的失效隐患)。

⚠️ 易错提醒
"设计参数"(设计压力 16.5MPa 这类物理极限)和"操作参数"(日常该守住的运行值、报警限值)最容易被搞混——先分清题目问的是设备扛不扛得住,还是操作守不守得住。写六要素只写"正常温度压力"五个字了事,等于没写:联锁与特殊工况往往是真正的得分/失分点。`,keywords:[`设计意图`,`六要素`,`设计目的`,`设计参数`,`操作参数`,`复杂控制回路`,`联锁`,`特殊操作工况`,`设计意图改变`],relatedIds:[`模拟2-26`]},{id:`M1-间歇流程`,module:`M1`,title:`间歇流程(批次流程)的特点:风险跟着步骤走`,content:`💡 一句话理解
连续流程 = 自来水一直流;间歇流程 = 煮饭一锅一锅做。间歇流程的危险是"按步骤变化的",所以要按步骤查,还要防"步骤做错"。

📘 核心讲解
间歇(批次)流程四大特点(多选常考):
① 时间依赖:风险随操作阶段/时间动态变化——"时间"本身就是要检查的关键参数;
② 按操作阶段(进料、反应、出料)划分节点,重点对象是反应器;
③ 操作失误(人)占比高,分析小组里必须有操作工;
④ 后果往往比连续流程严重:高浓度、短时间、人员靠得近。
· 重点使用 4 个时序引导词:EARLY/LATE/BEFORE/AFTER(早/晚/先/后)查"步骤时间或顺序错乱"。

🧪 举个例子
一锅料,规程要求"先加 A 加热到 40℃,再加 B"。风险点:①加 B 太早(料还没到温度)→ 反应过猛;②加完 A 忘了开搅拌;③该出料时没出料(反应时间过长)。这些"步骤层面的错误"就是间歇流程 HAZOP 要抓的。

⚠️ 易错提醒
间歇流程 ≠ 只查操作员误操作。工艺参数偏差(温度/压力异常)、公用工程失效(停蒸汽/停水)、步骤遗漏/重复/顺序错误,都要查。`,keywords:[`间歇流程`,`批次流程`,`batch`,`时间依赖`,`操作步骤`,`时序引导词`,`人为因素`,`反应器`],relatedIds:[`样题2`,`模拟1-8`]},{id:`M1-间歇切分详解`,module:`M1`,title:`间歇流程怎么切节点:把"时间"切成节点清单`,content:`💡 一句话理解
连续流程按空间切(把装置切成块),间歇流程按时间切——同一台反应器里,不同时刻是不同的节点,因为每一刻的"设计意图"都不一样。

📘 核心讲解
· 本质:间歇流程时间依赖、风险跟着阶段走;切分对象是操作阶段/步骤,主体设备(反应器)是各阶段的公共舞台。
· 四步切分法:
  ① 写阶段剧本:把整个批次生命周期写成顺序阶段(如 惰化 → 进料A → 升温 → 保温反应 → 加B → 熟化 → 冷却 → 出料 → 清洗吹扫),先把时间线圈清楚;
  ② 每个阶段定起止事件:边界用明确事件标记(开始加料 / 达到规定温度 / 反应结束 / 开始出料),不要用"大约一段时间"这种模糊说法;
  ③ 为每个阶段写该阶段的"小设计意图":目的 + 物料量/温度/压力/搅拌转速/持续时间等参数(如反应阶段:80℃、搅拌 120r/min、保温 4h);
  ④ 阶段之间的转移点(料从储罐进反应器、从反应器进下一设备)也要当节点——倒错料、加过头、串料都发生在转移点上。
· 偏差组合时把"时间"当普通参数用 EARLY/LATE 查,把"步骤顺序"用 BEFORE/AFTER 查:提前升温、忘记加阻聚剂、搅拌晚开、出料过早、步骤遗漏或重复。
· 一台间歇釜的节点清单示例:①进料(量/顺序/速率)→ ②升温(速率)→ ③恒温反应(温度/压力/搅拌/时间)→ ④终止与冷却 → ⑤出料与清洗。每一步风险不同,所以一台釜 = 好几个节点。

🧪 举个例子
聚合釜规程"先加 A 加热到 40℃ 再加 B、加 B 前先开搅拌"。若把整台釜当一个节点,只会查到超温超压;按阶段切后才会逼出:进料阶段加 B 太早(反应过猛)、升温阶段速率过快局部过热、反应阶段忘开搅拌局部暴聚、出料阶段残留单体继续聚合堵管。

⚠️ 易错提醒
① 间歇节点 = 操作阶段,不是"一台设备一个节点";
② 间歇流程不能只分析操作员误操作——各阶段的工艺参数偏差、公用工程失效、时间与顺序错误都要查(样题2、模拟1-8考点)。`,keywords:[`间歇流程`,`切分节点`,`操作阶段`,`阶段剧本`,`转移点`,`反应器`,`批次`,`EARLY`,`LATE`,`BEFORE`,`AFTER`],relatedIds:[`样题2`,`模拟1-8`]},{id:`M1-间歇工艺长啥样`,module:`M1`,title:`常见间歇工艺 + 一套装置和一批料的完整剧本`,content:`💡 一句话理解
间歇工艺就是"一锅一锅做":往反应釜里按配方一批批加料、反应、出料、清洗,再来下一批。常见的有间歇聚合、间歇硝化、间歇加氢、间歇结晶、间歇精馏、医药多步合成。

📘 核心讲解
· 一套典型间歇装置(部件就是分析时的单元积木):
  ① 原料/溶剂高位槽与计量罐——往釜里投料;
  ② 反应釜:夹套(蒸汽加热/冷却水冷却)、搅拌桨、温度/压力/液位仪表;
  ③ 釜顶回流冷凝器 + 放空/尾气处理——回收蒸气、控制压力;
  ④ 安全阀/爆破片——超压保护;
  ⑤ 出料受槽与转移管线——送下一工序;
  ⑥ 公用工程支线:冷却水、蒸汽、氮气(惰化用)。
· 一批料的完整剧本(以"先加 A 溶剂,升温到 60℃ 后滴加 B,保温 2h"的放热反应为例),共 8 幕:
  ① 惰化(氮气置换除氧)→ ② 投料 A(溶剂,计量)→ ③ 升温(夹套蒸汽加热到 60℃)→ ④ 恒温反应(滴加 B,维持 60℃、开搅拌)→ ⑤ 终止/熟化(加终止剂把反应收尾)→ ⑥ 冷却(夹套冷却水降温)→ ⑦ 出料转移(送受槽/下一工序)→ ⑧ 清洗吹扫(为下一批或检修准备)。
· 这台装置的 HAZOP 节点怎么切:节点 = 操作阶段,上面 8 幕就是 8 个时间节点(同一台反应釜贯穿其中多个节点);冷却水/蒸汽/氮气公用支线、回流与放空线再单独拎成辅助节点。每一幕都要单独写"该幕的设计意图"(目的 + 该幕的温度/压力/加料量/搅拌/时间),否则偏差没有基准。

🧪 举个例子
幕④"恒温反应"的设计意图这样写:R-101 内料液维持 60±2℃,B 限速滴加 2h,搅拌 120 r/min,回流冷凝器顶温保持在回收区间。这四句就是"该怎样";后面"滴加太快(流量多)、搅拌停了(转速为 0)、温度冲到 90℃(温度过高)"全对着它来问。

⚠️ 易错提醒
间歇装置不是"反应釜一个节点"——同一台釜 8 幕 8 个节点,每幕的意图与危险都不同。只按设备不按阶段切,等于把整本剧本只看了第一页。`,keywords:[`间歇工艺`,`间歇聚合`,`间歇硝化`,`间歇加氢`,`间歇结晶`,`反应釜`,`高位槽`,`剧本`,`配方`,`8幕`,`回流冷凝器`],relatedIds:[`模拟1-8`]},{id:`M1-间歇每步风险措施`,module:`M1`,title:`间歇流程每步的风险与对应措施(逐幕拆)`,content:`💡 一句话理解
间歇流程的危险跟着"幕"走:惰化怕残留氧气、投料怕加错加多、升温怕过快冲温、反应怕失控、出料怕喷溅——每一幕各防各的,措施要一一配上。

📘 核心讲解
幕① 惰化:风险=置换不彻底,釜内残氧与可燃蒸气处于爆限,遇后续点火源爆炸。措施=氮气置换后氧含量分析合格再投料;排放口引至安全处;控制置换流速防静电。
幕② 投料 A:风险=加错料/计量偏差(多、少、缺组分)、加料过快局部放热集中与静电、高位槽满溢、抽料倒吸。措施=投料单双人复核+计量校验;限速限流;储罐接地与惰化保护;液位/称重高报。
幕③ 升温:风险=升温过快(热惯性冲温)、蒸汽阀卡开持续加热、升温不到位导致后面滴 B 时反应不启动。措施=升温速率程序控制+上限;温度与蒸汽调节阀串级;温度高报联锁切断蒸汽。
幕④ 恒温反应(滴加 B):风险=滴加过快/过量(放热>移除→热失控)、搅拌停或慢(局部热点暴聚)、冷却水中断(热量积聚→超温超压)、回流失效(压力升/蒸气外溢)、温度计假信号。措施=滴加泵限速+计量联锁(超温停滴加);搅拌电流低报/联锁;冷却水低流量联锁+应急冷却;温度双点冗余+高高联锁;安全阀/爆破片+紧急放空至洗涤或火炬。
幕⑤ 终止/熟化:风险=忘加或少加终止剂反应停不下来、熟化时间不足残留活性料。措施=终止剂列入步骤清单双人复核;加后看温度趋势确认反应已停。
幕⑥ 冷却:风险=冷过头结晶/凝固堵管、急冷热应力、蒸汽阀误开返热。措施=降温速率限值+温度串级;设最低温提示。
幕⑦ 出料转移:风险=残压/高温喷溅烫伤、爆沸冲料、放料阀误开串料、管线堵塞憋压、下游受槽超压、静电、有毒蒸气外逸。措施=先泄压降温至指标再放料;双阀+规程顺序;受槽耐压与放空;管道接地;密闭转移+通风。
幕⑧ 清洗/检修:风险=残留活性料遇空气自燃/自聚、溶剂蒸气遇动火爆炸、清釜受限空间缺氧中毒、能量未隔离。措施=排净+多遍溶剂/碱洗水洗;置换检测合格;盲板隔离+断电挂牌;受限空间许可+气体检测+专人监护(作业层交给 JSA 管)。

🧪 举个例子
幕④若"冷却水中断":夹套失去移热 → 反应热持续累积 → 温度压力飙升 → 安全阀起跳仍不够 → 釜体破裂爆炸。保护按 LOPA 分层背:超温停滴加联锁 + 独立冷却水低流量联锁 + 安全阀/爆破片逐层叠加。

⚠️ 易错提醒
措施要写"对症+可执行"(如"超温联锁停滴加泵"),不能写"注意降温"这种空话——和 JSA 写措施的评分逻辑一致。`,keywords:[`间歇流程`,`每步风险`,`风险措施`,`惰化`,`投料`,`升温`,`反应`,`终止剂`,`冷却`,`出料`,`清洗`,`对策`],relatedIds:[`样题2`,`模拟1-8`]},{id:`M1-间歇查什么清单`,module:`M1`,title:`间歇流程查什么(完整清单):不只查操作员错误`,content:`💡 一句话理解
一句话回答:间歇流程要查的是 工艺参数 + 时间顺序 + 步骤完整性 + 公用工程 + 设备仪表 + 物料与上批残留,操作员错误只是其中一小块。样题2 的陷阱正是"只需分析操作人员误操作"这句话是错的。

📘 核心讲解
按阶段(节点)逐幕展开,除操作员错误外还有 6 条主线:
① 工艺参数偏离(每幕各自的):温度/压力/流量(加料量)/液位/搅拌转速/组分浓度——用 7 个引导词×参数 组合;
② 时间类偏差:EARLY/LATE(提前/滞后),如加料太早、降温太晚;
③ 顺序类偏差:BEFORE/AFTER(先/后),如该先加 A 却先加了 B;
④ 步骤完整性:遗漏(忘一步)、重复(同一料加两遍)、多余(做了规程外的动作);
⑤ 公用工程失效:电、冷却水、蒸汽、仪表风、氮气中断或波动;
⑥ 设备与仪表故障:搅拌、温度计、液位计、调节阀、安全阀拒动或误动;
⑦ 物料与来源:错料、混入杂质、批次与浓度漂移、上一批残留造成的交叉污染。

常见错误→后果 一一枚举(判断/推理题直接用):
· 未惰化/置换不完全 → 釜内氧+可燃蒸气处于爆限 → 点火爆炸(顶格);
· 加错料(OTHER THAN)→ 意外副反应、剧毒或爆炸性产物、催化失控;
· 多加料/重复加料(MORE)→ 放热总量超过移除能力 → 飞温、超压;
· 缺料/少一组分(LESS、PART OF)→ 配比失衡,高活性料残留,后续接触引发危险;
· 加料顺序颠倒(先 B 后 A)→ 低温高浓度剧烈反应 → 快速放热失控;
· 升温过快 → 局部过热+冲温 → 溶剂汽化/分解/反应提前;
· 温度没到就加引发剂(EARLY)→ 反应不启动、物料积存,之后集中反应 → 蓄积热爆炸;
· 滴加过快/过量 → 放热速度超过冷却移除 → 热失控;
· 搅拌停或慢 → 局部浓度热点 → 暴聚;传热不均 → 飞温;
· 冷却水中断 → 热量无法移走 → 超温超压 → 安全阀也失效时爆裂(最重后果链);
· 忘降温/保温过长(LATE)→ 过反应/副反应 → 焦化树脂化、釜内结块;
· 保温过短 → 转化不足,残留单体出料后在储罐自聚放热;
· 忘加终止剂/阻聚剂(步骤遗漏)→ 反应停不下来,温度持续上升失控;
· 有残压/高温就出料 → 物料喷溅烫伤、爆沸冲料、蒸气闪燃;
· 放料阀误开 → 串料走错去向、下游容器超装超压;
· 清洗不彻底(上批残留)→ 下批交叉污染,残留料遇空气/新料反应;
· 负压段吸入空气/密封漏(压力过低)→ 氧气进入 → 与蒸气形成爆炸性混合物。

🧪 举个例子
答题范本:"间歇流程 HAZOP 除操作员误操作外,还要按阶段查工艺参数偏差、时间(早/晚)、顺序(先/后)、步骤遗漏与重复、公用工程(冷却水/蒸汽)失效、仪表联锁失效以及物料与上批残留——不同错误链到不同后果,如忘加终止剂→持续放热失控,冷却水中断→超压爆裂。"

⚠️ 易错提醒
凡是把间歇 HAZOP 范围缩成"只查操作人员误操作"的表述都是错的(样题2);多选题让你补全时,时间顺序、步骤完整性、公用工程、上批残留这几项最容易被漏选。这些工艺级偏差与 JSA 查的"作业执行危害"是两层,详见 M11-JSA与间歇HAZOP 卡。`,keywords:[`间歇流程`,`查什么`,`不只误操作`,`操作员错误`,`时间顺序`,`步骤遗漏`,`公用工程`,`上批残留`,`错误后果`,`枚举`],relatedIds:[`样题2`,`模拟1-8`]},{id:`M1-单元阶段风险`,module:`M1`,title:`同一台设备:开车/正常/停车/检修阶段风险完全不同`,content:`💡 一句话理解
危险不是贴在设备上的固定标签,而是跟着"阶段"变的。同一台合成塔:开车升温怕烧结,正常运转怕超温超压与催化剂中毒,停车怕热点与泄压过快,检修怕残氢和受限空间。只分析正常稳态,等于只看了老虎不动的样子。

📘 核心讲解
· 为什么阶段不同风险就不同:①物质状态变了(温度、压力、相态、存量);②系统边界是否已建立(开车时压力还没顶稳,停车检修时系统已隔离);③保护层是否在岗(开停车常旁路联锁、安全阀未投用);④人员暴露不同(检修时人在设备内外)。
· 各阶段通用风险画像:
  ① 开车:置换/惰化不彻底遇点火源;升压升温过快(热应力、超调);料加满了反应还没启动;仪表联锁未完全投用。
  ② 正常运行:稳态下的超温超压、冷却/循环失效、腐蚀疲劳、催化剂性能衰减、组分漂移。
  ③ 异常/紧急:超压泄放、联锁动作、紧急停车——关注泄放点离火源多远、往哪里排。
  ④ 停车:系统内存料与余热(热点继续反应)、泄压过快伤内件、冷却不均、防喘振与倒流失效。
  ⑤ 检修(交出/恢复):置换不彻底残留可燃/有毒/窒息介质、能量未隔离(缺盲板)、受限空间作业、检修后误恢复(阀门状态错)。
· 装置实例——合成塔 R037001:开车升温红线=升温≤45℃/h、烟道气≤745℃、工艺气出口≤525℃、回路 8.5~9.0MPaG(超速升温→催化剂烧结、炉管超温);正常阶段盯床层≤432℃、循环量≥125000 Nm³/h、催化剂毒物 CO+CO₂<10ppm;停车泄压防内件损伤;检修氮气置换防残氢。
· 装置实例——高压氨分离器 S037001:正常运行盯液位(空液位→高压气体窜入低压闪蒸罐超压爆炸,即样题13;满液→氨带液冻堵下游);开停车盯升泄压速率与低温(-10℃)脆性;检修盯氨气置换、防冻伤窒息。
· 装置实例——开工加热炉 F037001(明火):开车点火怕炉膛聚集燃料气爆燃(点火前吹扫、火焰检测);正常怕燃料压力低(0.18MPa 低报)熄火、长明灯熄灭、烟道气超温;紧急停车切断燃料时注意该记录中联锁测点在阀上游的失效隐患。

🧪 举个例子
答题/写卷范本:"R037001 节点不只分析正常工况,还要把开车升温、正常运行、停车、检修各立阶段节点——升温阶段 45℃/h 超速即烧结,正常阶段 432℃ 上限靠循环量与冷激分配维持,两阶段的设计意图与判据完全不同。"

⚠️ 易错提醒
写 HAZOP 记录时,同一设备的不同阶段要开不同节点、写各自设计意图;把"开车 + 正常 + 停车"揉进一个节点,是团体赛实操的常见失分点(违背 M1-切段原理,也是六要素第⑥项特殊工况存在的理由)。`,keywords:[`阶段风险`,`开车`,`停车`,`检修`,`正常运转`,`特殊工况`,`时间阶段`,`升温`,`开停车`,`单元阶段`],relatedIds:[`样题2`,`样题13`]},{id:`M1-局限性`,module:`M1`,title:`HAZOP 的局限性(它查不了什么)`,content:`💡 一句话理解
HAZOP 很厉害,但不是万能——它一次只查"一种偏差",查不了"好几件事同时坏"。

📘 核心讲解
主要局限:
① 单偏差假设:一次只分析一个偏差,不覆盖多重故障连锁失效(泵坏 + 阀坏同时发生);
② 对人为因素分析不充分;
③ 本质是定性方法,不能量化"到底多危险"(要说清概率要靠 LOPA);
④ 结果高度依赖人:组长经验 + 小组成员质量决定分析质量("人的质量决定 HAZOP 质量");
⑤ 只看 P&ID/设计资料,和实际运行工况可能有出入;
⑥ 各节点分开分析,节点之间的相互影响处理不充分 → 要配合事件树(ETA)、领结图(Bow-tie)、故障树(FTA)补充;
⑦ 耗时长、成本高。

🧪 举个例子
冷却泵和冷却阀接在同一路电源,一停电两个一起停——这种"共用电源"导致的连锁失效,HAZOP 单个节点分析容易漏,要靠 LOPA 专门查"共因失效"。

⚠️ 易错提醒
判断题陷阱:"HAZOP 能一次性分析多种偏差同时发生" → 错;"结果不依赖人的水平" → 错;"人员依赖"有时被当作"成功条件"而非技术局限,看清问法(样题1考点)。`,keywords:[`HAZOP`,`局限性`,`单偏差`,`定性`,`节点间影响`,`依赖人员`,`连锁失效`],relatedIds:[`样题1`,`模拟1-9`]},{id:`M1-小组与纪律`,module:`M1`,title:`HAZOP 小组怎么组 + 两条开会纪律`,content:`💡 一句话理解
HAZOP 是"开会找茬",会议要有主持人、有记录员,并且遵守两条铁纪律,否则会漏掉危险。

📘 核心讲解
· 小组 4~8 人(至少 4 人):设计、工艺、操作、维修、安全各来一人(多学科)。
· 组长(HAZOP 主席):中立、精通方法、只负责引导提问;不能一人拍板,太强势会把别人的问题压掉。
· 记录员:忠实、完整记录讨论内容,并在图纸上标注。
· 两条铁纪律(常考):
  ① 一次只分析一种偏差,把它分析透,再换下一个;
  ② 先把所有偏差全部找完,再统一讨论整改措施(边找边改会打乱节奏)。

🧪 举个例子
讨论"冷却水没有了"时,有人插嘴"那就加个备用泵呀"——按纪律先记下来,不打断当前偏差;等所有偏差走完,最后统一讨论这条建议。这样分析才完整。

⚠️ 易错提醒
组长不能一人独立完成分析(必须靠团队);记录员不能只记结论(要记全讨论过程)。`,keywords:[`小组`,`组长`,`记录员`,`多学科`,`一次一偏差`,`纪律`,`4到8人`,`会议`],relatedIds:[`模拟1-5`,`模拟1-11`]},{id:`M1-事故案例`,module:`M1`,title:`历史事故案例在 HAZOP 中怎么用`,content:`💡 一句话理解
别人厂里出过的事故,是 HAZOP 最好的"照妖镜":拿事故当题目,反查自己装置会不会也这样。

📘 核心讲解
正确用法:
① 分析前收集同类装置历史事故、未遂事件报告,作为输入资料;
② 对照真实事故反查本装置的 HAZOP 覆盖全不全(有没有漏偏差);
③ 若同类事故的原因在本装置同样存在 → 核实现有保护措施是否有效,必要时上 LOPA 定量;
④ 保护措施必须验证"实际能不能用",不能纸面上有就行。
错误用法(陷阱):
· 装置设了安全措施就不体现事故风险 → 错(要体现,还要验证有效性);
· 照搬事故通报的后果等级 → 错(要结合本装置实际工艺条件);
· 正文罗列了一堆事故,却没说纳入哪个偏差分析 → 错(应反查/纳入)。

🧪 举个例子
某厂同类反应釜因"冷却水中断导致超温"爆炸。这次 HAZOP 把"冷却水中断"列为正式偏差:本装置有没有高位水槽?有没有低流量报警?报警后操作员有时间处理吗?——把一个真实事故,变成了一个完整的偏差分析。

⚠️ 易错提醒
事故案例不是摆着看的,必须"反查自己装置 + 验证保护措施有效性"。`,keywords:[`事故案例`,`未遂事件`,`历史事故`,`反查`,`LOPA`,`保护措施`,`照妖镜`],relatedIds:[`样题7`,`模拟1-10`]},{id:`M2-偏差与七引导词`,module:`M2`,title:`偏差公式 + 七个基本引导词(含口诀)`,content:`💡 一句话理解
HAZOP 的"找茬"就是用 7 个固定角度(引导词)去套每个参数,问"如果它没有、多了、少了、反了会怎样"。

📘 核心讲解
· 偏差 = 引导词 + 工艺参数 = 对设计意图的偏离。

· LESS 少(减量):比应该的少,但还有一点。如流量过小、压力过低、温度过低。
· AS WELL AS 伴随(以及):做该做的事之外又混进了别的。如杂质混入、物料夹带、副反应。
· PART OF 部分:只完成了一部分意图。如缺某组分、部分堵塞、只加了一半料。
· REVERSE 相逆(相反):方向反了。如逆流、反向倒灌。
· OTHER THAN 异常(其它):整件事变成另一件事。如投错料、用错介质、置换误用空气。
时序/顺序 4 个(间歇、分步流程必加):
· EARLY 早 / LATE 晚:时间早晚的偏差(该做的做早了 / 做晚了)。

主参数(最常考):流量、压力、温度、液位、组分/浓度。

【偏差二 · MORE 流量过大】

【偏差一 · MORE 压力过高(超压,核心中的核心)】

【改进建议】

· 超压高发场景做 LOPA:给 SIS 定 SIL 并验证,保证与 BPCS 独立(如分开的变送器);
· 高温高压临氢部位上声发射在线监测 + RBI 检验计划(你装置对 14Cr1MoR 的做法),在材料劣化早期就发现停车,把"爆裂"挡在前面。`,keywords:[`压力`,`超压`,`安全阀`,`爆破片`,`负压`,`真空`,`吸瘪`,`爆裂`,`窜压`,`憋压`,`16.5`,`PI-037002`,`PFD`,`泄压`,`ESD`,`火炬`,`BDV`,`防喘振`],relatedIds:[]},{id:`M2-温度深挖`,module:`M2`,title:`温度深挖:超温/低温 的原因、极限后果、保护与改进`,content:`💡 一句话理解
温度是"材料寿命线"和"催化剂生命线"。温度问题常常"上溯"成压力问题:超温 → 介质气化/分解/失控放热 → 超压。所以温度卡的极限后果要会接到超压那条链上。

📘 核心讲解
【偏差一 · MORE 温度过高】
· 可能原因:① 放热反应失控(投料过快/冷却失效/搅拌停/催化剂活性突变);② 移热不足(冷却中断、换热器结垢、循环量低——合成回路低报 125000 Nm³/h);③ 进料/预热温度偏高;④ 外加热过量(炉膛超温,装置烟道气操作指标 ≤745℃);⑤ 床层偏流造成局部热点;⑥ 催化剂局部飞温。
· 后果链分两路,都要会:
① 热损坏路:材料高温蠕变、内件超温损坏(合成塔内件设计 280℃,超则变形失效)、催化剂烧结失活(床层操作上限 432℃,超温烧结整炉报废);
② 转超压路:介质热分解/气化(如失控放热、H₂ 裂解)→ 压力升 → 若泄放也失效 → 超压爆裂 + 高温可燃气爆炸。

【偏差二 · LESS 温度过低】
· 可能原因:加热不足(蒸汽断)、冷激/冷料过量、反应没启动(催化剂未激活/中毒)、循环量过大把热带走。
· 后果:开车升温不足催化剂起不了活性(合成塔必须先升到活化温度再投料);转化率低;液相介质冷凝积聚(见相态卡);低温部位材质冷脆风险。

【偏差三 · NO 无温升(相当于彻底不反应/不加热)】
· 可能原因:催化剂完全失活、进料根本没进、加热源全断。
· 后果:反应中止 → 原料/中间体累积 → 一旦条件恢复"迟发反应"突然放热(隐蔽超压源)。

【偏差四 · PART OF 局部过热(热点)】
· 可能原因:气流偏流、分布器堵塞、换热局部短路、床层不均。
· 后果:平均温度正常但局部温度爆表 → 局部烧结/烧穿——单点/平均测温抓不住,要多点/床层温度监测。

【保护措施】
· BPCS:温度调节回路 + 多点温度高/低报警(合成塔出口 TIA-037104 高报 535℃、塔壁 TIA-037006 高报 270℃,报警后靠人,PFD 0.1);
· SIS:床层超温联锁停车/降温(合成塔 TIAZS 4oo6,4 取 6 表决,SIS PFD 0.01)、冷却低流量联锁;
· 物料侧:加大循环/冷剂移热、控制投料与配比速率;
· 设备侧:材质按高温设计 + 温度监测防超设计温度;凡超温会转超压的回路末端设安全阀。

【改进建议】
· 床层做多点测温 + 热点趋势识别;冷却回路设低流量联锁并验证;
· 防换热器结垢(水质管理/在线清洗);催化剂做寿命与活性管理,防"活性突变式飞温";
· 超温联锁做 SIL 定级并定期测试(4oo6 表决回路尤其要验证表决逻辑没被旁路)。`,keywords:[`温度`,`超温`,`低温`,`烧结`,`催化剂`,`432`,`280`,`535`,`45度`,`热点`,`温升`,`TIA-037104`,`TIAZS`,`4oo6`,`蠕变`,`烟道气`],relatedIds:[]},{id:`M2-液位深挖`,module:`M2`,title:`液位深挖:高带液 · 低窜气 的原因、极限后果、保护与改进`,content:`💡 一句话理解
液位管"气液别跑错地方":液位太高 → 气体把液体带进不该去的地方(压缩机液击);液位太低/空 → 高压气体突破液封直压低压系统(窜压爆炸)。化工两大致命液位事故就是这两个方向。

📘 核心讲解
【偏差一 · MORE 液位过高】
· 可能原因:液位调节(LIC)阀故障/卡关、出料泵故障或停、进料阀误开过大、液位计故障显示偏低(假低)、蒸汽系统冷凝液积聚。
· 后果:储罐溢流冒罐(环保 + 可燃液火灾);塔釜满液 → 液泛冲塔;气液分离器满液 → 液体被高速气体带进压缩机 → 液击损坏(压缩机最怕带液);冷剂满液 → 换热失效。

【偏差二 · NO / LESS 液位过低或排空(核心高危)】
· 可能原因:LIC 故障开大排液、进料中断、泵抽空过度、液位计故障显示偏高(假高)、排液阀误开、低液位联锁被旁路。
· 后果:泵抽空汽蚀/干转损坏;加热器液位空 → 干烧超温;最致命:高压分离器液位排空 → 失去液封 → 高压气相直接窜入下游低压设备 → 瞬间超压 → 爆裂(典型:高压分离器空液位 → 高压合成气直压低压闪蒸罐,样题 13 同款剧情)。此时即使低压侧有安全阀,泄放量往往不足以应对"窜压",照样爆。

【保护措施】
· BPCS:LIC 液位调节 + 高/低液位报警;
· SIS:高高液位联锁(关进料/停泵)、低低液位联锁(关排液/联锁停车)——两个方向要分清;
· 仪表:双液位计冗余、定期冲洗防假液位;
· 下游:分离器后设带液检测/压缩机入口分液罐 + 高液位保护。

【改进建议】
· 液位计冗余互校(差压 + 磁翻板/雷达,防"假高/假低"误导);
· 把"低低液位联锁关排液"做成独立于 LIC 的 SIF(防液封失效窜压);高压串低压高风险处核算低压侧泄放能力、增设止回与紧急隔离;
· 压缩机入口带液保护联锁(高液位/带液跳车)纳入定期测试。`,keywords:[`液位`,`满液`,`冒罐`,`带液`,`液击`,`液封`,`窜压`,`低压`,`闪蒸罐`,`假液位`,`分离器`,`LIC`,`高液位联锁`],relatedIds:[`样题13`]},{id:`M2-组分深挖`,module:`M2`,title:`组分/浓度深挖:杂质、毒物、配比 的原因、极限后果、保护与改进`,content:`💡 一句话理解
组分管"容器里到底装的是什么"。料对、纯、比例对才安全:混进空气/氧气 → 可燃系统直接爆炸;混进催化剂毒物 → 催化剂报废;配比错 → 反应走样。化学爆炸往往不靠超压,安全阀拦不住,根子在"别混错"。

📘 核心讲解
【偏差一 · MORE / AS WELL AS 杂质、毒物、异物混入】
· 可能原因:① 上游净化工序失效(脱硫/脱碳/甲烷化出口带 CO、CO₂、H₂O);② 吹扫/置换误用空气或介质错误 → 氧气进入可燃系统;③ 润滑油、密封气、冷却介质互漏混入工艺物料;④ 原料气来源异常;⑤ 惰性组分(甲烷/氩等)在循环回路累积(氨合成回路常见)。
· 后果:催化剂中毒失活(氨合成催化剂对 CO+CO₂ 极敏感,限值 <10ppm,超了活性骤降、产氨暴跌);氧气混入 → 可燃气 + 氧在系统压力下点火即爆(化学爆炸,超压泄放救不了);杂质导致产品不合格、后续设备腐蚀。

【偏差二 · LESS / PART OF 缺组分、配比失当】
· 可能原因:一股原料断供、配比控制故障(氨合成理论配比 H₂:N₂ ≈ 3:1)、补氢/补氮不足、加料少加。
· 后果:转化率低、尾气组成漂移、循环气组分失衡;若氧富集或可燃组分浓度落入爆炸区,同样危险。

【偏差三 · OTHER THAN 装错料/介质替代】
· 可能原因:操作员投错、管线错接、检修后未恢复、阀门内漏导致系统互串。
· 后果:发生设计外的化学反应(失控放热)→ 超温超压爆炸;把氧化剂串进可燃系统、把高沸点料串进低压系统,都是最坏的一档。

【保护措施】
· 在线分析仪(组成/水分/氧)+ 超标报警;
· 毒物超标联锁:切断进合成塔阀门(CO+CO₂ <10ppm 超限联锁,你装置做法);
· 配比控制回路;吹扫/置换合格分析 + 规程(先置换分析合格再进料);
· 盲板隔离 + 双人确认防错接串料。

【改进建议】
· 关键组分在线分析冗余并自校验(防仪表滞后/失灵);
· 增设氧含量在线监测与联锁;净化段出口分析做成自动联锁(不只报警);
· 把"置换合格才允许进料/点火"做成联锁而不是口头规程;串料高风险点用盲板 + 锁定管理。`,keywords:[`组分`,`浓度`,`杂质`,`毒物`,`催化剂`,`CO`,`CO2`,`10ppm`,`配比`,`H2`,`N2`,`氧气`,`装错料`,`置换`,`在线分析`,`爆炸极限`],relatedIds:[]},{id:`M2-反应深挖`,module:`M2`,title:`反应/转化深挖:失控与中止 的原因、极限后果、保护与改进`,content:`💡 一句话理解
反应管"变不变、变得多快"。该反应的不反应 → 原料憋着,条件一恢复"迟发反应"突然放热;反应太猛 → 失控,超温超压一起来。反应类偏差常同时撞上温度卡和压力卡。

📘 核心讲解
【偏差一 · MORE 反应过剧 / 失控】
· 可能原因:① 催化剂活性异常(新剂活性高但负荷/配比没跟上、再生过度);② 反应温度失控(冷却失效、搅拌停 → 局部反应物积聚);③ 加料过快、浓度过高、引发剂/催化剂加多;④ 搅拌恢复瞬间"积料"集中反应 → 暴聚/爆聚;⑤ 合成回路:循环量低、床层飞温 → 反应放热加剧。
· 后果:放热远超移热 → 温度飙升 → 介质气化/膨胀 → 超压 → 正常路径靠安全阀/爆破片起跳 + 紧急停车;若安全阀也失效 → 温度压力双突破 → 反应器爆裂、失控化学爆炸/暴聚(极难遏制)。

【偏差二 · LESS / NO 反应中止或不反应】
· 可能原因:催化剂中毒/老化失活、温度不足(没到活化温度)、配比不当、缺引发/加料断。
· 后果:转化率低、产品不合格;更危险的是原料/中间体累积 → 一旦温度上来、催化剂恢复、补料 → "迟发反应"突然集中放热超压——隐蔽超压源,比明火更难防。

【偏差三 · AS WELL AS 副反应/副产物】
· 可能原因:温度/浓度窗口漂移、杂质催化、停留时间过长。
· 后果:生成设计外产物、副反应放热失控、催化剂结焦失活。

【保护措施】
· 反应温度/床层多点监测 + 超温联锁(SIS,合成塔 TIAZS 4oo6);
· 冷却/循环低流量联锁(防移热不足);加料速率与配比联锁;
· 紧急停车(ESD)+ 紧急泄压(BDV/安全阀);催化剂寿命与活性管理。

【改进建议】
· 设计超温-超压联合保护逻辑(反应失控往往同时撞两个参数);
· 在线反应热/转化率监测,提前捕捉失控趋势;
· "搅拌停 → 停机 → 恢复"做联锁,防止恢复瞬间暴聚;催化剂活性在线评估 + 预防性更换;
· 把关键反应器的"温度上限"做成高可靠 SIF(SIL 定级 + 定期测试)。`,keywords:[`反应`,`失控`,`暴聚`,`中止`,`迟发反应`,`副反应`,`催化剂`,`转化`,`放热`,`飞温`,`ESD`],relatedIds:[]},{id:`M2-混合深挖`,module:`M2`,title:`混合/搅拌深挖:不均即热点 的原因、极限后果、保护与改进`,content:`💡 一句话理解
搅拌管"物料匀不匀、温度匀不匀"。不匀的地方浓度和热量局部爆表 → 热点 → 暴聚。所以"搅拌停了"的即时风险不是温度立刻高,而是局部积累,等恢复才爆发——事故常在恢复瞬间。

📘 核心讲解
【偏差一 · NO 搅拌停】
· 可能原因:停电/晃电、电机烧毁、联轴器断、误停、变频故障。
· 后果:放热反应釜内反应物局部高浓度、热量带不走 → 局部热点;若搅拌停时仍在加料或加热 → 积料聚热 → 一旦恢复搅拌,集中反应 → 暴聚 → 超温超压 → 若安全阀也失效 → 反应器爆裂。

【偏差二 · LESS 搅拌减弱】
· 可能原因:电机转速不足、桨叶磨损/脱落、料液黏度升高(聚合、冷却)。
· 后果:混合变差 → 分层/热点;悬浮聚合粒径失控;局部反应速率不均。

【偏差三 · PART OF 局部混合不均】
· 可能原因:加料口附近高浓度、釜内死区、挡板失效、循环泵短路流。
· 后果:局部热点与局部副反应、局部腐蚀;测温点不代表釜内真实温度。

【保护措施】
· 搅拌电流/转速监测 + 报警;搅拌停 → 联锁:停进料、停加热、开紧急冷却;
· 保安电源/备用电源保搅拌;加料与搅拌做联锁(搅拌未建立不许加料)。

【改进建议】
· 搅拌电机/减速机在线振动监测;恢复供电后先降温排险再恢复,防瞬间暴聚;
· 重要釜双搅拌或底轴承监测;把"搅拌建立 → 允许加料"做成硬联锁而非操作规程;
· 固定床类反应器把"气体均布"当搅拌看待:床层多点测温识别偏流/热点。`,keywords:[`搅拌`,`混合`,`停搅拌`,`暴聚`,`热点`,`局部`,`不均`,`转速`,`电流`,`偏流`],relatedIds:[]},{id:`M2-相态深挖`,module:`M2`,title:`相态/两相流深挖:带液、闪蒸、汽蚀 的原因、极限后果、保护与改进`,content:`💡 一句话理解
相态管"物料该是气是液、以什么状态流动"。气体把液体带走 = 带液(压缩机液击);高压液体突然泄到低压 = 闪蒸(体积爆胀数百倍 + 极速降温);液体进泵压力不足 = 汽蚀。这些"相态错乱"往往瞬间发生、破坏力极强。

📘 核心讲解
【带液(气体夹带液体)】
· 可能原因:分离器液位过高、分离/除沫失效、气体流速过高、物料发泡。
· 后果:压缩机入口带液 → 液击 → 叶轮/轴损坏(压缩机最怕液体);带液进反应器 → 局部反应异常;可燃液体被带出系统着火。

【闪蒸(液体突然大量汽化)】
· 可能原因:高压液体(液氨/液化气/高温凝液)突然进入低压(阀误开、安全阀起跳、放空、液封失效)→ 压力骤降 → 液体瞬间闪蒸。
· 后果:体积膨胀上百倍 → 低压设备/管道瞬间超压;汽化吸热 → 急剧降温 → 低温冷脆;两相流冲击管道。低压侧安全阀泄放量常常不够(两相流工况),照样爆——这是高压分离器窜压事故(样题 13)的机理内核。

【凝液积聚 / 积液】
· 可能原因:低点无排凝、换热器凝液满、伴热不足。
· 后果:管线积液 → 冬季冻堵、液击;换热器液满 → 换热失效。

【汽蚀】
· 可能原因:泵入口压力不足(NPSH 不够)、介质温度过高、入口管阻力大。
· 后果:泵汽蚀 → 流量波动、叶轮损坏。

【OTHER THAN 异常相变 / 相态错乱】
· 可能原因:把常温液态物料送进高温低压系统 → 瞬间气化超压;把气体送进泵 → 气缚抽不上。

【保护措施】
· 分离器液位控制 + 联锁(防带液、防液封失效);除沫器/分液罐;
· 压缩机入口带液保护(低液位/带液报警 + 跳车);

暴露率 = 人在危险区域待的时间占比。就是"待了多久"除以"总时间"。

📘 核心讲解
公式:暴露率 = 暴露时间 ÷ 周期总时间。
· 一小时一巡检,每次在裂解炉边约 5 分钟 → 5÷60 ≈ 0.08;
· 每天在现场 12 小时 → 12÷24 = 0.5(按一天算);
· 注意看清题目按"天"还是按"工作时间"算。

🧪 举个例子
员工 8 小时班,其中 4 小时在危险区域:按"一天 24 小时"算暴露率 = 4÷24 ≈ 0.17;按"上班时间 8 小时"算 = 4÷8 = 0.5。LOPA 计算里通常按全天时间占比。

⚠️ 易错提醒

📘 核心讲解
由内到外 8 层:
① 本质安全设计(源头少用危险物料)

③ 关键报警 + 操作员响应(报警响了,人去处理)

⑥ 物理保护·收容(防火堤/防爆墙/事故池)
⑦ 工厂应急响应(厂内消防、堵漏)
⑧ 社区应急响应(周边疏散预案)

后果发生频率 = 初始事件频率(IE) × 使能条件(P_E) × ∏(各 IPL 的 PFD) × 点火概率(P_ig) × 人员暴露概率(P_ex) × 致死概率(P_d)
· IE 初始事件频率:起因多久发生一次(如每年 1 次);
· P_E 使能条件:危险状态占的时间比例(只有 50% 时间进料 → 0.5);
· ∏PFD:各保护层失效概率相乘(安全阀 0.01 × 报警 0.1);
· P_ig 点火概率:泄漏后点着的概率(常取 0.1~0.5);
· P_ex 暴露概率:人员在现场的时间比例(每天 12 小时在场 → 0.5);
· P_d 致死概率:暴露后死亡的概率(0.01~0.5)。

🧪 举个例子
反应器超压事故:起因 1 次/年,使能条件 0.5,安全阀 0.01,点火 0.5,暴露 0.5,致死 0.01。
频率 = 1 × 0.5 × 0.01 × 0.5 × 0.5 × 0.01 = 1.25×10⁻⁵ 次/年。

📘 核心讲解
· 有效性:能在危险事件发生时,以所需能力在所需时间内完成防止后果的功能;
· 独立性:不受初始事件影响、不与其他保护层共因失效;
· 可靠性:该动时能动的概率(用 PFD 量化),靠设计冗余、定期测试维护保证;
· 可审计性:有效性和 PFD 能通过检查、审计、文档记录证明。
· 典型应用:安全阀进出口切断阀加铅封并锁定全开(TSG ZF001)→ 提高"可靠性"(防止误关导致泄压保护失效)。

🧪 举个例子
安全阀前面的手动切断阀,若不铅封锁定全开,检修时被人误关,安全阀就"看不见"了。加铅封+锁开 → 保证泄压保护随时可用,这就是在提高可靠性。

找安全措施时,不只盯着"偏差"这一个环节——原因、中间事件、偏离、后果四个环节都要配措施,而且不限于节点内部。

📘 核心讲解
· 针对原因:备用泵、巡检(防止原因发生);
· 针对中间事件:联锁、隔离阀;
· 针对偏离:BPCS 调节、报警;
· 针对后果:安全阀、围堤、事故池。
· 安全措施不限于本节点:下游装置、全厂公用系统、远程切断也可以算。
· 一条剧情上多个报警,最多只能将两个报警作为独立保护层。

🧪 举个例子

判断一个保护措施独不独立,就问三件事:①和起因共用东西吗?②和其他保护层共用吗?③有没有共因失效?只要"共用",就不独立,不算数。

📘 核心讲解
三问:
① 独立于初始事件吗?
② 独立于其他被计数的 IPL 吗?
③ 有共因失效吗(共用传感器/控制器/执行机构/电源/仪表风/操作员)?
典型不独立情形:
· 与初始事件共用同一块检测仪表(液位计故障 → 同一液位计的高高联锁);

· 共用电源(全厂断电,用同一 UPS 供电的 ESD 一起失灵)。

LEC 是给"作业有多危险"打分的半定量方法:分越高越危险。三个字母代表三个打分项。

📘 核心讲解

· E(Exposure)= 人员暴露于危险环境的频繁程度;
· C(Consequence)= 发生事故可能产生的后果严重性;
· D = 危险性分值,D 越大作业条件越危险。

四原则(口诀"小替缓简"):

· 替代:用更安全的物质或工艺(过氧化氢法替代氯醇法生产环氧丙烷、用水基清洗剂替代溶剂);

标准流程(6 步):

JSA 里每一步的风险用 LS 法打分:先定后果最坏到哪(S),再看现有保护措施能把频率降几级(L)。

· 后果严重度 S:按"最坏可信后果"确定该步骤最严重但合理的后果等级(死亡/重伤/轻伤/财产损失);
· 可能性 L:考虑该步骤现有安全措施:有效措施可降 1 级,特别有效可降 2 级(两档降级——关键考点!);
· 举例:高处作业(2~5m)不系安全带,坠亡后果 S=5;无防护 L=5 → R=25 极度,禁止作业;若系双钩安全带并挂设生命线(特别有效)→ L=3 → R=15,仍需专项审批;

有关系,但不是一回事:间歇流程 HAZOP 查的是"这套工艺会不会出工艺危险"(装置层面);JSA 查的是"今天干这件具体作业,每一步有什么人身危害"(作业层面)。间歇 HAZOP 也按步骤切节点,所以特别容易和 JSA 混淆——分清对象就明白了。

📘 核心讲解
· 对象不同:
  间歇流程 HAZOP = 工艺系统层。分析整套批次工艺与每幕节点的设计意图、工艺参数偏差(温度/压力失控、加料量、顺序、时间),面向"工艺与装置",由设计/工艺/操作/安全团队分析,产出偏差登记册与建议措施;
  JSA = 作业任务层。把一件具体作业(检修、动火、开孔、受限空间清釜)拆成执行步骤,逐步行"有什么危害、风险多大(LS 法)、加什么措施",面向"今天这一活",由作业班组做,与作业许可证绑定。
· 为什么间歇特别容易混:间歇 HAZOP 的节点也是按"步骤/阶段"切的(JSA 也是按步骤拆)——但 HAZOP 分析的是步骤里的工艺参数与设计意图偏差(该幕温度压力、加料次序、保温时间),JSA 分析的是作业执行中的人身与现场危害(能量隔离、气体检测、防坠落、动火/受限空间)。
· 三者关系:
  ① 互补分层:工艺危险用 HAZOP,作业执行危险用 JSA,不重叠也不替代;
  ② 可衔接:HAZOP 识别出的高危操作(清洗、清釜、换催化剂、高风险投料)→ 现场实施时再单独做 JSA 控执行环节;
  ③ 同一装置两者并存的实例:装置现场资料同时给了"合成回路 HAZOP 记录"与"PV101 主燃料气管线开孔装 PT-103 变送器 JSA"——一个管工艺系统,一个管那次具体作业。
· 共同点:都要拆步、找危害、定措施;都用 LS 风险矩阵定级(R=L×S);措施都按"消除>替代>工程>管理>PPE"排。

🧪 举个例子
"大修后清反应釜":工艺层,HAZOP 节点"清洗吹扫"要查"置换不彻底→残留单体遇空气自聚、遇动火爆炸";作业层,清釜人员另做 JSA:受限空间许可、气体检测、强制通风、双人监护、上锁挂牌。同一件事的两层防线。

⚠️ 易错提醒
模拟2-17 类题:D 选项"JSA 属系统级工艺分析,与 HAZOP 作用相同"是错的——层级不同、作用互补。间歇流程 HAZOP 不等于"把每一步写成一份 JSA",它仍是工艺偏差分析,只是按操作阶段来组织。`,keywords:[`JSA`,`间歇流程`,`HAZOP`,`区别`,`任务级`,`系统级`,`工艺层`,`作业层`,`关系`,`分层`,`互补`],relatedIds:[`模拟2-17`,`模拟2-18`]},{id:`M12-FTA事故树`,module:`M12`,title:`FTA 事故树分析(与门/或门/最小割集)`,content:`💡 一句话理解
事故树是从"事故"往下一层层找"为什么会发生"的树状图:用与门、或门表示哪些条件组合起来会出事。

📘 核心讲解
· FTA(事故树/故障树):从顶上事件(不希望发生的事故)开始,用逻辑门自顶向下分解原因——演绎法;
· 与门(AND):所有输入事件都发生,输出才发生(冗余系统,更可靠);
· 或门(OR):任一输入事件发生,输出即发生(任何一个单点故障都能导致顶上事件);
· 最小割集:能导致顶上事件发生的最小事件集合。一阶割集 = 单点故障(最危险,应优先消除);割集阶数越高,同时发生所需条件越多,越不容易发生;
· 提高可靠性:增加与门(冗余)、减少或门。
· 与 ETA 区分:FTA 从顶上事件往下推原因(演绎);ETA 从初始事件往上推后果(归纳)。

🧪 举个例子
顶上事件"储罐满溢":下面是"进料阀关不住(或)液位计坏(或)无人看管(或)"——任何一个发生就满溢,全是单点故障(一阶割集),要逐个优先消除。

⚠️ 易错提醒
与门 = 全部都要发生才出事(风险低);或门 = 任何一个就出事(风险高);单点故障(一阶割集)最需优先处理。`,keywords:[`FTA`,`事故树`,`故障树`,`顶上事件`,`与门`,`或门`,`最小割集`,`单点故障`,`演绎`],relatedIds:[`样题20`,`模拟1-9`]},{id:`M12-ETA事件树`,module:`M12`,title:`ETA 事件树分析`,content:`💡 一句话理解
事件树和事故树相反:从一个"起因"出发,一步步看各层保护动不动,分出各种不同的结果。

📘 核心讲解
· ETA(事件树):从初始事件(IE)出发,按顺序考虑各保护层/安全措施是否成功发挥作用,分支组合出各种可能的后果(成功/失败)——归纳法;
· 每条分支路径 = 一个后果场景;各支路概率 = 各环节成功/失效概率之积;
· 用途:识别导致严重事故的保护层组合、计算各种后果的发生频率;
· 常与 LOPA 配合:ETA 的末端场景频率 = LOPA 中的后果频率。
· 与 FTA 方向相反(归纳);与 Bow-tie 右侧(后果侧)对应。

🧪 举个例子
初始事件"储罐超压":先看压力报警(响/不响)→ 再看安全阀(开/不开)→ 分支成 4 种结果,只有"报警不响 且 安全阀不开"才是爆炸。该路径概率 = 报警失效 0.1 × 安全阀失效 0.01。

⚠️ 易错提醒
ETA 是"从因到果"沿时间展开;保护层顺序就是判断顺序;多分支概率相乘。`,keywords:[`ETA`,`事件树`,`初始事件`,`成功失败`,`概率`,`后果`,`归纳`,`分支`],relatedIds:[`样题20`,`模拟1-9`]},{id:`M12-Bow-tie领结图`,module:`M12`,title:`Bow-tie(领结图)分析`,content:`💡 一句话理解
领结图把"原因→危险事件→后果"画成蝴蝶结,左边挂预防措施,右边挂缓解措施,一眼看出哪道防线在防什么。

📘 核心讲解
· Bow-tie(领结图/蝴蝶结图):将事故的"威胁源 → 顶部事件 → 后果"串成领结形状的风险屏障图;
· 左侧(蝴蝶结左翅):威胁源 → 顶部事件(危险事件,如储罐超压)的路径,路上设"预防性屏障";
· 中央:顶部事件(危险事件);
· 右侧(右翅):顶部事件 → 各种后果(火灾/爆炸/泄漏中毒)的路径,路上设"缓解性屏障";
· 一个威胁 = 一条原因链,一条后果 = 一条后果路径,屏障 = 控制措施(与 HAZOP 保护措施、LOPA 的 IPL 一一对应);
· 优点:可视化展示风险屏障、看出哪道屏障被击穿(失效);
· 与 FTA(左)、ETA(右)逻辑一致。

🧪 举个例子
储罐超压的 Bow-tie:左侧"进料阀卡开 → 超压"路上设预防屏障(液位联锁、压力高报警);中央"超压";右侧"超压 → 爆炸"路上设缓解屏障(安全阀、防火堤、喷淋降温)。

两道防线:第一道"把风险管住"(风险分级管控),第二道"把隐患清掉"(隐患排查治理)。

📘 核心讲解
· 双重预防机制 = 风险分级管控 + 隐患排查治理(两道防线);
· 第一道:风险分级管控——把风险辨识出来、分级管控(源头防控,关口前移);
· 第二道:隐患排查治理——排查管控失效导致的隐患并整改闭环(防止风险演变为事故);
· 原则:把安全风险管控挺在隐患前面,把隐患排查治理挺在事故前面(两个"前");
· 风险与隐患关系:隐患是风险管控失效的后果,是导致事故的"灰犀牛";消除隐患 = 切断"风险 → 事故"的中间环节;
· HAZOP 是风险辨识方法之一,为风险分级管控提供基础。

🧪 举个例子
某装置 HAZOP 辨识出"冷却中断"为高风险 → 第一道防线管住它;某次检查发现冷却水管锈蚀(隐患)→ 第二道防线及时修复,事故没发生。

⚠️ 易错提醒

📘 核心讲解

· 动火:动火作业距易燃易爆设备/管道 ≥10m 为安全距离;分特殊/一级/二级动火;动火前可燃气体分析合格,作业中每 2~4h 复测;

· 高处:坠落高度基准面 2m 及以上(含 2m)即高处作业;特级高处作业 ≥30m;分级管理;
· 吊装:重物 >100t 为一级吊装;10~40t 为三级吊装;
· 盲板抽堵、临时用电、动土、断路:须办理相应作业票证。
口诀:"受限看氧、动火看距离、高处看高度、吊装看吨位"。

🧪 举个例子

· 高于 UEL:氧气不足(贫氧),不能爆炸;
· 爆炸范围越宽、LEL 越低 → 越危险;
· 危险判定:浓度在 LEL~UEL 之间遇点火源即爆;可燃气体报警器测定,报警值取 ≤25%LEL;
· 惰化:用氮气把可燃物浓度压在 LEL 以下(氧浓度限制在极限氧浓度 MOC 以下);
· 常见爆炸极限:氢气 4%~75%(极宽,超危险);液氨 15.5%~27%;一氧化碳 12.5%~74%。

不用离岗`]},{id:`A4`,kind:`rule`,front:`后果等级在「财务(直接经济损失)」维度如何分级?`,back:[`5 重大:≥1000 万`,`4 较大:100~1000 万(含 100)`,`3 一般:10~100 万(含 10)`,`2 低:1~10 万(含 1)`,`1 轻微:<1 万`,`速记:分档 1 万 / 10 万 / 100 万 / 1000 万,含下限`]},{id:`A5`,kind:`rule`,front:`风险发生可能性 L 五级怎么定?(含年发生频率)`,back:[`L5 很高:已有经常性发生记录,年频 >10⁻²`,`L4 高:已知会定期发生,年频 10⁻³~10⁻²`,`L3 中等:可能会发生,年频 10⁻⁴~10⁻³`,`L2 低:发生过但较罕见,年频 10⁻⁵~10⁻⁴`,`L1 很低:未在行业中发生过,年频 <10⁻⁵`]},{id:`A6`,kind:`rule`,front:`判级练习:算 R 并判色级——①L5×S5 ②L4×S5 ③L3×S4 ④L2×S3 ⑤L3×S2 ⑥L1×S5`,back:[`① L5×S5 = 25 → 红·重大`,`② L4×S5 = 20 → 红·重大`,`③ L3×S4 = 12 → 橙·较大`,`④ L2×S3 = 6 → 黄·一般`,`⑤ L3×S2 = 6 → 黄·一般`,`⑥ L1×S5 = 5 → 黄·一般`,`(黄区 4~8;橙区 9~12;红区 ≥15)`]}]},{id:`B`,title:`开车·催化剂升温·温度`,sub:`HAZOP 节点 0-1(过高)/ 0-2(过低)·冷态开车阶段`,emoji:`🔥`,tip:`开车段的温度偏离:高温靠 SIS/报警压,低温后果 S 只有 2。升温速率 45℃/h 是关键限值。`,cards:[{id:`B1`,kind:`case`,front:`冷态开车·催化剂床层升温段「温度过高」:原因是什么?后果、固有风险、靠哪些措施压到多少?`,back:[`原因:炉膛温控回路 TIC-037103 失效,主燃料气阀 PV101 开度过大→热负荷大、出口温度过高`,`后果:升温速率 >45℃/h→催化剂烧结、失活;合成塔内件(中心管/分布器)超温损坏(设计 280℃)`,`固有:L3×S4 = R12(橙·较大)`,`现有措施:出口 TIA-037104 高报 535℃(BPCS+人 0.1);塔壁 TIA-037006 高报 270℃;床层 TIAZS 4oo6 SIS(0.01)`,`残余:L1×S4 = R4(黄·一般)`,`建议:催化剂床层升温速率设定 <45℃/h`]},{id:`B2`,kind:`case`,front:`冷态开车升温段「温度过低」的后果、固有风险?现有措施够吗?`,back:[`原因:炉膛温控失效,主燃料气阀开度过小/加热炉供热不足`,`后果:催化剂无法升温激活;长时间低于活性温度→还原不充分、活性不足,延误开车`,`固有:L3×S2 = R6(黄·一般)——低温偏离后果严重度低(S2)`,`现有措施:无有效独立措施 → 残余仍 L3×S2 = R6`,`建议:出口 TIA-037104 设低报警(BPCS+人 0.1)→ 残余仍 R6(记录:低温 R 未再降)`]},{id:`B3`,kind:`num`,front:`回忆开车升温段核心数值:升温速率上限?内件设计温度?出口/塔壁高报警?`,back:[`催化剂床层升温速率 ≤45℃/h(超此→烧结)`,`合成塔内件(中心管/分布器)设计温度 280℃`,`F037001 工艺气出口温度高报警 535℃(TIA-037104)`,`合成塔一床塔壁温度高报警 270℃(TIA-037006 AH)`]}]},{id:`C`,title:`正常·温度过高`,sub:`HAZOP 节点 1-1~1-4 ·合成塔一/二/三床`,emoji:`🌡️`,tip:`正常运行中控制回路失效类原因,固有 L 常取 5(回路长期投用、失效即偏);渐进型(结垢/给水)L 略低。`,cards:[{id:`C1`,kind:`case`,front:`正常运行:开工加热炉温控失效、主气阀开度过大(一床入口温度过高)。后果与固有风险?和开车段(0-1)差在哪?`,back:[`后果:一床入口温度过高→催化剂烧结、失活;H2 裂解爆炸;内件超温损坏(280℃)`,`固有:L5×S4 = R20(红·重大)——比开车段 0-1 的 L3 高:正常运行时回路长期投用`,`现有措施:出口 TIA-037104 高报 535℃(BPCS+人 0.1);烟道气温度监测 ≤745℃(操作指标);床层 TIAZS 4oo6 SIS(0.01)`,`残余:L1×S4 = R4(黄·一般)`]},{id:`C2`,kind:`case`,front:`一/二/三床入口温度控制回路(TIC-037002A/003H/003D)失效、热气流比例过高。后果与残余风险?`,back:[`后果:一、二、三床入口温度偏高→床层局部超温烧结;床分布器超温损坏`,`固有:L5×S4 = R20(红·重大)`,`现有措施:塔壁 TIA-037006 高报 270℃(BPCS+人 0.1)+ 床层 TIAZS 4oo6 SIS(0.01)+ 规程升温 ≤45℃/h 监盘`,`残余(现有措施后):L2×S4 = R8(黄);记录建议后到 L1×S4 = R4`]},{id:`C3`,kind:`case`,front:`合成回路循环量控制回路失效→循环量偏小。后果?低报警位号与数值?`,back:[`后果:循环量偏小→床层热量带不走→床温升高、催化剂烧结失活;系统热平衡破坏`,`固有:L5×S4 = R20(红·重大)`,`现有措施:循环量指示 FISA-037010 低报警 125000 Nm³/h(BPCS+人 0.1);床层多点温度 TIA-037006/7/8 高报;床层 TIAZS 4oo6 SIS(0.01)`,`残余:L1×S4 = R4(黄·一般)`]},{id:`C4`,kind:`case`,front:`E037001 换热管结垢 / 锅炉给水失效→出口温度逐步升高。后果、固有风险、关联哪台高加联锁?`,back:[`后果:合成塔出口温度升高→E037003 管程入口温度过高→换热器损坏;内件长期高温蠕变损伤`,`固有:L4×S3 = R12(橙·较大)——渐进型故障,L 低于突发回路失效`,`现有措施:床层多点 TIA 高报;直连高加 E037001 出口 TIA-037011 高报;TIAZS-037029A/B/C 高温 SIS 联锁(0.01)`,`残余:L1×S3 = R3(蓝·低)`]},{id:`C5`,kind:`num`,front:`正常运行(高温侧)数值:床层运行上限?烟道气操作指标?循环量低报警?`,back:[`床层运行温度 ≤432℃(操作规程,超温报警即调负荷,防烧结)`,`F037001 烟道气温度操作指标 ≤745℃`,`合成回路循环量低报警 125000 Nm³/h(FISA-037010)`,`内件设计 280℃ / 出口高报 535℃ / 塔壁高报 270℃(与开车段共用)`]}]},{id:`D`,title:`正常·温度过低`,sub:`HAZOP 节点 2-1(循环量偏大)/ 2-2(催化剂中毒)`,emoji:`🧊`,tip:`低温类偏离后果 S 普遍只有 2(以运行中断/波动为主),R 高低主要看 L。`,cards:[{id:`D1`,kind:`case`,front:`正常运行「温度过低」:循环量偏大(冷激气过多)。后果?为何固有 R 不算最高?`,back:[`后果:床层热量带走过多、床温低→反应速率极慢,无法建立正常氨合成循环;未反应物(H2/N2)系统内累积→压力高、后续工况波动`,`固有:L5×S2 = R10(橙·较大)——发生可能高(L5),但以运行中断为主,后果 S 只到 2`,`现有措施:无 → 残余仍 L5×S2 = R10`,`建议:BPCS 报警+联锁(0.1)→ 残余 L4×S2 = R8(黄·一般)`]},{id:`D2`,kind:`case`,front:`催化剂中毒失活(正常运行)由什么信号发现?固有风险与残余?`,back:[`判断信号:新鲜气进料在线分析(CO/CO₂/H₂O 含量,BPCS+管理 0.1);产氨量下降监测(液氨产量计量)`,`后果:反应速率下降、反应中止→床温下降;未反应物累积→压力升高、工况波动`,`固有:L3×S2 = R6(黄)→ 现有措施后残余 L2×S2 = R4`,`关联:毒物超限深度治理(在线分析+联锁)见 H 牌组 6-1`]}]},{id:`E`,title:`压力过高·合成塔超压`,sub:`HAZOP 节点 3-1~3-4 ·回路超设计压力 16.5MPaG`,emoji:`💥`,tip:`超压=最高后果等级(S5),靠「联锁停车(自动)+泄放阀(物理)」两个独立层把残余压到可接受。`,cards:[{id:`E1`,kind:`case`,front:`合成塔超压原因①合成气压缩机防喘振回路失效、循环量过大。后果、固有 R?最终建议措施压到多少?`,back:[`后果:回路压力持续升高→超设计压力 16.5MPaG→设备破裂泄漏;高压合成气(含 H2)泄漏遇火爆炸/火灾`,`固有:L5×S5 = R25(红·重大)——可
